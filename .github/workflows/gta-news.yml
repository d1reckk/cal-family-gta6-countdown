name: GTA VI News - Cal Bot V9

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Cal Bot V9 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python - <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          HISTORY_FILE = "seen_news.json"
          ROLE_ID = "1504921814759903343"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          GEMINI_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          MAX_HISTORY = 1000
          MAX_NEWS_AGE_HOURS = 96

          TRUSTED_SOURCES = {
              "rockstargames.com": 5,
              "take2games.com": 5,
              "nytimes.com": 4,
              "bloomberg.com": 4,
              "reuters.com": 4,
              "ign.com": 4,
              "gamespot.com": 4,
              "pcgamer.com": 4,
              "eurogamer.net": 4,
              "kotaku.com": 3,
              "videogameschronicle.com": 4,
              "vandal.elespanol.com": 3,
              "3djuegos.com": 3,
              "dexerto.com": 2,
              "techpowerup.com": 2
          }

          if not WEBHOOK:
              raise SystemExit("ERROR: falta NEWS_DRAFT_WEBHOOK.")

          if not GEMINI_KEY:
              raise SystemExit("ERROR: falta GEMINI_API_KEY.")

          def normalize(text):
              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(
                  r"[^a-z0-9áéíóúüñ ]+",
                  " ",
                  text
              )

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

          def similarity(a, b):
              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0.0

              return SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()

          def canonical_url(url):
              if not url:
                  return ""

              try:
                  p = urlparse(url)

                  q = parse_qs(
                      p.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc"
                  }

                  q = {
                      k: v
                      for k, v in q.items()
                      if k not in ignored
                  }

                  return urlunparse((
                      p.scheme,
                      p.netloc.lower(),
                      p.path.rstrip("/"),
                      "",
                      urlencode(q, doseq=True),
                      ""
                  ))

              except Exception:
                  return url

          def sha(text):
              return hashlib.sha256(
                  normalize(text).encode("utf-8")
              ).hexdigest()

          def source_domain(url):
              try:
                  host = urlparse(url).netloc.lower()

                  if host.startswith("www."):
                      host = host[4:]

                  return host

              except Exception:
                  return ""

          def source_score(url):
              domain = source_domain(url)

              for name, score in TRUSTED_SOURCES.items():

                  if (
                      domain == name
                      or domain.endswith("." + name)
                  ):
                      return score

              return 1

          def clean_html(text):
              if not text:
                  return ""

              return BeautifulSoup(
                  text,
                  "html.parser"
              ).get_text(
                  " ",
                  strip=True
              )

          def load_history():

              if not os.path.exists(
                  HISTORY_FILE
              ):

                  return {
                      "published": [],
                      "titles": [],
                      "content_hashes": [],
                      "sources": []
                  }

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

              except Exception:

                  data = []

              if isinstance(data, list):

                  data = {
                      "published": data,
                      "titles": [],
                      "content_hashes": [],
                      "sources": []
                  }

              for key in (
                  "published",
                  "titles",
                  "content_hashes",
                  "sources"
              ):

                  if not isinstance(
                      data.get(key),
                      list
                  ):

                      data[key] = []

              return data

          def save_history(history):

              history["published"] = (
                  history["published"][-MAX_HISTORY:]
              )

              history["titles"] = (
                  history["titles"][-MAX_HISTORY:]
              )

              history["content_hashes"] = (
                  history["content_hashes"][-MAX_HISTORY:]
              )

              history["sources"] = (
                  history["sources"][-MAX_HISTORY:]
              )

              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      history,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          history = load_history()

          print("=" * 58)
          print("CAL BOT V9")
          print("EDITOR DE NOTICIAS DE CAL FAMILY")
          print("=" * 58)
          print("Buscando noticias nuevas...")

          feed = feedparser.parse(
              RSS_URL
          )

          if not feed.entries:

              print(
                  "No hay resultados en Google News."
              )

              raise SystemExit(0)

          now = datetime.now(
              timezone.utc
          )

          candidate = None

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_url:
                  continue

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):

                  try:

                      published_time = datetime.fromtimestamp(
                          calendar.timegm(
                              entry.published_parsed
                          ),
                          timezone.utc
                      )

                  except Exception:

                      pass

              if published_time:

                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_NEWS_AGE_HOURS
                  ):

                      print(
                          "Ignorada: noticia demasiado antigua."
                      )

                      continue

              normalized_google = canonical_url(
                  google_url
              )

              raw_id = sha(
                  normalize(title)
                  + "|"
                  + normalized_google
              )

              if raw_id in history["published"]:

                  print(
                      "Ignorada: URL/ID ya publicado."
                  )

                  continue

              duplicate = False

              for old_title in history["titles"][-250:]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.91:

                      duplicate = True
                      break

              if duplicate:

                  print(
                      "Ignorada: título demasiado parecido."
                  )

                  continue

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              candidate = {
                  "id": raw_id,
                  "title": title,
                  "google_url": google_url,
                  "rss": (
                      summary
                      + "\n"
                      + description
                  ).strip()
              }

              break

          if candidate is None:

              print(
                  "No hay candidatos nuevos."
              )

              raise SystemExit(0)

          title = candidate["title"]
          google_url = candidate["google_url"]
          rss_content = candidate["rss"]
          news_id = candidate["id"]

          print("=" * 58)
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print(
              "Fuente aproximada:",
              source_domain(google_url)
          )
          print("=" * 58)

          article_text = ""
          final_source_url = google_url

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
              )
          }

          try:

              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=30,
                  allow_redirects=True
              )

              print(
                  "Estado de página:",
                  page.status_code
              )

              final_source_url = page.url

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup([
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header"
                  ]):

                      element.decompose()

                  paragraphs = []

                  for p in soup.find_all(
                      "p"
                  ):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:

                          paragraphs.append(
                              text
                          )

                  article_text = "\n".join(
                      paragraphs
                  )[:18000]

          except Exception as exc:

              print(
                  "No se pudo extraer el artículo:",
                  exc
              )

          if len(article_text) >= 300:

              source_content = article_text

          elif len(rss_content) >= 100:

              source_content = rss_content

          else:

              print(
                  "DESCARTADA: no hay suficiente contenido."
              )

              raise SystemExit(0)

          content_hash = sha(
              source_content
          )

          if content_hash in history[
              "content_hashes"
          ]:

              print(
                  "DESCARTADA: contenido idéntico."
              )

              raise SystemExit(0)

          previous_titles = (
              history["titles"][-80:]
          )

          previous_titles_text = "\n".join(
              "- " + x
              for x in previous_titles
          )

          domain = source_domain(
              final_source_url
          )

          score = source_score(
              final_source_url
          )

          prompt = f"""
Eres CAL BOT, editor de noticias de CAL FAMILY,
una comunidad dedicada a Grand Theft Auto VI.

Tu función es comportarte como un editor humano cuidadoso.

NO debes publicar todo lo que aparezca en Google News.

Tu trabajo es decidir si el artículo aporta información
REALMENTE NUEVA y útil.

============================================================
PUBLICAR
============================================================

PUBLICA si existe información concreta nueva, por ejemplo:

- anuncio oficial;
- declaración atribuida a Rockstar Games;
- declaración atribuida a Take-Two;
- declaración de un desarrollador;
- entrevista;
- preview;
- hands-on;
- nueva información de gameplay;
- nuevos detalles de personajes;
- nuevos detalles del mundo;
- información de desarrollo;
- información sobre lanzamiento;
- información tecnológica;
- investigación periodística con datos concretos;
- información de un medio reputado claramente atribuida
  a una fuente.

Una fuente periodística NO necesita ser Rockstar para ser válida.

Si una fuente secundaria publica una declaración o dato concreto,
puedes PUBLICARLO siempre dejando claro quién lo informó.

============================================================
DESCARTAR
============================================================

DESCARTA si:

- es exactamente el mismo anuncio;
- es una copia de una noticia anterior;
- solo cambia el titular;
- solo reacciona a otra noticia;
- solo dice que otro medio habló de GTA VI;
- es una opinión sin información nueva;
- es especulación reciclada;
- es un rumor antiguo presentado como nuevo;
- repite información ya publicada;
- no existe ningún dato concreto nuevo;
- el contenido disponible es demasiado limitado;
- el titular promete algo que el artículo no demuestra.

Si tienes dudas:

DESCARTA.

Es preferible perder una noticia menor que llenar Discord
con contenido reciclado.

============================================================
HISTORIAL
============================================================

{previous_titles_text}

============================================================
ARTÍCULO ACTUAL
============================================================

FUENTE:
{domain}

PUNTUACIÓN ORIENTATIVA:
{score}/5

TÍTULO:
{title}

URL:
{final_source_url}

CONTENIDO:
{source_content}

============================================================
VERIFICACIÓN
============================================================

Distingue claramente:

1. HECHO VERIFICABLE
2. DECLARACIÓN DE UNA FUENTE
3. OPINIÓN
4. ANÁLISIS
5. ESPECULACIÓN
6. RUMOR

Nunca presentes opinión, análisis, especulación o rumor
como un hecho confirmado.

Nunca inventes:

- cifras;
- fechas;
- declaraciones;
- personajes;
- características;
- mapas;
- precios;
- ventas;
- duración;
- requisitos;
- información de Rockstar;
- información de Take-Two.

============================================================
RESPUESTA
============================================================

Devuelve SOLO JSON válido:

{{
  "decision": "PUBLICAR" o "DESCARTAR",
  "reason": "explicación breve",
  "category": "Noticias" o "Análisis",
  "title": "título atractivo en español",
  "content": "texto final"
}}

Si DESCARTAS:

"content": ""

Si PUBLICAS:

El contenido debe:

- estar en español;
- ser profesional;
- ser natural;
- ser interesante;
- tener aproximadamente 500-1200 caracteres;
- no repetir información;
- no poner enlaces;
- no mencionar que eres una IA.

Formato:

[Introducción]

**El dato clave**

[Información concreta]

**Por qué importa**

[Relevancia]

⚠️ **Contexto**

[Explicación si la información no es oficial]

No rellenes espacios con información genérica.

Solo escribe información sustentada por el artículo.
"""

          print("=" * 58)
          print(
              "CAL BOT ESTÁ EVALUANDO LA NOTICIA..."
          )
          print("=" * 58)

          gemini_result = None

          for model in GEMINI_MODELS:

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{model}:generateContent"
                  f"?key={GEMINI_KEY}"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.1,
                      "maxOutputTokens": 2200,
                      "responseMimeType": "application/json"
                  }
              }

              for attempt in range(4):

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=90
                      )

                      print(
                          f"Gemini {model}: "
                          f"HTTP {response.status_code}"
                      )

                      if response.status_code == 200:

                          gemini_result = (
                              response.json()
                          )

                          break

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          wait = 5 * (
                              attempt + 1
                          )

                          print(
                              f"Reintentando en {wait}s..."
                          )

                          time.sleep(
                              wait
                          )

                          continue

                      print(
                          response.text[:3000]
                      )

                      break

                  except Exception as exc:

                      print(
                          "Error Gemini:",
                          exc
                      )

                      time.sleep(
                          5 * (attempt + 1)
                      )

              if gemini_result is not None:
                  break

          if gemini_result is None:

              raise SystemExit(
                  "ERROR: Gemini no respondió."
              )

          try:

              parts = (
                  gemini_result
                  .get(
                      "candidates",
                      [{}]
                  )[0]
                  .get(
                      "content",
                      {}
                  )
                  .get(
                      "parts",
                      []
                  )
              )

              ai_text = parts[0].get(
                  "text",
                  ""
              ).strip()

              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              )

              result = json.loads(
                  ai_text
              )

          except Exception as exc:

              print(
                  "ERROR INTERPRETANDO GEMINI:",
                  exc
              )

              print(
                  json.dumps(
                      gemini_result,
                      indent=2,
                      ensure_ascii=False
                  )[:6000]
              )

              raise SystemExit(1)

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()

          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()

          print("=" * 58)

          if decision != "PUBLICAR":

              print(
                  "DESCARTADA POR CAL BOT"
              )

              print(reason)
              print("=" * 58)

              raise SystemExit(0)

          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()

          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()

          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()

          if category not in (
              "Noticias",
              "Análisis"
          ):

              category = "Noticias"

          if not ai_title or not ai_content:

              print(
                  "DESCARTADA: respuesta editorial vacía."
              )

              raise SystemExit(0)

          # SEGUNDA BARRERA ANTI-DUPLICADOS

          for old_title in history[
              "titles"
          ][-300:]:

              if similarity(
                  ai_title,
                  old_title
              ) >= 0.89:

                  print(
                      "DESCARTADA: título editorial duplicado."
                  )

                  raise SystemExit(0)

          ai_content = re.sub(
              r"https?://\S+",
              "",
              ai_content
          ).strip()

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")

          final_message = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {ai_title}\n\n"
              f"{ai_content}\n\n"
              f"🔗 **Fuente original:** "
              f"{final_source_url}\n\n"
              f"⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por "
              f"Cal Bot como borrador editorial. "
              f"Revisa la información antes de "
              f"publicarlo en #noticias.\n\n"
              f"-# Cal Bot V9 · {date_text}"
          )

          if len(final_message) > 1950:

              print(
                  "DESCARTADA: mensaje demasiado largo."
              )

              raise SystemExit(0)

          print("=" * 58)
          print("ENVIANDO A DISCORD...")
          print("=" * 58)

          discord_payload = {
              "content": final_message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [ROLE_ID]
              }
          }

          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )

          print(
              "Discord HTTP:",
              discord_response.status_code
          )

          if not discord_response.ok:

              print(
                  "ERROR DE DISCORD:"
              )

              print(
                  discord_response.text[:4000]
              )

              raise SystemExit(
                  "Discord no confirmó el envío."
              )

          print("=" * 58)
          print(
              "DISCORD CONFIRMÓ EL MENSAJE."
          )
          print("=" * 58)

          # SOLO AHORA SE GUARDA COMO PUBLICADA.

          history["published"].append(
              news_id
          )

          history["titles"].append(
              ai_title
          )

          history["content_hashes"].append(
              content_hash
          )

          history["sources"].append(
              final_source_url
          )

          save_history(history)

          print(
              "Historial actualizado."
          )

          print(
              "NOTICIA PUBLICADA CORRECTAMENTE."
          )

          PY

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
            exit 0
          fi

          git commit -m "Update Cal Bot news history"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Historial guardado correctamente."
              exit 0
            fi

            echo "Push falló. Reintentando..."
            sleep 5
          done

          echo "ERROR: no se pudo guardar el historial."
          exit 1
