name: GTA VI News - Cal Bot V8
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: gta-vi-news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4
      - name: Run Cal Bot
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cal_bot.py
      - name: Save history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_news.json
          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Update Cal Bot news history"
            git push
          fi
