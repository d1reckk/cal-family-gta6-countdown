name: CAL Bot

on:
  workflow_dispatch:

jobs:
  cal-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find project files
        shell: bash
        run: |
          set -e

          echo "=== REPOSITORY ==="
          pwd

          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' | sort

          REQUIREMENTS_FILE="$(find . -type f \( \
            -name 'requirements.txt' -o \
            -name 'requeriments.txt' \
          \) -print -quit)"

          if [ -z "$REQUIREMENTS_FILE" ]; then
            echo "ERROR: No se encontró requirements.txt ni requeriments.txt"
            exit 1
          fi

          BOT_FILE="$(find . -type f -name 'cal_bot.py' -print -quit)"

          if [ -z "$BOT_FILE" ]; then
            echo "ERROR: cal_bot.py no encontrado"
            exit 1
          fi

          echo "Requirements: $REQUIREMENTS_FILE"
          echo "Bot: $BOT_FILE"

          echo "REQUIREMENTS_FILE=$REQUIREMENTS_FILE" >> "$GITHUB_ENV"
          echo "BOT_FILE=$BOT_FILE" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install -r "$REQUIREMENTS_FILE"

      - name: Verify Python syntax
        shell: bash
        run: |
          set -e

          python -m py_compile "$BOT_FILE"

          echo "PYTHON SYNTAX OK"

      - name: Run CAL Bot
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        shell: bash
        run: |
          set -e

          python "$BOT_FILE"
