name: GTA VI News - Cal Bot V4

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Evita que dos ejecuciones del mismo workflow trabajen
# simultáneamente.
concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT
      # ============================================================

      - name: Find and analyze GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import sys

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          MODEL = "gemini-3.5-flash-lite"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          # Número máximo de noticias guardadas.
          MAX_HISTORY = 1000

          # Solo comparamos contra las noticias más recientes.
          # Esto mantiene el prompt pequeño.
          RECENT_HISTORY = 100


          # ============================================================
          # VALIDAR SECRETOS
          # ============================================================

          if not WEBHOOK:

              print("ERROR: falta NEWS_DRAFT_WEBHOOK.")
              sys.exit(1)


          if not GEMINI_KEY:

              print("ERROR: falta GEMINI_API_KEY.")
              sys.exit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_url(url):

              if not url:
                  return ""

              url = url.strip()

              # Elimina parámetros habituales de tracking.
              url = re.sub(
                  r"([?&])(utm_[^&]+|oc=\d+)",
                  "",
                  url,
                  flags=re.IGNORECASE
              )

              url = url.rstrip("?&")

              return url


          def normalize_text(text):

              if not text:
                  return ""

              text = text.lower()

              # Quitar URLs.
              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )

              # Quitar puntuación.
              text = re.sub(
                  r"[^a-z0-9áéíóúüñ\s]",
                  " ",
                  text
              )

              # Espacios múltiples.
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def make_id(url):

              clean = normalize_url(url)

              return hashlib.sha256(
                  clean.encode("utf-8")
              ).hexdigest()


          def title_words(title):

              text = normalize_text(title)

              words = set(text.split())

              # Palabras demasiado genéricas.
              stopwords = {

                  "the",
                  "a",
                  "an",
                  "and",
                  "or",
                  "of",
                  "to",
                  "in",
                  "on",
                  "for",
                  "with",
                  "from",
                  "gta",
                  "grand",
                  "theft",
                  "auto",
                  "vi",
                  "6",

                  "el",
                  "la",
                  "los",
                  "las",
                  "un",
                  "una",
                  "de",
                  "del",
                  "en",
                  "y",
                  "o",
                  "para",
                  "con"

              }

              return {
                  word
                  for word in words
                  if word not in stopwords
                  and len(word) > 2
              }


          def title_similarity(title_a, title_b):

              a = title_words(title_a)
              b = title_words(title_b)

              if not a or not b:
                  return 0.0

              intersection = len(a & b)
              union = len(a | b)

              if union == 0:
                  return 0.0

              return intersection / union


          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          if not isinstance(history, list):

              history = []


          # Compatibilidad con el historial antiguo.
          converted_history = []


          for item in history:

              if isinstance(item, str):

                  converted_history.append({

                      "id": item,

                      "url": "",

                      "title": "",

                      "summary": "",

                      "status": "published"

                  })

              elif isinstance(item, dict):

                  converted_history.append(item)


          history = converted_history


          seen_ids = {

              item.get("id")

              for item in history

              if item.get("id")

          }


          # ============================================================
          # RSS
          # ============================================================

          print("========================================")
          print("CAL BOT V4")
          print("BUSCANDO NOTICIAS NUEVAS...")
          print("========================================")


          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print(
                  "No se encontraron noticias."
              )

              sys.exit(0)


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          article = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              original_link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not original_link:

                  continue


              clean_link = normalize_url(
                  original_link
              )

              news_id = make_id(
                  original_link
              )


              # --------------------------------------------------------
              # 1. MISMA URL / MISMO ID
              # --------------------------------------------------------

              if news_id in seen_ids:

                  print(
                      f"Ignorada: ya existe en historial."
                  )

                  continue


              # --------------------------------------------------------
              # 2. URL DUPLICADA
              # --------------------------------------------------------

              duplicate_url = False


              for old in history:

                  old_url = normalize_url(
                      old.get(
                          "url",
                          ""
                      )
                  )


                  if old_url and old_url == clean_link:

                      duplicate_url = True

                      break


              if duplicate_url:

                  print(
                      "Ignorada: URL duplicada."
                  )

                  continue


              # --------------------------------------------------------
              # 3. TÍTULO MUY PARECIDO
              # --------------------------------------------------------

              similar_title = False


              for old in history[-RECENT_HISTORY:]:

                  old_title = old.get(
                      "title",
                      ""
                  )


                  if not old_title:

                      continue


                  similarity = title_similarity(
                      title,
                      old_title
                  )


                  if similarity >= 0.70:

                      print(
                          "Ignorada: título demasiado "
                          "similar a una noticia anterior."
                      )

                      print(
                          f"Actual: {title}"
                      )

                      print(
                          f"Anterior: {old_title}"
                      )

                      similar_title = True

                      break


              if similar_title:

                  continue


              # --------------------------------------------------------
              # CANDIDATO ENCONTRADO
              # --------------------------------------------------------

              article = {

                  "id": news_id,

                  "title": title,

                  "link": original_link,

                  "clean_link": clean_link

              }

              break


          # ============================================================
          # NO HAY CANDIDATO
          # ============================================================

          if article is None:

              print("========================================")
              print("NO HAY NOTICIAS NUEVAS.")
              print("========================================")

              sys.exit(0)


          title = article["title"]
          link = article["link"]
          clean_link = article["clean_link"]
          news_id = article["id"]


          print("========================================")
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(link)
          print("========================================")


          # ============================================================
          # OBTENER CONTENIDO DEL ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {

                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  )

              }


              page = requests.get(

                  link,

                  headers=headers,

                  timeout=25,

                  allow_redirects=True

              )


              print(
                  f"Estado de la página: "
                  f"{page.status_code}"
              )


              if page.ok:

                  soup = BeautifulSoup(

                      page.text,

                      "html.parser"

                  )


                  for element in soup([

                      "script",
                      "style",
                      "noscript",
                      "svg"

                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(

                          " ",

                          strip=True

                      )


                      if len(text) >= 50:

                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo obtener "
                  "el artículo completo."
              )

              print(error)


          if not article_text:

              article_text = (
                  "No fue posible obtener "
                  "el contenido completo."
              )


          # ============================================================
          # COMPARACIÓN SEMÁNTICA
          # ============================================================

          print("========================================")
          print("COMPARANDO CON NOTICIAS ANTERIORES...")
          print("========================================")


          recent_articles = []


          for old in history[-RECENT_HISTORY:]:

              old_title = old.get(
                  "title",
                  ""
              )

              old_summary = old.get(
                  "summary",
                  ""
              )

              old_url = old.get(
                  "url",
                  ""
              )


              if old_title:

                  recent_articles.append({

                      "title": old_title,

                      "summary": old_summary[:1500],

                      "url": old_url

                  })


          history_for_ai = json.dumps(

              recent_articles,

              ensure_ascii=False,

              indent=2

          )


          duplicate_prompt = f"""

          Eres un editor especializado en detectar
          noticias recicladas sobre Grand Theft Auto VI.

          Debes determinar si una noticia NUEVA trata
          esencialmente sobre la MISMA INFORMACIÓN que
          alguna noticia anterior.

          IMPORTANTE:

          Dos artículos pueden tener:

          - títulos diferentes
          - medios diferentes
          - URLs diferentes
          - redacciones diferentes

          y aun así ser la MISMA NOTICIA.

          Ejemplo:

          Artículo nuevo:
          "GTA 6 podría tener una campaña de 80 horas"

          Artículo anterior:
          "Un desarrollador estima que completar GTA VI
          tomará unas 80 horas"

          Esto debe considerarse DUPLICADO.

          Sin embargo:

          Artículo nuevo:
          "Rockstar confirma una nueva función de GTA VI"

          Artículo anterior:
          "Un desarrollador habla de la duración de GTA VI"

          Esto NO es duplicado.

          Solo considera duplicado cuando la información
          principal sea esencialmente la misma.

          No consideres duplicado simplemente porque
          ambos artículos hablan de GTA VI.

          ============================================================
          NOTICIA NUEVA
          ============================================================

          TÍTULO:

          {title}

          CONTENIDO:

          {article_text[:12000]}

          ============================================================
          HISTORIAL RECIENTE
          ============================================================

          {history_for_ai}

          ============================================================
          RESPUESTA
          ============================================================

          Responde ÚNICAMENTE con JSON válido:

          {{
            "duplicate": true,
            "matched_title": "título de la noticia anterior",
            "reason": "explicación breve"
          }}

          o:

          {{
            "duplicate": false,
            "matched_title": "",
            "reason": "explicación breve"
          }}

          No escribas markdown.
          No escribas nada fuera del JSON.

          """


          duplicate_payload = {

              "contents": [

                  {

                      "parts": [

                          {

                              "text":
                                  duplicate_prompt

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "temperature": 0.0,

                  "maxOutputTokens": 300

              }

          }


          duplicate_response = requests.post(

              GEMINI_URL,

              params={

                  "key": GEMINI_KEY

              },

              headers={

                  "Content-Type":
                      "application/json"

              },

              json=duplicate_payload,

              timeout=90

          )


          if not duplicate_response.ok:

              print("========================================")
              print("ERROR DE GEMINI AL COMPARAR")
              print(duplicate_response.status_code)
              print(duplicate_response.text)
              print("========================================")

              sys.exit(1)


          duplicate_data = duplicate_response.json()


          try:

              duplicate_text = (

                  duplicate_data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
                  .strip()

              )

          except Exception:

              print(
                  "ERROR: respuesta inesperada "
                  "de Gemini."
              )

              print(
                  json.dumps(
                      duplicate_data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              sys.exit(1)


          # Gemini puede devolver JSON dentro de ```json.
          duplicate_text = re.sub(

              r"^```json\s*|\s*```$",

              "",

              duplicate_text,

              flags=re.IGNORECASE

          ).strip()


          try:

              duplicate_result = json.loads(
                  duplicate_text
              )

          except Exception:

              print(
                  "ERROR: Gemini no devolvió JSON válido."
              )

              print(duplicate_text)

              sys.exit(1)


          is_duplicate = bool(

              duplicate_result.get(
                  "duplicate",
                  False
              )

          )


          # ============================================================
          # DESCARTAR RECICLADA
          # ============================================================

          if is_duplicate:

              matched = duplicate_result.get(
                  "matched_title",
                  ""
              )

              reason = duplicate_result.get(
                  "reason",
                  ""
              )


              print("========================================")
              print("NOTICIA RECICLADA")
              print("NO SE PUBLICARÁ")
              print("========================================")

              print(
                  f"Coincide con: {matched}"
              )

              print(
                  f"Razón: {reason}"
              )


              # IMPORTANTE:
              # Guardamos el artículo descartado para que no vuelva
              # a analizarse en las siguientes ejecuciones.

              history.append({

                  "id": news_id,

                  "url": clean_link,

                  "title": title,

                  "summary":
                      f"DESCARTADA COMO RECICLADA. "
                      f"{reason}",

                  "status": "duplicate",

                  "date":
                      datetime.now(
                          timezone.utc
                      ).isoformat()

              })


              history = history[-MAX_HISTORY:]


              with open(

                  HISTORY_FILE,

                  "w",

                  encoding="utf-8"

              ) as f:

                  json.dump(

                      history,

                      f,

                      indent=2,

                      ensure_ascii=False

                  )


              print(
                  "Artículo marcado como reciclado."
              )

              sys.exit(0)


          # ============================================================
          # NOTICIA REALMENTE NUEVA
          # ============================================================

          print("========================================")
          print("NOTICIA REALMENTE NUEVA")
          print("CONTINUANDO CON LA REDACCIÓN...")
          print("========================================")


          # ============================================================
          # PROMPT DE REDACCIÓN
          # ============================================================

          prompt = f"""

          Eres el editor de noticias de CAL FAMILY,
          una comunidad dedicada a Grand Theft Auto VI.

          Convierte la siguiente información en un borrador
          profesional para Discord.

          Solo puedes afirmar información que aparezca
          en el material proporcionado.

          Nunca inventes:

          - declaraciones
          - fechas
          - cifras
          - características
          - precios
          - personajes
          - mapas
          - información de Rockstar Games

          Si algo es opinión, análisis, rumor o especulación,
          debes indicarlo claramente.

          ============================================================
          NOTICIA
          ============================================================

          TÍTULO:

          {title}

          CONTENIDO:

          {article_text[:12000]}

          ============================================================
          FORMATO
          ============================================================

          Comienza exactamente con:

          🧭 **Noticias**

          o:

          🧭 **Análisis**

          Después:

          # [Título atractivo en español]

          [Introducción clara.]

          **El dato que lo pone en perspectiva**

          [Contexto importante.]

          **La señal que más dice**

          [Detalle más interesante.]

          **Por qué importa**

          [Por qué es relevante para GTA VI.]

          Si corresponde:

          ⚠️ **Esto no es un anuncio oficial ni una filtración.**

          [Explicación.]

          ============================================================
          ESTILO
          ============================================================

          - Español natural.
          - Profesional.
          - Claro.
          - Atractivo.
          - No exageres.
          - No inventes.
          - No uses demasiados emojis.
          - No pongas enlaces dentro del artículo.
          - No menciones que eres una IA.
          - No escribas explicaciones fuera del artículo.

          Genera únicamente el borrador final.

          """


          # ============================================================
          # GEMINI - REDACCIÓN
          # ============================================================

          print(
              "Enviando noticia a Gemini..."
          )


          generation_payload = {

              "contents": [

                  {

                      "parts": [

                          {

                              "text": prompt

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "temperature": 0.2,

                  "maxOutputTokens": 1400

              }

          }


          response = requests.post(

              GEMINI_URL,

              params={

                  "key": GEMINI_KEY

              },

              headers={

                  "Content-Type":
                      "application/json"

              },

              json=generation_payload,

              timeout=90

          )


          if not response.ok:

              print("========================================")
              print("ERROR DE GEMINI")
              print(response.status_code)
              print(response.text)
              print("========================================")

              sys.exit(1)


          data = response.json()


          try:

              ai_text = (

                  data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
                  .strip()

              )

          except Exception:

              print(
                  "ERROR: respuesta inesperada "
                  "de Gemini."
              )

              print(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              sys.exit(1)


          if not ai_text:

              print(
                  "Gemini devolvió texto vacío."
              )

              sys.exit(1)


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # MENSAJE
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          # ============================================================
          # DISCORD
          # ============================================================

          print(
              "Enviando borrador a Discord..."
          )


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {

                  "roles": [

                      ROLE_ID

                  ]

              }

          }


          discord_response = requests.post(

              WEBHOOK,

              json=discord_payload,

              timeout=30

          )


          if not discord_response.ok:

              print("========================================")
              print("ERROR DE DISCORD")
              print(discord_response.status_code)
              print(discord_response.text)
              print("========================================")

              sys.exit(1)


          # ============================================================
          # GUARDAR NOTICIA PUBLICADA
          # ============================================================

          history.append({

              "id": news_id,

              "url": clean_link,

              "title": title,

              "summary":
                  ai_text[:2500],

              "status": "published",

              "date":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(

              HISTORY_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  history,

                  f,

                  indent=2,

                  ensure_ascii=False

              )


          print("========================================")
          print("BORRADOR ENVIADO A DISCORD")
          print("NOTICIA REGISTRADA")
          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL EN GITHUB
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit -m "Cal Bot: update GTA VI news history"

            git push

          fi
