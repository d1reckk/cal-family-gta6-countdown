name: GTA VI News - Cal Bot V9

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Cal Bot - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse

          print("=" * 55)
          print("CAL BOT V9")
          print("EDITOR DE NOTICIAS DE CAL FAMILY")
          print("=" * 55)

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          ROLE_ID = "1504921814759903343"
          HISTORY_FILE = "seen_news.json"
          MAX_HISTORY = 500
          MAX_AGE_HOURS = 72

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          GEMINI_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          if not WEBHOOK:
              print("ERROR: falta NEWS_DRAFT_WEBHOOK")
              raise SystemExit(1)

          if not GEMINI_KEY:
              print("ERROR: falta GEMINI_API_KEY")
              raise SystemExit(1)

          def normalize(text):
              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"[^a-z0-9áéíóúüñ ]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()

          def similarity(a, b):
              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0

              return SequenceMatcher(None, a, b).ratio()

          def canonical_url(url):
              if not url:
                  return ""

              try:
                  parsed = urlparse(url)
                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc"
                  }

                  query = {
                      k: v
                      for k, v in query.items()
                      if k not in ignored
                  }

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      urlencode(query, doseq=True),
                      ""
                  ))

              except Exception:
                  return url

          def clean_html(text):
              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )

          def load_history():
              if not os.path.exists(HISTORY_FILE):
                  return {
                      "urls": [],
                      "titles": [],
                      "content_hashes": []
                  }

              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if isinstance(data, list):
                      return {
                          "urls": data,
                          "titles": [],
                          "content_hashes": []
                      }

                  if not isinstance(data, dict):
                      raise ValueError()

                  data.setdefault("urls", [])
                  data.setdefault("titles", [])
                  data.setdefault("content_hashes", [])

                  return data

              except Exception:
                  return {
                      "urls": [],
                      "titles": [],
                      "content_hashes": []
                  }

          history = load_history()

          print("Buscando noticias nuevas...")

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              print("No hay resultados RSS.")
              raise SystemExit(0)

          candidate = None
          now = datetime.now(timezone.utc)

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_url:
                  continue

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):
                  try:
                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:
                      pass

              if published_time:
                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_AGE_HOURS
                  ):
                      print(
                          "Ignorada: noticia antigua."
                      )
                      continue

              clean_url = canonical_url(
                  google_url
              )

              if clean_url in history["urls"]:
                  print(
                      "Ignorada: URL ya procesada."
                  )
                  continue

              duplicate = False

              for old_title in history["titles"][-100:]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.86:

                      duplicate = True
                      break

              if duplicate:
                  print(
                      "Ignorada: título demasiado parecido."
                  )
                  continue

              rss_text = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              candidate = {
                  "title": title,
                  "google_url": google_url,
                  "clean_url": clean_url,
                  "rss_text": rss_text
              }

              break

          if candidate is None:
              print("=" * 55)
              print("NO HAY NOTICIAS NUEVAS.")
              print("=" * 55)
              raise SystemExit(0)

          title = candidate["title"]
          google_url = candidate["google_url"]
          clean_url = candidate["clean_url"]
          rss_text = candidate["rss_text"]

          print("=" * 55)
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("=" * 55)

          article_text = ""
          source_url = google_url

          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
          }

          try:
              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )

              print(
                  "Estado de página:",
                  page.status_code
              )

              source_url = page.url

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup([
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header"
                  ]):
                      element.decompose()

                  paragraphs = []

                  for p in soup.find_all("p"):
                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:
                          paragraphs.append(text)

                  article_text = "\n".join(
                      paragraphs
                  )[:16000]

          except Exception as error:
              print(
                  "Error obteniendo artículo:",
                  error
              )

          if len(article_text) >= 300:
              source_content = article_text
          elif len(rss_text) >= 100:
              source_content = rss_text
          else:
              print(
                  "DESCARTADA: no hay suficiente información."
              )
              raise SystemExit(0)

          content_hash = hashlib.sha256(
              normalize(
                  source_content
              ).encode("utf-8")
          ).hexdigest()

          if content_hash in history["content_hashes"]:
              print(
                  "DESCARTADA: contenido idéntico."
              )
              raise SystemExit(0)

          recent_titles = history["titles"][-60:]

          previous = "\n".join(
              "- " + x
              for x in recent_titles
          )

          prompt = f"""
          Eres CAL BOT, editor de noticias de CAL FAMILY,
          una comunidad dedicada exclusivamente a GTA VI.

          Tu prioridad NO es publicar muchas noticias.

          Tu prioridad es publicar SOLO información realmente
          nueva, útil y verificable.

          HISTORIAL RECIENTE:
          {previous}

          NUEVO ARTÍCULO:

          TÍTULO:
          {title}

          URL:
          {source_url}

          CONTENIDO:
          {source_content}

          REGLAS EDITORIALES:

          1. Compara el artículo con el historial.

          2. DESCARTA si simplemente repite:
             - un tráiler ya publicado
             - un extended look ya publicado
             - una reacción de otro medio
             - una noticia anteriormente cubierta
             - el mismo rumor
             - la misma especulación
             - el mismo anuncio
             - una noticia con otro titular pero igual información

          3. PUBLICA solamente si existe un dato concreto nuevo.

          4. Un nuevo artículo de otro medio NO significa
             automáticamente que sea una noticia nueva.

          5. Una opinión periodística NO es noticia nueva.

          6. Una reacción emocional de un periodista NO es noticia nueva.

          7. Una estimación no oficial debe tratarse como
             especulación.

          8. Nunca inventes información.

          9. Nunca conviertas opiniones en hechos.

          10. Si no puedes verificar suficientemente el dato,
              DESCARTA.

          11. Si tienes dudas, DESCARTA.

          INFORMACIÓN QUE NUNCA DEBES INVENTAR:

          - fechas
          - precios
          - duración
          - mapa
          - personajes
          - vehículos
          - armas
          - ventas
          - requisitos
          - características
          - declaraciones de Rockstar
          - declaraciones de Take-Two
          - información de desarrollo

          si no aparece claramente en el material.

          DECISIÓN:

          Debes devolver exclusivamente JSON válido.

          {{
            "decision": "PUBLICAR" o "DESCARTAR",
            "reason": "motivo breve",
            "category": "Noticias" o "Análisis",
            "title": "título en español",
            "content": "texto final"
          }}

          SI DESCARTAS:

          content debe ser "".

          SI PUBLICAS:

          El texto debe tener aproximadamente
          500-1000 caracteres.

          Debe ser profesional y natural.

          Formato:

          [Introducción]

          **El dato clave**

          [Dato concreto]

          **Por qué importa**

          [Contexto]

          ⚠️ **Contexto**

          [Aclaración si no es oficial]

          No pongas enlaces dentro de content.

          No digas que eres una IA.
          """

          print("=" * 55)
          print("CAL BOT ESTÁ EVALUANDO...")
          print("=" * 55)

          gemini_response = None

          for model in GEMINI_MODELS:

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{model}:generateContent"
                  f"?key={GEMINI_KEY}"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.1,
                      "maxOutputTokens": 1800,
                      "responseMimeType": "application/json"
                  }
              }

              for attempt in range(3):

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=90
                      )

                      print(
                          f"Gemini {model}: HTTP "
                          f"{response.status_code}"
                      )

                      if response.status_code == 200:
                          gemini_response = response.json()
                          break

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):
                          wait = 5 * (attempt + 1)

                          print(
                              f"Reintentando en {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      print(
                          response.text[:2000]
                      )
                      break

                  except Exception as error:

                      print(
                          "Error Gemini:",
                          error
                      )

                      time.sleep(
                          5 * (attempt + 1)
                      )

              if gemini_response:
                  break

          if not gemini_response:

              print("=" * 55)
              print(
                  "GEMINI NO RESPONDIÓ."
              )
              print(
                  "La noticia NO será guardada."
              )
              print("=" * 55)

              raise SystemExit(1)

          try:

              parts = (
                  gemini_response
                  .get("candidates", [{}])[0]
                  .get("content", {})
                  .get("parts", [])
              )

              ai_text = (
                  parts[0]
                  .get("text", "")
                  .strip()
              )

              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              )

              result = json.loads(ai_text)

          except Exception as error:

              print(
                  "ERROR LEYENDO RESPUESTA DE GEMINI:"
              )

              print(error)

              print(
                  json.dumps(
                      gemini_response,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()

          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()

          if decision != "PUBLICAR":

              print("=" * 55)
              print("DESCARTADA POR CAL BOT")
              print("=" * 55)
              print(reason)

              raise SystemExit(0)

          final_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()

          final_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()

          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()

          if category not in (
              "Noticias",
              "Análisis"
          ):
              category = "Noticias"

          if not final_title or not final_content:

              print(
                  "DESCARTADA: contenido inválido."
              )

              raise SystemExit(0)

          for old_title in history["titles"][-100:]:

              if similarity(
                  final_title,
                  old_title
              ) >= 0.90:

                  print(
                      "DESCARTADA: título repetido."
                  )

                  raise SystemExit(0)

          final_content = re.sub(
              r"🔗\s*\*\*Fuente.*?\n?",
              "",
              final_content,
              flags=re.IGNORECASE
          )

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")

          message = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {final_title}\n\n"
              f"{final_content}\n\n"
              f"🔗 **Fuente original:** {source_url}\n\n"
              f"⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por Cal Bot "
              f"como borrador editorial. Revisa la "
              f"información antes de publicarlo en #noticias.\n\n"
              f"-# Cal Bot V9 · {date_text}"
          )

          if len(message) > 1950:

              print(
                  "Mensaje demasiado largo. "
                  "Acortando contenido..."
              )

              final_content = final_content[:900]

              message = (
                  f"<@&{ROLE_ID}>\n\n"
                  f"🧭 **{category}**\n\n"
                  f"# {final_title}\n\n"
                  f"{final_content}\n\n"
                  f"🔗 **Fuente original:** {source_url}\n\n"
                  f"⚠️ **REVISIÓN REQUERIDA**\n"
                  f"Este contenido fue preparado por Cal Bot "
                  f"como borrador editorial. Revisa la "
                  f"información antes de publicarlo en #noticias.\n\n"
                  f"-# Cal Bot V9 · {date_text}"
              )

          print("=" * 55)
          print("ENVIANDO A DISCORD...")
          print("=" * 55)

          discord_payload = {
              "content": message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [ROLE_ID]
              }
          }

          try:

              discord = requests.post(
                  WEBHOOK,
                  json=discord_payload,
                  timeout=30
              )

          except Exception as error:

              print(
                  "ERROR DE CONEXIÓN CON DISCORD:"
              )

              print(error)

              raise SystemExit(1)

          print(
              "Discord HTTP:",
              discord.status_code
          )

          if discord.status_code not in (
              200,
              204
          ):

              print(
                  "ERROR DE DISCORD:"
              )

              print(
                  discord.text[:3000]
              )

              print(
                  "La noticia NO será guardada."
              )

              raise SystemExit(1)

          print("=" * 55)
          print("DISCORD CONFIRMÓ EL ENVÍO.")
          print("=" * 55)

          history["urls"].append(
              clean_url
          )

          history["titles"].append(
              final_title
          )

          history["content_hashes"].append(
              content_hash
          )

          history["urls"] = (
              history["urls"][-MAX_HISTORY:]
          )

          history["titles"] = (
              history["titles"][-MAX_HISTORY:]
          )

          history["content_hashes"] = (
              history["content_hashes"][-MAX_HISTORY:]
          )

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("=" * 55)
          print("NOTICIA PUBLICADA.")
          print("HISTORIAL ACTUALIZADO.")
          print("=" * 55)

          PY

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Update Cal Bot news history"
            git push
          fi
