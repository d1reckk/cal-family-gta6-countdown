name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Find and analyze GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          MODEL = "gemini-3.5-flash-lite"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 1000


          # ============================================================
          # VALIDAR SECRETOS
          # ============================================================

          if not WEBHOOK:
              print("ERROR: falta NEWS_DRAFT_WEBHOOK.")
              exit(1)

          if not GEMINI_KEY:
              print("ERROR: falta GEMINI_API_KEY.")
              exit(1)


          # ============================================================
          # NORMALIZAR URL
          # ============================================================

          def normalize_url(url):

              url = url.strip()

              url = re.sub(
                  r"[?&](utm_[^&]+|oc=\d+)",
                  "",
                  url,
                  flags=re.IGNORECASE
              )

              url = url.rstrip("?&")

              return url


          # ============================================================
          # CREAR ID DE LA NOTICIA
          # ============================================================

          def make_id(url):

              clean_url = normalize_url(url)

              return hashlib.sha256(
                  clean_url.encode("utf-8")
              ).hexdigest()


          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          if not isinstance(history, list):

              history = []


          # ============================================================
          # COMPATIBILIDAD CON HISTORIAL ANTERIOR
          # ============================================================

          normalized_history = []

          for item in history:

              if isinstance(item, str):

                  normalized_history.append({

                      "id": item,

                      "url": "",

                      "title": "",

                      "status": "published"

                  })

              elif isinstance(item, dict):

                  normalized_history.append(item)


          history = normalized_history


          seen_ids = {

              item.get("id")

              for item in history

              if item.get("id")

          }


          # ============================================================
          # BUSCAR RSS
          # ============================================================

          print("========================================")
          print("CAL BOT")
          print("BUSCANDO NOTICIAS NUEVAS...")
          print("========================================")


          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print(
                  "No se encontraron noticias."
              )

              exit(0)


          # ============================================================
          # SELECCIONAR NOTICIA NUEVA
          # ============================================================

          article = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              original_link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not original_link:

                  continue


              clean_link = normalize_url(
                  original_link
              )

              news_id = make_id(
                  original_link
              )


              # MISMO ARTÍCULO
              if news_id in seen_ids:

                  print(
                      "Ignorada: artículo ya procesado."
                  )

                  continue


              # URL EXACTA
              duplicate_url = False


              for old in history:

                  old_url = normalize_url(
                      old.get(
                          "url",
                          ""
                      )
                  )


                  if old_url and old_url == clean_link:

                      duplicate_url = True

                      break


              if duplicate_url:

                  print(
                      "Ignorada: URL ya existente."
                  )

                  continue


              article = {

                  "id": news_id,

                  "title": title,

                  "link": original_link,

                  "clean_link": clean_link

              }

              break


          # ============================================================
          # NO HAY NOTICIAS NUEVAS
          # ============================================================

          if article is None:

              print("========================================")
              print("NO HAY NOTICIAS NUEVAS.")
              print("========================================")

              exit(0)


          title = article["title"]
          link = article["link"]
          clean_link = article["clean_link"]
          news_id = article["id"]


          print("========================================")
          print("NUEVA NOTICIA")
          print(title)
          print(link)
          print("========================================")


          # ============================================================
          # OBTENER ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {

                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  )

              }


              page = requests.get(

                  link,

                  headers=headers,

                  timeout=25,

                  allow_redirects=True

              )


              print(
                  f"Estado de la página: "
                  f"{page.status_code}"
              )


              if page.ok:

                  soup = BeautifulSoup(

                      page.text,

                      "html.parser"

                  )


                  for element in soup([

                      "script",
                      "style",
                      "noscript",
                      "svg"

                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(

                          " ",

                          strip=True

                      )


                      if len(text) >= 50:

                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo obtener "
                  "el artículo completo."
              )

              print(error)


          # ============================================================
          # CONTENIDO
          # ============================================================

          if article_text:

              source_content = article_text

          else:

              source_content = (

                  "No fue posible obtener "
                  "el texto completo del artículo. "
                  "Utiliza únicamente el título "
                  "y la información disponible."

              )


          # ============================================================
          # PROMPT GEMINI
          # ============================================================

          prompt = f"""

          Eres el editor de noticias de CAL FAMILY,
          una comunidad dedicada a Grand Theft Auto VI.

          Convierte la información proporcionada
          en un borrador profesional para Discord.

          REGLA ABSOLUTA:

          No inventes información.

          No inventes:

          - declaraciones
          - fechas
          - cifras
          - características
          - precios
          - personajes
          - mapas
          - rumores
          - filtraciones
          - declaraciones de Rockstar Games

          Si algo es opinión, análisis,
          rumor o especulación,
          debes indicarlo claramente.

          ============================================================
          CLASIFICACIÓN
          ============================================================

          Si presenta información factual:

          🧭 **Noticias**

          Si principalmente presenta opinión,
          interpretación o análisis:

          🧭 **Análisis**

          ============================================================
          FORMATO
          ============================================================

          Comienza exactamente con:

          🧭 **Noticias**

          o:

          🧭 **Análisis**

          Después:

          # [Título atractivo en español]

          [Introducción clara de 1-2 párrafos.]

          **El dato que lo pone en perspectiva**

          [Contexto importante.]

          **La señal que más dice**

          [Detalle más interesante.]

          **Por qué importa**

          [Por qué es relevante para GTA VI.]

          Si corresponde:

          ⚠️ **Esto no es un anuncio oficial ni una filtración.**

          [Explicación.]

          ============================================================
          ESTILO
          ============================================================

          - Español natural.
          - Profesional.
          - Claro.
          - Atractivo.
          - No exageres.
          - No inventes.
          - No repitas innecesariamente.
          - No uses demasiados emojis.
          - No pongas enlaces.
          - No menciones que eres una IA.
          - No escribas explicaciones fuera del artículo.

          El resultado debe estar listo para pegar
          en Discord.

          ============================================================
          INFORMACIÓN
          ============================================================

          TÍTULO:

          {title}

          ENLACE:

          {link}

          CONTENIDO:

          {source_content}

          Genera únicamente el borrador final.

          """


          # ============================================================
          # GEMINI
          # ============================================================

          print(
              "Enviando noticia a Gemini..."
          )


          gemini_payload = {

              "contents": [

                  {

                      "parts": [

                          {

                              "text": prompt

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "temperature": 0.2,

                  "maxOutputTokens": 1400

              }

          }


          response = requests.post(

              GEMINI_URL,

              params={

                  "key": GEMINI_KEY

              },

              headers={

                  "Content-Type":
                      "application/json"

              },

              json=gemini_payload,

              timeout=90

          )


          if not response.ok:

              print("========================================")
              print("ERROR DE GEMINI")
              print(response.status_code)
              print(response.text)
              print("========================================")

              exit(1)


          data = response.json()


          # ============================================================
          # EXTRAER RESPUESTA
          # ============================================================

          try:

              ai_text = (

                  data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
                  .strip()

              )

          except Exception:

              print(
                  "ERROR: respuesta inesperada de Gemini."
              )

              print(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              exit(1)


          if not ai_text:

              print(
                  "Gemini devolvió texto vacío."
              )

              exit(1)


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # MENSAJE DISCORD
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          # ============================================================
          # DISCORD
          # ============================================================

          print(
              "Enviando borrador a Discord..."
          )


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {

                  "roles": [

                      ROLE_ID

                  ]

              }

          }


          discord_response = requests.post(

              WEBHOOK,

              json=discord_payload,

              timeout=30

          )


          if not discord_response.ok:

              print("========================================")
              print("ERROR DE DISCORD")
              print(discord_response.status_code)
              print(discord_response.text)
              print("========================================")

              exit(1)


          # ============================================================
          # GUARDAR HISTORIAL
          # ============================================================

          history.append({

              "id": news_id,

              "url": clean_link,

              "title": title,

              "status": "published",

              "date":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(

              HISTORY_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  history,

                  f,

                  indent=2,

                  ensure_ascii=False

              )


          print("Historial actualizado.")

          print("========================================")
          print("NOTICIA ENVIADA A DISCORD")
          print("PUBLICADA UNA SOLA VEZ")
          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit -m "Cal Bot: update GTA VI news history"

            git push

          fi
