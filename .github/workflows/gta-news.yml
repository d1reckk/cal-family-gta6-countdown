name: GTA VI News - Cal Bot V7.2

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Cal Bot V7.2 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse

          print("=" * 50)
          print("CAL BOT V7.2")
          print("EDITOR DE NOTICIAS DE CAL FAMILY")
          print("BUSCANDO NOTICIAS...")
          print("=" * 50)

          # ==========================================================
          # CONFIGURACIÓN
          # ==========================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          GEMINI_MODEL = "gemini-3.5-flash"

          MAX_HISTORY = 500
          MAX_NEWS_AGE_HOURS = 72

          # ==========================================================
          # VALIDAR SECRETOS
          # ==========================================================

          if not WEBHOOK:
              print("ERROR: NEWS_DRAFT_WEBHOOK no existe.")
              raise SystemExit(1)

          if not GEMINI_KEY:
              print("ERROR: GEMINI_API_KEY no existe.")
              raise SystemExit(1)

          # ==========================================================
          # FUNCIONES
          # ==========================================================

          def normalize_text(text):
              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"[^a-z0-9áéíóúüñ ]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def similarity(a, b):
              a = normalize_text(a)
              b = normalize_text(b)

              if not a or not b:
                  return 0.0

              return SequenceMatcher(None, a, b).ratio()


          def canonical_url(url):
              if not url:
                  return ""

              try:
                  parsed = urlparse(url)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc",
                  }

                  clean_query = {
                      key: value
                      for key, value in query.items()
                      if key not in ignored
                  }

                  new_query = urlencode(
                      clean_query,
                      doseq=True
                  )

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      new_query,
                      ""
                  ))

              except Exception:
                  return url


          def make_id(title, url):
              value = (
                  normalize_text(title)
                  + "|"
                  + canonical_url(url)
              )

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          def clean_html(text):
              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          # ==========================================================
          # HISTORIAL
          # ==========================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      history = json.load(f)
              except Exception:
                  history = {}
          else:
              history = {}

          if isinstance(history, list):
              history = {
                  "published": history,
                  "titles": [],
                  "content_hashes": [],
                  "sources": []
              }

          history.setdefault("published", [])
          history.setdefault("titles", [])
          history.setdefault("content_hashes", [])
          history.setdefault("sources", [])

          # ==========================================================
          # RSS
          # ==========================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              print("No se encontraron noticias.")
              raise SystemExit(0)

          now = datetime.now(timezone.utc)

          candidate = None

          # ==========================================================
          # BUSCAR UNA NOTICIA NUEVA
          # ==========================================================

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_url:
                  continue

              # ------------------------------------------------------
              # FECHA
              # ------------------------------------------------------

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):

                  try:
                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:
                      published_time = None

              if published_time:

                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_NEWS_AGE_HOURS
                  ):
                      print(
                          "Ignorada: noticia demasiado antigua."
                      )
                      continue

              # ------------------------------------------------------
              # ID
              # ------------------------------------------------------

              clean_url = canonical_url(
                  google_url
              )

              news_id = make_id(
                  title,
                  clean_url
              )

              # ------------------------------------------------------
              # URL YA PROCESADA
              # ------------------------------------------------------

              if news_id in history["published"]:
                  print(
                      "Ignorada: URL ya procesada."
                  )
                  continue

              # ------------------------------------------------------
              # TÍTULO DUPLICADO
              # ------------------------------------------------------

              duplicate = False

              for old_title in history["titles"]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.88:

                      duplicate = True
                      break

              if duplicate:
                  print(
                      "Ignorada: título demasiado parecido."
                  )
                  continue

              # ------------------------------------------------------
              # RSS CONTENT
              # ------------------------------------------------------

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              rss_content = (
                  summary
                  + "\n"
                  + description
              ).strip()

              candidate = {
                  "id": news_id,
                  "title": title,
                  "google_url": google_url,
                  "rss_content": rss_content,
              }

              break

          # ==========================================================
          # NO HAY CANDIDATO
          # ==========================================================

          if candidate is None:

              print("=" * 50)
              print("NO HAY NOTICIAS NUEVAS.")
              print("=" * 50)

              raise SystemExit(0)

          title = candidate["title"]
          google_url = candidate["google_url"]
          rss_content = candidate["rss_content"]
          news_id = candidate["id"]

          print("=" * 50)
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("=" * 50)

          # ==========================================================
          # OBTENER ARTÍCULO REAL
          # ==========================================================

          article_text = ""
          final_source_url = google_url

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
              )
          }

          try:

              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )

              print(
                  "Estado de página:",
                  page.status_code
              )

              final_source_url = page.url

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup.find_all(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer",
                          "header"
                      ]
                  ):
                      element.decompose()

                  paragraphs = []

                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:
                          paragraphs.append(text)

                  article_text = "\n".join(
                      paragraphs
                  )

                  article_text = article_text[:16000]

          except Exception as error:

              print(
                  "No se pudo obtener directamente el artículo:"
              )

              print(error)

          # ==========================================================
          # FUENTE PARA GEMINI
          # ==========================================================

          if len(article_text) >= 300:

              source_content = article_text

          elif len(rss_content) >= 100:

              source_content = rss_content

          else:

              print(
                  "DESCARTADA: información insuficiente."
              )

              raise SystemExit(0)

          # ==========================================================
          # HASH
          # ==========================================================

          content_hash = hashlib.sha256(
              normalize_text(
                  source_content
              ).encode("utf-8")
          ).hexdigest()

          if content_hash in history["content_hashes"]:

              print(
                  "DESCARTADA: contenido idéntico."
              )

              raise SystemExit(0)

          # ==========================================================
          # HISTORIAL PARA GEMINI
          # ==========================================================

          recent_titles = history["titles"][-50:]

          if recent_titles:

              previous_titles = "\n".join(
                  "- " + item
                  for item in recent_titles
              )

          else:

              previous_titles = (
                  "No existen noticias anteriores "
                  "en el historial."
              )

          # ==========================================================
          # PROMPT DEL EDITOR
          # ==========================================================

          prompt = f"""
Eres CAL BOT, el editor de noticias de CAL FAMILY.

CAL FAMILY es una comunidad dedicada a Grand Theft Auto VI.

Tu función NO es publicar todo lo que aparezca en Google News.

Tu función es actuar como un EDITOR HUMANO.

Debes decidir si una noticia merece aparecer en Discord.

============================================================
REGLA ABSOLUTA
============================================================

PUBLICA únicamente información NUEVA, RELEVANTE y VERIFICABLE.

Si tienes dudas, DESCARTA.

Es preferible no publicar una noticia antes que llenar Discord
con artículos reciclados.

============================================================
NO PUBLICAR
============================================================

DESCARTA si:

- Es el mismo anuncio publicado por otro medio.
- Es otra cobertura del mismo tráiler.
- Es otra cobertura del Extended Look.
- Es una reacción de IGN, YouTube, periodista o medio.
- Es opinión sin información nueva.
- Es especulación reciclada.
- Es un rumor antiguo vuelto a publicar.
- Solo cambia el titular.
- Solo cambia la fuente.
- Solo resume información ya conocida.
- No contiene un dato concreto nuevo.
- El artículo no permite verificar la afirmación.
- El artículo es demasiado corto o superficial.
- El titular exagera algo que el contenido no confirma.

============================================================
SÍ PUBLICAR
============================================================

PUBLICA si existe algo como:

- Nueva declaración verificable.
- Nueva entrevista.
- Nueva información confirmada.
- Nueva información de Rockstar Games.
- Nueva información de Take-Two.
- Nuevo dato de desarrollo.
- Nuevo anuncio.
- Nueva fecha confirmada.
- Nueva característica confirmada.
- Nueva información sobre personajes.
- Nueva información sobre gameplay.
- Nueva información técnica.
- Nueva información comercial.
- Nuevo comunicado oficial.
- Nueva información que realmente cambie lo que sabemos.

============================================================
FUENTES
============================================================

Una fuente secundaria puede ser válida si aporta información
concreta y verificable.

No descartes automáticamente una noticia solo porque
NO provenga de Rockstar Games.

Pero nunca presentes una afirmación de una fuente externa
como si fuera confirmación oficial.

============================================================
HISTORIAL
============================================================

Estos son títulos publicados recientemente:

{previous_titles}

============================================================
ARTÍCULO ACTUAL
============================================================

TÍTULO:

{title}

FUENTE:

{final_source_url}

CONTENIDO:

{source_content}

============================================================
ANÁLISIS
============================================================

Antes de decidir, compara el artículo con el historial.

Determina si realmente aporta información nueva.

Clasifica mentalmente cada afirmación como:

HECHO
DECLARACIÓN
OPINIÓN
ANÁLISIS
RUMOR
ESPECULACIÓN

Nunca conviertas una opinión, rumor o especulación
en un hecho.

Nunca inventes información.

============================================================
RESPUESTA
============================================================

Devuelve ÚNICAMENTE JSON válido.

Formato:

{{
  "decision": "PUBLICAR" o "DESCARTAR",
  "reason": "explicación breve",
  "category": "Noticias" o "Análisis",
  "title": "título en español",
  "content": "texto final"
}}

============================================================
SI DESCARTAS
============================================================

Usa:

"decision": "DESCARTAR"

Y:

"content": ""

============================================================
SI PUBLICAS
============================================================

El texto debe:

- Estar en español.
- Ser natural.
- Parecer escrito por un editor de una página especializada.
- Ser claro.
- No exagerar.
- No inventar.
- No repetir información.
- No superar aproximadamente 1100 caracteres.
- No incluir enlaces.
- No mencionar que eres una IA.

Usa esta estructura:

[Introducción]

**El dato clave**

[Información nueva]

**Por qué importa**

[Importancia]

⚠️ **Contexto**

[Indica si procede de una fuente externa,
si es una declaración, análisis o información no oficial.]

No uses una sección si no aporta valor.

============================================================
DECISIÓN FINAL
============================================================

Si el artículo es reciclado:

DESCARTAR.

Si el artículo es prácticamente igual a una noticia anterior:

DESCARTAR.

Si solo cambia el medio:

DESCARTAR.

Si aporta información realmente nueva:

PUBLICAR.
"""

          # ==========================================================
          # GEMINI
          # ==========================================================

          print("=" * 50)
          print("CAL BOT ESTÁ EVALUANDO LA NOTICIA...")
          print("=" * 50)

          endpoint = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + GEMINI_MODEL
              + ":generateContent?key="
              + GEMINI_KEY
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "maxOutputTokens": 1800,
                  "responseMimeType": "application/json"
              }
          }

          gemini_response = None

          for attempt in range(4):

              try:

                  response = requests.post(
                      endpoint,
                      headers={
                          "Content-Type":
                              "application/json"
                      },
                      json=payload,
                      timeout=90
                  )

                  print(
                      "Gemini HTTP:",
                      response.status_code
                  )

                  if response.status_code == 200:

                      gemini_response = response.json()
                      break

                  if response.status_code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      wait = 5 * (attempt + 1)

                      print(
                          f"Gemini no disponible. "
                          f"Reintentando en {wait}s..."
                      )

                      time.sleep(wait)
                      continue

                  print(
                      response.text[:4000]
                  )

                  raise SystemExit(1)

              except requests.RequestException as error:

                  print(
                      "Error de conexión con Gemini:",
                      error
                  )

                  if attempt < 3:
                      time.sleep(
                          5 * (attempt + 1)
                      )
                  else:
                      raise SystemExit(1)

          if gemini_response is None:

              print(
                  "Gemini no respondió después de varios intentos."
              )

              raise SystemExit(1)

          # ==========================================================
          # EXTRAER TEXTO DE GEMINI
          # ==========================================================

          try:

              candidates = gemini_response.get(
                  "candidates",
                  []
              )

              if not candidates:
                  raise ValueError(
                      "No hubo candidates."
                  )

              parts = (
                  candidates[0]
                  .get("content", {})
                  .get("parts", [])
              )

              if not parts:
                  raise ValueError(
                      "No hubo parts."
                  )

              ai_text = (
                  parts[0]
                  .get("text", "")
                  .strip()
              )

              if not ai_text:
                  raise ValueError(
                      "Respuesta vacía."
                  )

              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              ).strip()

              result = json.loads(
                  ai_text
              )

          except Exception as error:

              print(
                  "ERROR INTERPRETANDO GEMINI:"
              )

              print(error)

              print(
                  json.dumps(
                      gemini_response,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)

          # ==========================================================
          # DECISIÓN
          # ==========================================================

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()

          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()

          print("=" * 50)

          if decision != "PUBLICAR":

              print("DESCARTADA POR CAL BOT")
              print("=" * 50)
              print(reason)

              raise SystemExit(0)

          print("CAL BOT DECIDIÓ PUBLICAR")
          print(reason)

          # ==========================================================
          # CONTENIDO
          # ==========================================================

          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()

          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()

          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()

          if category not in (
              "Noticias",
              "Análisis"
          ):
              category = "Noticias"

          if not ai_title or not ai_content:

              print(
                  "DESCARTADA: Gemini no generó contenido."
              )

              raise SystemExit(0)

          # ==========================================================
          # SEGUNDA PROTECCIÓN CONTRA TÍTULOS REPETIDOS
          # ==========================================================

          for old_title in history["titles"]:

              if similarity(
                  ai_title,
                  old_title
              ) >= 0.90:

                  print(
                      "DESCARTADA: título demasiado parecido "
                      "a una publicación anterior."
                  )

                  raise SystemExit(0)

          # ==========================================================
          # LIMPIAR ENLACES GENERADOS POR GEMINI
          # ==========================================================

          ai_content = re.sub(
              r"https?://\S+",
              "",
              ai_content
          ).strip()

          # ==========================================================
          # MENSAJE DISCORD
          # ==========================================================

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")

          final_message = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {ai_title}\n\n"
              f"{ai_content}\n\n"
              f"🔗 **Fuente original:** {final_source_url}\n\n"
              f"⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por Cal Bot "
              f"como borrador editorial. "
              f"Revisa la información antes de publicarlo "
              f"en #noticias.\n\n"
              f"-# Cal Bot V7.2 · {date_text}"
          )

          # ==========================================================
          # DISCORD NO PERMITE MÁS DE 2000 CARACTERES
          # ==========================================================

          if len(final_message) > 2000:

              print(
                  "El mensaje supera 2000 caracteres."
              )

              print(
                  "DESCARTADA para evitar un error de Discord."
              )

              raise SystemExit(0)

          # ==========================================================
          # ENVIAR A DISCORD
          # ==========================================================

          print("=" * 50)
          print("ENVIANDO NOTICIA A DISCORD...")
          print("=" * 50)

          discord_payload = {
              "content": final_message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }
          }

          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )

          print(
              "Discord HTTP:",
              discord_response.status_code
          )

          if not discord_response.ok:

              print(
                  "ERROR DE DISCORD:"
              )

              print(
                  discord_response.text
              )

              print(
                  "La noticia NO será guardada."
              )

              raise SystemExit(1)

          print("=" * 50)
          print("DISCORD CONFIRMÓ EL MENSAJE.")
          print("=" * 50)

          # ==========================================================
          # GUARDAR HISTORIAL
          # SOLO DESPUÉS DE CONFIRMAR DISCORD
          # ==========================================================

          history["published"].append(
              news_id
          )

          history["titles"].append(
              ai_title
          )

          history["content_hashes"].append(
              content_hash
          )

          history["sources"].append(
              final_source_url
          )

          history["published"] = (
              history["published"][-MAX_HISTORY:]
          )

          history["titles"] = (
              history["titles"][-MAX_HISTORY:]
          )

          history["content_hashes"] = (
              history["content_hashes"][-MAX_HISTORY:]
          )

          history["sources"] = (
              history["sources"][-MAX_HISTORY:]
          )

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("=" * 50)
          print("NOTICIA PUBLICADA.")
          print("HISTORIAL ACTUALIZADO.")
          print("=" * 50)

          PY

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Update Cal Bot news history"
            git push
          fi
