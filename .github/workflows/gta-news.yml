name: GTA VI News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Verify bot file
        shell: bash
        run: |
          echo "========== BOT FILE =========="
          pwd
          echo "Python:"
          python --version
          echo "cal_bot.py:"
          test -f cal_bot.py
          head -n 20 cal_bot.py
          echo "========== SYNTAX =========="
          python -m py_compile cal_bot.py

      - name: Run bot
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cal_bot.py

      - name: Save news history
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- seen_news.json; then
            echo "No history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json
          git commit -m "Update news history"
          git push
