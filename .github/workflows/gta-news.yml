name: GTA VI News - Cal Bot V5

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT V5
      # ============================================================

      - name: Cal Bot Editor
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import sys
          import time

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          MODEL = "gemini-3.5-flash-lite"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 1000

          RECENT_HISTORY = 120


          # ============================================================
          # VALIDACIÓN
          # ============================================================

          if not WEBHOOK:

              print("ERROR: NEWS_DRAFT_WEBHOOK no existe.")

              sys.exit(1)


          if not GEMINI_KEY:

              print("ERROR: GEMINI_API_KEY no existe.")

              sys.exit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_url(url):

              if not url:

                  return ""

              url = url.strip()

              url = re.sub(
                  r"([?&])(utm_[^&]+|oc=\d+)",
                  "",
                  url,
                  flags=re.IGNORECASE
              )

              return url.rstrip("?&")


          def normalize_text(text):

              if not text:

                  return ""

              text = text.lower()

              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ\s]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def make_id(url):

              clean = normalize_url(url)

              return hashlib.sha256(
                  clean.encode("utf-8")
              ).hexdigest()


          def title_words(title):

              words = set(
                  normalize_text(title).split()
              )

              stopwords = {

                  "the",
                  "a",
                  "an",
                  "and",
                  "or",
                  "of",
                  "to",
                  "in",
                  "on",
                  "for",
                  "with",
                  "from",

                  "gta",
                  "grand",
                  "theft",
                  "auto",
                  "vi",
                  "6",

                  "el",
                  "la",
                  "los",
                  "las",
                  "un",
                  "una",
                  "unos",
                  "unas",
                  "de",
                  "del",
                  "en",
                  "y",
                  "o",
                  "para",
                  "con",
                  "sobre"

              }

              return {

                  word

                  for word in words

                  if word not in stopwords
                  and len(word) > 2

              }


          def title_similarity(a, b):

              words_a = title_words(a)

              words_b = title_words(b)

              if not words_a or not words_b:

                  return 0.0

              intersection = len(
                  words_a & words_b
              )

              union = len(
                  words_a | words_b
              )

              return intersection / union


          def ask_gemini(prompt, max_tokens=500):

              payload = {

                  "contents": [

                      {

                          "parts": [

                              {

                                  "text": prompt

                              }

                          ]

                      }

                  ],

                  "generationConfig": {

                      "temperature": 0.0,

                      "maxOutputTokens": max_tokens

                  }

              }


              response = requests.post(

                  GEMINI_URL,

                  params={
                      "key": GEMINI_KEY
                  },

                  headers={

                      "Content-Type":
                          "application/json"

                  },

                  json=payload,

                  timeout=90

              )


              if not response.ok:

                  print("ERROR DE GEMINI")

                  print(
                      response.status_code
                  )

                  print(
                      response.text
                  )

                  sys.exit(1)


              data = response.json()


              try:

                  return (

                      data["candidates"][0]
                      ["content"]
                      ["parts"][0]
                      ["text"]
                      .strip()

                  )

              except Exception:

                  print(
                      "Respuesta inesperada de Gemini."
                  )

                  print(
                      json.dumps(
                          data,
                          indent=2,
                          ensure_ascii=False
                      )
                  )

                  sys.exit(1)


          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          if not isinstance(history, list):

              history = []


          converted = []


          for item in history:

              if isinstance(item, str):

                  converted.append({

                      "id": item,

                      "url": "",

                      "title": "",

                      "summary": "",

                      "status": "old"

                  })

              elif isinstance(item, dict):

                  converted.append(item)


          history = converted


          seen_ids = {

              item.get("id")

              for item in history

              if item.get("id")

          }


          # ============================================================
          # BUSCAR RSS
          # ============================================================

          print("========================================")
          print("CAL BOT V5")
          print("EDITOR DE NOTICIAS")
          print("BUSCANDO INFORMACIÓN...")
          print("========================================")


          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print("RSS vacío.")

              sys.exit(0)


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          article = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not link:

                  continue


              clean_link = normalize_url(
                  link
              )

              news_id = make_id(
                  link
              )


              if news_id in seen_ids:

                  print(
                      "Ignorada: URL ya procesada."
                  )

                  continue


              duplicate_url = False


              for old in history:

                  old_url = normalize_url(
                      old.get(
                          "url",
                          ""
                      )
                  )


                  if old_url and old_url == clean_link:

                      duplicate_url = True

                      break


              if duplicate_url:

                  print(
                      "Ignorada: URL duplicada."
                  )

                  continue


              similar = False


              for old in history[-RECENT_HISTORY:]:

                  old_title = old.get(
                      "title",
                      ""
                  )


                  if not old_title:

                      continue


                  similarity = title_similarity(
                      title,
                      old_title
                  )


                  if similarity >= 0.72:

                      print(
                          "Ignorada: título demasiado "
                          "parecido a una noticia anterior."
                      )

                      similar = True

                      break


              if similar:

                  continue


              article = {

                  "id": news_id,

                  "title": title,

                  "link": link,

                  "clean_link": clean_link

              }

              break


          if article is None:

              print("========================================")
              print("NO HAY CANDIDATOS NUEVOS.")
              print("========================================")

              sys.exit(0)


          title = article["title"]
          link = article["link"]
          clean_link = article["clean_link"]
          news_id = article["id"]


          print("========================================")
          print("CANDIDATO")
          print(title)
          print(link)
          print("========================================")


          # ============================================================
          # DESCARGAR ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {

                  "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"

              }


              page = requests.get(

                  link,

                  headers=headers,

                  timeout=25,

                  allow_redirects=True

              )


              print(
                  "Estado de página:",
                  page.status_code
              )


              if page.ok:

                  soup = BeautifulSoup(

                      page.text,

                      "html.parser"

                  )


                  for element in soup([

                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer"

                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(

                          " ",

                          strip=True

                      )


                      if len(text) >= 50:

                          paragraphs.append(
                              text
                          )


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo obtener el artículo."
              )

              print(error)


          if not article_text:

              article_text = (
                  "No se pudo obtener "
                  "el texto completo del artículo."
              )


          # ============================================================
          # HISTORIAL PARA EDITOR
          # ============================================================

          previous_news = []


          for old in history[-RECENT_HISTORY:]:

              if old.get("title"):

                  previous_news.append({

                      "title":
                          old.get("title"),

                      "summary":
                          old.get(
                              "summary",
                              ""
                          )[:1500],

                      "status":
                          old.get(
                              "status",
                              ""
                          )

                  })


          previous_json = json.dumps(

              previous_news,

              ensure_ascii=False,

              indent=2

          )


          # ============================================================
          # PASO 1:
          # ¿ESTO MERECE SER UNA NOTICIA?
          # ============================================================

          print("========================================")
          print("EVALUANDO VALOR NOTICIOSO...")
          print("========================================")


          editor_prompt = f"""

          Eres el editor jefe de CAL FAMILY,
          una comunidad especializada en Grand Theft Auto VI.

          Tu primera tarea NO es escribir la noticia.

          Debes decidir si esta información merece llegar
          al canal interno de revisión.

          ============================================================
          NUEVO ARTÍCULO
          ============================================================

          TÍTULO:

          {title}

          CONTENIDO:

          {article_text[:12000]}

          ============================================================
          HISTORIAL
          ============================================================

          {previous_json}

          ============================================================
          REGLAS EDITORIALES
          ============================================================

          DESCARTA si:

          1. Es una especulación genérica.

          2. Simplemente pregunta "cuánto pesará GTA VI",
             "cuánto durará GTA VI", etc., sin presentar
             información nueva verificable.

          3. Es un artículo reciclado que vuelve a presentar
             información que ya apareció anteriormente.

          4. Es un artículo tipo "todo lo que sabemos"
             que no contiene información nueva.

          5. Solo contiene opiniones generales de un periodista.

          6. Solo describe que el juego "se ve increíble",
             "parece impresionante" o frases similares.

          7. Es una recopilación de rumores antiguos.

          8. No contiene ningún dato concreto nuevo.

          9. El contenido es prácticamente una reacción,
             expectativa o especulación sin información nueva.

          10. El artículo utiliza rumores antiguos como si
              fueran una novedad.

          ACEPTA si:

          1. Rockstar Games publica información nueva.

          2. Aparece una nueva declaración verificable de
             Rockstar Games, Take-Two o un desarrollador.

          3. Se publica material oficial nuevo.

          4. Aparece una entrevista nueva que contiene
             información concreta.

          5. Existe un dato nuevo verificable sobre GTA VI.

          6. Un medio publica información sustancialmente
             nueva que no aparece en el historial.

          7. Existe un rumor relevante que contiene información
             claramente nueva. En ese caso debe clasificarse
             como RUMOR y nunca como hecho.

          ============================================================
          REGLA PRINCIPAL
          ============================================================

          "Hablar de GTA VI" NO significa que sea una noticia.

          Tiene que existir información NUEVA.

          No rellenes huecos.

          No supongas.

          No interpretes una pregunta de un periodista como
          información oficial.

          ============================================================
          RESPUESTA
          ============================================================

          Responde ÚNICAMENTE con JSON válido:

          {{
            "publish": true,
            "type": "Noticias",
            "reason": "explicación breve",
            "new_information": "qué información nueva aporta"
          }}

          O:

          {{
            "publish": false,
            "type": "Descartada",
            "reason": "explicación breve",
            "new_information": ""
          }}

          """

          editor_raw = ask_gemini(
              editor_prompt,
              500
          )


          editor_raw = re.sub(

              r"^```json\s*|\s*```$",

              "",

              editor_raw,

              flags=re.IGNORECASE

          ).strip()


          try:

              editor_result = json.loads(
                  editor_raw
              )

          except Exception:

              print(
                  "Gemini no devolvió JSON válido."
              )

              print(editor_raw)

              sys.exit(1)


          publish = bool(
              editor_result.get(
                  "publish",
                  False
              )
          )


          # ============================================================
          # DESCARTADA
          # ============================================================

          if not publish:

              reason = editor_result.get(
                  "reason",
                  "No cumple los criterios editoriales."
              )


              print("========================================")
              print("DESCARTADA POR CAL BOT")
              print("========================================")

              print(reason)


              history.append({

                  "id": news_id,

                  "url": clean_link,

                  "title": title,

                  "summary":
                      f"DESCARTADA: {reason}",

                  "status":
                      "discarded",

                  "date":
                      datetime.now(
                          timezone.utc
                      ).isoformat()

              })


              history = history[-MAX_HISTORY:]


              with open(

                  HISTORY_FILE,

                  "w",

                  encoding="utf-8"

              ) as f:

                  json.dump(

                      history,

                      f,

                      indent=2,

                      ensure_ascii=False

                  )


              sys.exit(0)


          # ============================================================
          # NOTICIA APROBADA
          # ============================================================

          news_type = editor_result.get(
              "type",
              "Noticias"
          )


          print("========================================")
          print("NOTICIA APROBADA POR EL EDITOR")
          print("========================================")


          # ============================================================
          # PASO 2:
          # REDACCIÓN
          # ============================================================

          writing_prompt = f"""

          Eres el editor de noticias de CAL FAMILY.

          Redacta un borrador profesional para Discord
          utilizando ÚNICAMENTE la información del artículo.

          ============================================================
          ARTÍCULO
          ============================================================

          TÍTULO:

          {title}

          CONTENIDO:

          {article_text[:12000]}

          ============================================================
          INFORMACIÓN NUEVA DETECTADA
          ============================================================

          {editor_result.get(
              "new_information",
              ""
          )}

          ============================================================
          REGLAS
          ============================================================

          No inventes absolutamente nada.

          No añadas:

          - cifras no presentes
          - fechas no presentes
          - declaraciones no presentes
          - características no presentes
          - información de Rockstar no presente
          - contexto inventado
          - rumores como hechos

          Si el artículo no proporciona suficiente información
          para una sección, ELIMINA ESA SECCIÓN.

          No rellenes espacio con frases genéricas.

          No digas que algo está confirmado si no está confirmado.

          Si es rumor:

          ⚠️ **Rumor**
          [explicación]

          Si es análisis:

          🧭 **Análisis**

          Si es información periodística factual:

          🧭 **Noticias**

          ============================================================
          FORMATO
          ============================================================

          Comienza con:

          🧭 **Noticias**

          o:

          🧭 **Análisis**

          Después:

          # [Título atractivo en español]

          [Resumen de 1-2 párrafos.]

          Solo utiliza:

          **El dato que lo pone en perspectiva**

          si realmente existe contexto relevante.

          Solo utiliza:

          **La señal que más dice**

          si existe un detalle relevante.

          Solo utiliza:

          **Por qué importa**

          si puedes explicar la importancia basándote
          en información real del artículo.

          Si es necesario:

          ⚠️ **Esto no es un anuncio oficial ni una filtración.**

          ============================================================
          ESTILO
          ============================================================

          Español natural.

          Profesional.

          Directo.

          Atractivo.

          Estilo de una página especializada en GTA VI.

          Sin exageraciones.

          Sin clickbait.

          Sin emojis innecesarios.

          No pongas enlaces.

          No menciones que eres una IA.

          Devuelve ÚNICAMENTE el texto final.

          """


          ai_text = ask_gemini(

              writing_prompt,

              1400

          )


          # ============================================================
          # LIMPIEZA
          # ============================================================

          ai_text = ai_text.strip()


          if ai_text.startswith(
              "```"
          ):

              ai_text = re.sub(

                  r"^```[a-zA-Z]*\s*",
                  "",
                  ai_text

              )

              ai_text = re.sub(

                  r"\s*```$",
                  "",
                  ai_text

              ).strip()


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # DISCORD
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          discord_payload = {

              "content":
                  final_message,

              "username":
                  "Cal Bot",

              "allowed_mentions": {

                  "roles": [

                      ROLE_ID

                  ]

              }

          }


          print(
              "Enviando borrador a Discord..."
          )


          discord_response = requests.post(

              WEBHOOK,

              json=discord_payload,

              timeout=30

          )


          if not discord_response.ok:

              print(
                  "ERROR DE DISCORD"
              )

              print(
                  discord_response.status_code
              )

              print(
                  discord_response.text
              )

              sys.exit(1)


          # ============================================================
          # GUARDAR NOTICIA
          # ============================================================

          history.append({

              "id": news_id,

              "url": clean_link,

              "title": title,

              "summary":
                  ai_text[:2500],

              "status":
                  "published_to_review",

              "date":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(

              HISTORY_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  history,

                  f,

                  indent=2,

                  ensure_ascii=False

              )


          print("========================================")
          print("CAL BOT V5")
          print("BORRADOR ENVIADO")
          print("NOTICIA REGISTRADA")
          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios."

          else

            git commit -m "Cal Bot: update GTA VI editorial history"

            git push

          fi
