name: GTA VI News - Cal Bot V11

on:
schedule:
- cron: “*/30 * * * *”
workflow_dispatch:

concurrency:
group: gta-vi-news-bot
cancel-in-progress: false

permissions:
contents: write

jobs:
news:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v6
    with:
      fetch-depth: 0
  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install feedparser requests beautifulsoup4
  - name: Cal Bot V11 - Editor de Noticias
    env:
      NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python - <<'PY'
      import feedparser
      import requests
      import os
      import json
      import hashlib
      import re
      import time
      import calendar
      from bs4 import BeautifulSoup
      from datetime import datetime, timezone, timedelta
      from difflib import SequenceMatcher
      from urllib.parse import urlparse, parse_qs, urlencode, urlunparse
      # ============================================================
      # CONFIGURACIÓN
      # ============================================================
      WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
      GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
      HISTORY_FILE = "seen_news.json"
      ROLE_ID = "1504921814759903343"
      RSS_URL = (
          "https://news.google.com/rss/"
          "?q=GTA+VI"
          "&hl=en-US"
          "&gl=US"
          "&ceid=US:en"
      )
      GEMINI_MODELS = [
          "gemini-3.7-flash",
          "gemini-3.6-flash",
          "gemini-3.5-flash-lite"
      ]
      MAX_HISTORY = 1000
      MAX_NEWS_AGE_HOURS = 96
      # ============================================================
      # VALIDACIÓN
      # ============================================================
      if not WEBHOOK:
          print("ERROR: falta NEWS_DRAFT_WEBHOOK.")
          raise SystemExit(1)
      if not GEMINI_KEY:
          print("ERROR: falta GEMINI_API_KEY.")
          raise SystemExit(1)
      # ============================================================
      # FUNCIONES
      # ============================================================
      def normalize_text(text):
          if not text:
              return ""
          text = text.lower()
          replacements = {
              "grand theft auto vi": "gta vi",
              "grand theft auto 6": "gta 6",
              "grand theft auto": "gta",
              "gta 6": "gta vi"
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = re.sub(r"https?://\S+", "", text)
          text = re.sub(
              r"[^a-z0-9áéíóúüñ ]+",
              " ",
              text
          )
          text = re.sub(
              r"\s+",
              " ",
              text
          )
          return text.strip()
      def similarity(a, b):
          a = normalize_text(a)
          b = normalize_text(b)
          if not a or not b:
              return 0
          return SequenceMatcher(
              None,
              a,
              b
          ).ratio()
      def canonical_url(url):
          if not url:
              return ""
          try:
              parsed = urlparse(url)
              query = parse_qs(
                  parsed.query,
                  keep_blank_values=True
              )
              ignored = {
                  "utm_source",
                  "utm_medium",
                  "utm_campaign",
                  "utm_term",
                  "utm_content",
                  "oc"
              }
              clean_query = {
                  k: v
                  for k, v in query.items()
                  if k not in ignored
              }
              new_query = urlencode(
                  clean_query,
                  doseq=True
              )
              return urlunparse((
                  parsed.scheme,
                  parsed.netloc.lower(),
                  parsed.path.rstrip("/"),
                  "",
                  new_query,
                  ""
              ))
          except Exception:
              return url
      def make_id(title, url):
          value = (
              normalize_text(title)
              + "|"
              + canonical_url(url)
          )
          return hashlib.sha256(
              value.encode("utf-8")
          ).hexdigest()
      def content_hash(text):
          return hashlib.sha256(
              normalize_text(text)
              .encode("utf-8")
          ).hexdigest()
      def clean_html(text):
          if not text:
              return ""
          soup = BeautifulSoup(
              text,
              "html.parser"
          )
          return soup.get_text(
              " ",
              strip=True
          )
      # ============================================================
      # HISTORIAL
      # ============================================================
      if os.path.exists(HISTORY_FILE):
          try:
              with open(
                  HISTORY_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  history = json.load(f)
          except Exception:
              history = {}
      else:
          history = {}
      if isinstance(history, list):
          history = {
              "published": history,
              "rejected": [],
              "titles": [],
              "content_hashes": []
          }
      history.setdefault("published", [])
      history.setdefault("rejected", [])
      history.setdefault("titles", [])
      history.setdefault("content_hashes", [])
      # ============================================================
      # INICIO
      # ============================================================
      print("=" * 58)
      print("CAL BOT V11")
      print("EDITOR DE NOTICIAS DE CAL FAMILY")
      print("=" * 58)
      print("Buscando noticias nuevas...")
      # ============================================================
      # RSS
      # ============================================================
      feed = feedparser.parse(RSS_URL)
      if not feed.entries:
          print("No se encontraron noticias.")
          raise SystemExit(0)
      now = datetime.now(timezone.utc)
      candidate = None
      # ============================================================
      # BUSCAR CANDIDATO
      # ============================================================
      for entry in feed.entries:
          title = entry.get(
              "title",
              ""
          ).strip()
          google_url = entry.get(
              "link",
              ""
          ).strip()
          if not title or not google_url:
              continue
          published_time = None
          if getattr(
              entry,
              "published_parsed",
              None
          ):
              try:
                  timestamp = calendar.timegm(
                      entry.published_parsed
                  )
                  published_time = datetime.fromtimestamp(
                      timestamp,
                      timezone.utc
                  )
              except Exception:
                  published_time = None
          if published_time:
              age = now - published_time
              if age > timedelta(
                  hours=MAX_NEWS_AGE_HOURS
              ):
                  print(
                      "Ignorada: noticia demasiado antigua."
                  )
                  continue
          normalized_url = canonical_url(
              google_url
          )
          news_id = make_id(
              title,
              normalized_url
          )
          # --------------------------------------------------------
          # YA PUBLICADA
          # --------------------------------------------------------
          if news_id in history["published"]:
              print(
                  "Ignorada: ya fue publicada."
              )
              continue
          # --------------------------------------------------------
          # YA DESCARTADA
          # --------------------------------------------------------
          if news_id in history["rejected"]:
              print(
                  "Ignorada: ya fue descartada."
              )
              continue
          # --------------------------------------------------------
          # TÍTULO REPETIDO
          # --------------------------------------------------------
          duplicate = False
          for old_title in history["titles"]:
              if similarity(
                  title,
                  old_title
              ) >= 0.88:
                  duplicate = True
                  break
          if duplicate:
              print(
                  "Ignorada: título demasiado parecido."
              )
              continue
          # --------------------------------------------------------
          # RSS CONTENT
          # --------------------------------------------------------
          summary = clean_html(
              entry.get(
                  "summary",
                  ""
              )
          )
          description = clean_html(
              entry.get(
                  "description",
                  ""
              )
          )
          rss_content = (
              summary
              + "\n"
              + description
          ).strip()
          candidate = {
              "id": news_id,
              "title": title,
              "google_url": google_url,
              "canonical_url": normalized_url,
              "rss_content": rss_content
          }
          break
      # ============================================================
      # NO HAY CANDIDATO
      # ============================================================
      if candidate is None:
          print("=" * 58)
          print("NO HAY NOTICIAS NUEVAS.")
          print("=" * 58)
          raise SystemExit(0)
      title = candidate["title"]
      google_url = candidate["google_url"]
      rss_content = candidate["rss_content"]
      news_id = candidate["id"]
      print("=" * 58)
      print("CANDIDATO ENCONTRADO")
      print(title)
      print(google_url)
      print("=" * 58)
      # ============================================================
      # OBTENER ARTÍCULO
      # ============================================================
      article_text = ""
      final_source_url = google_url
      headers = {
          "User-Agent":
              "Mozilla/5.0 "
              "(X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/124 Safari/537.36"
      }
      try:
          page = requests.get(
              google_url,
              headers=headers,
              timeout=25,
              allow_redirects=True
          )
          print(
              "Estado de página:",
              page.status_code
          )
          final_source_url = page.url
          if page.ok:
              soup = BeautifulSoup(
                  page.text,
                  "html.parser"
              )
              for element in soup(
                  [
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header"
                  ]
              ):
                  element.decompose()
              paragraphs = []
              for p in soup.find_all("p"):
                  text = p.get_text(
                      " ",
                      strip=True
                  )
                  if len(text) >= 50:
                      paragraphs.append(text)
              article_text = "\n".join(
                  paragraphs
              )
              article_text = article_text[:18000]
      except Exception as error:
          print(
              "Error obteniendo artículo:"
          )
          print(error)
      # ============================================================
      # FUENTE
      # ============================================================
      if len(article_text) >= 300:
          source_content = article_text
      elif len(rss_content) >= 100:
          source_content = rss_content
      else:
          print("=" * 58)
          print("DESCARTADA: no hay suficiente información.")
          print("=" * 58)
          history["rejected"].append(
              news_id
          )
          history["rejected"] = (
              history["rejected"][-MAX_HISTORY:]
          )
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          raise SystemExit(0)
      # ============================================================
      # HASH
      # ============================================================
      current_hash = content_hash(
          source_content
      )
      if current_hash in history["content_hashes"]:
          print("=" * 58)
          print("DESCARTADA: contenido repetido.")
          print("=" * 58)
          history["rejected"].append(
              news_id
          )
          history["rejected"] = (
              history["rejected"][-MAX_HISTORY:]
          )
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          raise SystemExit(0)
      # ============================================================
      # HISTORIAL PARA GEMINI
      # ============================================================
      recent_titles = history["titles"][-60:]
      previous_titles = "\n".join(
          f"- {x}"
          for x in recent_titles
      )
      # ============================================================
      # PROMPT EDITORIAL
      # ============================================================
      prompt = f"""

Eres CAL BOT, editor de noticias de CAL FAMILY,
una comunidad dedicada exclusivamente a Grand Theft Auto VI.

Tu función principal es FILTRAR noticias.

No debes intentar publicar algo simplemente porque exista un artículo.

Una publicación solamente debe pasar si contiene información
NUEVA, CONCRETA Y VERIFICABLE.

============================================================
HISTORIAL RECIENTE

{previous_titles}

============================================================
ARTÍCULO ACTUAL

TÍTULO:
{title}

FUENTE:
{final_source_url}

CONTENIDO:
{source_content}

============================================================
REGLAS EDITORIALES

DESCARTA si:

* Es una repetición de una noticia anterior.
* Es otro medio hablando del mismo anuncio.
* Es una reacción de un periodista.
* Es una opinión.
* Es un artículo cultural sin datos nuevos.
* Es especulación reciclada.
* Es un rumor sin una fuente concreta.
* Solo repite información que la comunidad ya conoce.
* Solo habla del mismo tráiler o Extended Look sin información adicional.
* Solo cambia el titular de una noticia existente.
* El artículo no permite comprobar el supuesto dato.
* El contenido es demasiado limitado.
* El artículo habla de expectativas generales sobre GTA VI.

PUBLICA solamente si existe un dato concreto que cambie o amplíe
lo que la comunidad sabe.

Ejemplos de información que podría justificar PUBLICAR:

* Una declaración nueva de Rockstar Games.
* Una declaración nueva de Take-Two.
* Una entrevista nueva con un desarrollador.
* Una fecha oficialmente anunciada.
* Una característica del juego confirmada por una fuente fiable.
* Información nueva sobre personajes.
* Información nueva sobre el mapa.
* Información nueva sobre gameplay.
* Información nueva sobre lanzamiento.
* Información nueva sobre plataformas.
* Información nueva sobre tecnología del juego.
* Información nueva sobre contenido confirmado.
* Un acontecimiento importante relacionado directamente con GTA VI.

IMPORTANTE:

Una fuente secundaria puede publicarse si realmente aporta
un dato nuevo y concreto atribuido a una fuente identificable.

NO descartes automáticamente una noticia solamente porque
no venga directamente de Rockstar.

Lo importante es si existe información nueva, concreta
y verificable.

Nunca inventes información.

Nunca conviertas opinión en hecho.

Nunca conviertas especulación en confirmación.

============================================================
DECISIÓN

Devuelve únicamente JSON válido:

{{
“decision”: “PUBLICAR” o “DESCARTAR”,
“reason”: “explicación breve”,
“category”: “Noticias” o “Análisis”,
“title”: “título en español”,
“content”: “texto final”
}}

Si decides DESCARTAR:

content debe ser “”

Si decides PUBLICAR:

El contenido debe:

* Estar en español.
* Tener entre 500 y 1100 caracteres.
* Ser profesional.
* Ser directo.
* No repetir información.
* No inventar contexto.
* No incluir enlaces.
* No mencionar que eres una IA.

Formato:

[Introducción]

El dato clave

[Información concreta]

Por qué importa

[Relevancia]

⚠️ Contexto

[Indica si procede de una fuente externa,
si es una declaración, análisis o información oficial.]

============================================================
DECISIÓN CONSERVADORA

Si tienes dudas entre PUBLICAR y DESCARTAR:

DESCARTA.

La calidad de CAL FAMILY es más importante que publicar
muchas noticias.
“””

      # ============================================================
      # GEMINI
      # ============================================================
      print("=" * 58)
      print("CAL BOT ESTÁ EVALUANDO...")
      print("=" * 58)
      gemini_result = None
      for model in GEMINI_MODELS:
          print(
              "Intentando:",
              model
          )
          endpoint = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{model}:generateContent"
              f"?key={GEMINI_KEY}"
          )
          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "maxOutputTokens": 1800,
                  "responseMimeType": "application/json"
              }
          }
          for attempt in range(3):
              try:
                  response = requests.post(
                      endpoint,
                      headers={
                          "Content-Type":
                              "application/json"
                      },
                      json=payload,
                      timeout=90
                  )
                  print(
                      "Gemini HTTP:",
                      response.status_code
                  )
                  if response.status_code == 200:
                      gemini_result = response.json()
                      break
                  if response.status_code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):
                      wait = 5 * (
                          attempt + 1
                      )
                      print(
                          f"Reintentando en {wait} segundos..."
                      )
                      time.sleep(wait)
                      continue
                  print(
                      response.text[:2000]
                  )
                  break
              except Exception as error:
                  print(
                      "Error de conexión:",
                      error
                  )
                  time.sleep(
                      5 * (attempt + 1)
                  )
          if gemini_result is not None:
              break
      # ============================================================
      # GEMINI FALLÓ
      # ============================================================
      if gemini_result is None:
          print("=" * 58)
          print("ERROR: GEMINI NO RESPONDIÓ.")
          print("La noticia NO será marcada como descartada.")
          print("Se podrá intentar nuevamente.")
          print("=" * 58)
          raise SystemExit(1)
      # ============================================================
      # INTERPRETAR GEMINI
      # ============================================================
      try:
          candidates = gemini_result.get(
              "candidates",
              []
          )
          if not candidates:
              raise ValueError(
                  "No hay candidates."
              )
          parts = candidates[0] \
              .get("content", {}) \
              .get("parts", [])
          if not parts:
              raise ValueError(
                  "No hay parts."
              )
          ai_text = parts[0] \
              .get("text", "") \
              .strip()
          ai_text = re.sub(
              r"^```json\s*",
              "",
              ai_text,
              flags=re.IGNORECASE
          )
          ai_text = re.sub(
              r"\s*```$",
              "",
              ai_text
          )
          result = json.loads(
              ai_text
          )
      except Exception as error:
          print("=" * 58)
          print("ERROR INTERPRETANDO GEMINI")
          print(error)
          print("=" * 58)
          raise SystemExit(1)
      # ============================================================
      # DECISIÓN
      # ============================================================
      decision = str(
          result.get(
              "decision",
              "DESCARTAR"
          )
      ).upper().strip()
      reason = str(
          result.get(
              "reason",
              ""
          )
      ).strip()
      # ============================================================
      # DESCARTADA
      # ============================================================
      if decision != "PUBLICAR":
          print("=" * 58)
          print("DESCARTADA POR CAL BOT")
          print("=" * 58)
          print(reason)
          # IMPORTANTE:
          # La noticia queda guardada como RECHAZADA.
          # No volverá a ser evaluada.
          history["rejected"].append(
              news_id
          )
          history["titles"].append(
              title
          )
          history["rejected"] = (
              list(
                  dict.fromkeys(
                      history["rejected"]
                  )
              )[-MAX_HISTORY:]
          )
          history["titles"] = (
              history["titles"][-MAX_HISTORY:]
          )
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          print(
              "Guardada en historial como RECHAZADA."
          )
          raise SystemExit(0)
      # ============================================================
      # DATOS PUBLICACIÓN
      # ============================================================
      ai_title = str(
          result.get(
              "title",
              ""
          )
      ).strip()
      ai_content = str(
          result.get(
              "content",
              ""
          )
      ).strip()
      category = str(
          result.get(
              "category",
              "Noticias"
          )
      ).strip()
      if category not in (
          "Noticias",
          "Análisis"
      ):
          category = "Noticias"
      if not ai_title or not ai_content:
          print(
              "DESCARTADA: contenido inválido."
          )
          history["rejected"].append(
              news_id
          )
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          raise SystemExit(0)
      # ============================================================
      # SEGURIDAD FINAL
      # ============================================================
      for old_title in history["titles"]:
          if similarity(
              ai_title,
              old_title
          ) >= 0.90:
              print(
                  "DESCARTADA: título repetido."
              )
              history["rejected"].append(
                  news_id
              )
              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      history,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )
              raise SystemExit(0)
      # ============================================================
      # MENSAJE DISCORD
      # ============================================================
      date_text = datetime.now(
          timezone.utc
      ).strftime("%d/%m/%Y")
      final_message = (
          f"<@&{ROLE_ID}>\n\n"
          f"🧭 **{category}**\n\n"
          f"# {ai_title}\n\n"
          f"{ai_content}\n\n"
          f"🔗 **Fuente original:** "
          f"{final_source_url}\n\n"
          f"⚠️ **REVISIÓN REQUERIDA**\n"
          f"Este contenido fue preparado por Cal Bot "
          f"como borrador editorial. "
          f"Revisa la información antes de publicarlo "
          f"en #noticias.\n\n"
          f"-# Cal Bot V11 · {date_text}"
      )
      if len(final_message) > 1950:
          print(
              "DESCARTADA: mensaje demasiado largo."
          )
          history["rejected"].append(
              news_id
          )
          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          raise SystemExit(0)
      # ============================================================
      # DISCORD
      # ============================================================
      print("=" * 58)
      print("ENVIANDO A DISCORD...")
      print("=" * 58)
      discord_payload = {
          "content": final_message,
          "username": "Cal Bot",
          "allowed_mentions": {
              "roles": [
                  ROLE_ID
              ]
          }
      }
      try:
          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )
      except Exception as error:
          print(
              "ERROR CONECTANDO CON DISCORD:"
          )
          print(error)
          print(
              "La noticia NO será guardada como publicada."
          )
          raise SystemExit(1)
      print(
          "Discord HTTP:",
          discord_response.status_code
      )
      if not discord_response.ok:
          print(
              "ERROR DE DISCORD:"
          )
          print(
              discord_response.text
          )
          print(
              "La noticia NO será marcada como publicada."
          )
          raise SystemExit(1)
      # ============================================================
      # PUBLICACIÓN CONFIRMADA
      # ============================================================
      print("=" * 58)
      print("DISCORD CONFIRMÓ EL ENVÍO.")
      print("=" * 58)
      history["published"].append(
          news_id
      )
      history["titles"].append(
          ai_title
      )
      history["content_hashes"].append(
          current_hash
      )
      history["published"] = (
          list(
              dict.fromkeys(
                  history["published"]
              )
          )[-MAX_HISTORY:]
      )
      history["rejected"] = (
          list(
              dict.fromkeys(
                  history["rejected"]
              )
          )[-MAX_HISTORY:]
      )
      history["titles"] = (
          history["titles"][-MAX_HISTORY:]
      )
      history["content_hashes"] = (
          history["content_hashes"][-MAX_HISTORY:]
      )
      with open(
          HISTORY_FILE,
          "w",
          encoding="utf-8"
      ) as f:
          json.dump(
              history,
              f,
              indent=2,
              ensure_ascii=False
          )
      print("=" * 58)
      print("NOTICIA PUBLICADA Y GUARDADA.")
      print("=" * 58)
      PY
  # ============================================================
  # GUARDAR HISTORIAL
  # ============================================================
  - name: Save news history
    run: |
      git config user.name "Cal Bot"
