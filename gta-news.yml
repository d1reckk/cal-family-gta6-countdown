name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Find and analyze GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          import json
          import hashlib
          from datetime import datetime, timezone

          WEBHOOK = os.environ["NEWS_DRAFT_WEBHOOK"]
          OPENAI_KEY = os.environ["OPENAI_API_KEY"]

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):
              with open(HISTORY_FILE, "r", encoding="utf-8") as f:
                  seen = json.load(f)
          else:
              seen = []

          # ============================================================
          # BUSCAR NOTICIAS
          # ============================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              print("No se encontraron noticias.")
              exit(0)

          article = None

          for entry in feed.entries:

              title = entry.get("title", "").strip()
              link = entry.get("link", "").strip()

              if not title or not link:
                  continue

              news_id = hashlib.sha256(
                  link.encode("utf-8")
              ).hexdigest()

              if news_id not in seen:
                  article = {
                      "id": news_id,
                      "title": title,
                      "link": link
                  }
                  break

          if article is None:
              print("No hay noticias nuevas.")
              exit(0)

          title = article["title"]
          link = article["link"]
          news_id = article["id"]

          print("Noticia encontrada:")
          print(title)

          # ============================================================
          # PEDIR A OPENAI QUE REDACTE EL BORRADOR
          # ============================================================

          prompt = f"""
          Eres el editor de noticias de una comunidad dedicada a Grand Theft Auto VI.

          Debes preparar un BORRADOR para Discord basándote únicamente
          en la información disponible en el título y enlace proporcionados.

          Título:
          {title}

          Enlace:
          {link}

          FORMATO OBLIGATORIO:

          🧭 **Análisis**

          # [Título en español]

          [Introducción breve y clara explicando la noticia.]

          **El dato que lo pone en perspectiva**

          [Contexto relevante.]

          **La señal que más dice**

          [Explicación del detalle más importante.]

          **Por qué importa**

          [Explica por qué esta información es relevante para GTA VI.]

          ⚠️ **Importante:** indica claramente si se trata de
          información oficial, análisis, opinión, rumor o especulación.

          REGLAS:

          - No inventes información.
          - No presentes rumores como hechos.
          - No inventes declaraciones de Rockstar Games.
          - No inventes fechas.
          - No inventes cifras.
          - Si el artículo es un análisis, llama al contenido "Análisis".
          - Si es información oficial, utiliza "Noticias".
          - Escribe en español natural.
          - Usa negritas para datos importantes.
          - Mantén un tono profesional pero atractivo.
          - No utilices emojis excesivos.
          - No incluyas enlaces adicionales.
          - No escribas explicaciones fuera del formato.
          """

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": f"Bearer {OPENAI_KEY}",
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-5.6",
                  "input": prompt,
                  "max_output_tokens": 1200
              },
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          # ============================================================
          # EXTRAER TEXTO DE LA RESPUESTA
          # ============================================================

          ai_text = data.get("output_text", "").strip()

          if not ai_text:
              print("OpenAI no devolvió texto.")
              print(data)
              exit(1)

          # ============================================================
          # AÑADIR INFORMACIÓN DE FUENTE
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d de %B de %Y")

          final_message = (
              "<@&1504921814759903343>\n\n"
              + ai_text
              + "\n\n"
              + f"🔗 **Fuente:** {link}\n"
              + "\n"
              + "⚠️ **REVISIÓN REQUERIDA**\n"
              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."
              + "\n\n"
              + f"-# Detectado por Cal Bot · {today}"
          )

          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          payload = {
              "content": final_message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [
                      "1504921814759903343"
                  ]
              }
          }

          discord_response = requests.post(
              WEBHOOK,
              json=payload,
              timeout=30
          )

          discord_response.raise_for_status()

          print("Borrador enviado correctamente a Discord.")

          # ============================================================
          # GUARDAR EN HISTORIAL
          # ============================================================

          seen.append(news_id)
          seen = seen[-500:]

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  seen,
                  f,
                  indent=2
              )

          PY

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Update GTA VI news history"
            git push
          fi
