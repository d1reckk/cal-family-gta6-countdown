name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Check for new GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import os
          import json
          import hashlib

          WEBHOOK = os.environ["NEWS_DRAFT_WEBHOOK"]

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              with open(
                  HISTORY_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  seen = json.load(f)

          else:
              seen = []

          # ============================================================
          # OBTENER NOTICIAS
          # ============================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              print("No se encontraron noticias.")
              exit(0)

          # ============================================================
          # BUSCAR SOLO LA PRIMERA NOTICIA NUEVA
          # ============================================================

          new_article = None

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not link:
                  continue

              news_id = hashlib.sha256(
                  link.encode("utf-8")
              ).hexdigest()

              if news_id not in seen:

                  new_article = {
                      "id": news_id,
                      "title": title,
                      "link": link
                  }

                  break

          # ============================================================
          # SI NO HAY NADA NUEVO
          # ============================================================

          if new_article is None:

              print(
                  "No hay noticias nuevas."
              )

              exit(0)

          # ============================================================
          # DATOS
          # ============================================================

          title = new_article["title"]
          link = new_article["link"]
          news_id = new_article["id"]

          # ============================================================
          # CREAR BORRADOR
          # ============================================================

          content = (
              "<@&1504921814759903343>\n\n"
              "🧭 **Noticias**\n\n"
              f"# {title}\n\n"
              "**Resumen**\n"
              "Nueva información relacionada con "
              "Grand Theft Auto VI.\n\n"
              "**Fuente original**\n"
              f"{link}\n\n"
              "⚠️ **REVISIÓN REQUERIDA**\n"
              "Este mensaje es un borrador. "
              "Revisa la información antes de publicarla "
              "en #noticias."
          )

          payload = {
              "content": content,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [
                      "1504921814759903343"
                  ]
              }
          }

          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          response = requests.post(
              WEBHOOK,
              json=payload,
              timeout=30
          )

          response.raise_for_status()

          print(
              "Borrador enviado correctamente:"
          )

          print(title)

          # ============================================================
          # GUARDAR COMO VISTA
          # ============================================================

          seen.append(news_id)

          # Mantener solamente los últimos 500
          seen = seen[-500:]

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  seen,
                  f,
                  indent=2
              )

          print(
              "Historial actualizado."
          )

          PY

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Update GTA VI news history"
            git push
          fi
