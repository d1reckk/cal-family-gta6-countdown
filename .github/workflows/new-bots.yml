```yaml
name: GTA VI News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

jobs:
  news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository files
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== ROOT FILES =========="
          find . -maxdepth 2 -type f | sort

          echo "========== REQUIREMENTS =========="
          if [ -f requirements.txt ]; then
            echo "requirements.txt FOUND"
            cat requirements.txt
          else
            echo "ERROR: requirements.txt NOT FOUND"
            exit 1
          fi

          echo "========== BOT =========="
          if [ -f cal_bot.py ]; then
            echo "cal_bot.py FOUND"
          else
            echo "ERROR: cal_bot.py NOT FOUND"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify bot syntax
        run: |
          python -m py_compile cal_bot.py

      - name: Verify secrets
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$NEWS_DRAFT_WEBHOOK" ]; then
            echo "ERROR: NEWS_DRAFT_WEBHOOK is missing."
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Run bot
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: |
          python cal_bot.py

      - name: Save news history
        if: always()
        run: |
          if [ ! -f seen_news.json ]; then
            echo "seen_news.json does not exist."
            exit 0
          fi

          if git diff --quiet -- seen_news.json; then
            echo "No history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json
          git commit -m "Update news history"
          git push
```
