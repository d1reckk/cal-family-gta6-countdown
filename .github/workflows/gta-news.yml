name: GTA VI News - Cal Bot V6

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT V6
      # ============================================================

      - name: Cal Bot Editor
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import sys

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          MODEL = "gemini-3.7-flash"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 1500

          # Solo se utilizan estas noticias para comprobar
          # duplicados/reciclaje editorial.
          COMPARISON_HISTORY = 200


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:

              print("ERROR: NEWS_DRAFT_WEBHOOK no existe.")
              sys.exit(1)


          if not GEMINI_KEY:

              print("ERROR: GEMINI_API_KEY no existe.")
              sys.exit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_url(url):

              if not url:
                  return ""

              url = url.strip()

              return url.rstrip("?&")


          def normalize_text(text):

              if not text:
                  return ""

              text = text.lower()

              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ\s]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def make_id(url):

              return hashlib.sha256(
                  normalize_url(url).encode("utf-8")
              ).hexdigest()


          def title_words(title):

              words = set(
                  normalize_text(title).split()
              )

              stopwords = {
                  "the",
                  "a",
                  "an",
                  "and",
                  "or",
                  "of",
                  "to",
                  "in",
                  "on",
                  "for",
                  "with",
                  "from",
                  "gta",
                  "grand",
                  "theft",
                  "auto",
                  "vi",
                  "6",
                  "el",
                  "la",
                  "los",
                  "las",
                  "un",
                  "una",
                  "unos",
                  "unas",
                  "de",
                  "del",
                  "en",
                  "y",
                  "o",
                  "para",
                  "con",
                  "sobre"
              }

              return {
                  word
                  for word in words
                  if word not in stopwords
                  and len(word) > 2
              }


          def title_similarity(a, b):

              a_words = title_words(a)
              b_words = title_words(b)

              if not a_words or not b_words:
                  return 0.0

              intersection = len(
                  a_words & b_words
              )

              union = len(
                  a_words | b_words
              )

              return intersection / union


          def ask_gemini(prompt, max_tokens=1000):

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "maxOutputTokens": max_tokens
                  }
              }

              response = requests.post(
                  GEMINI_URL,
                  params={
                      "key": GEMINI_KEY
                  },
                  headers={
                      "Content-Type":
                          "application/json"
                  },
                  json=payload,
                  timeout=90
              )

              if not response.ok:

                  print("========================================")
                  print("ERROR DE GEMINI")
                  print("========================================")
                  print(response.status_code)
                  print(response.text)

                  sys.exit(1)

              data = response.json()

              try:

                  return (
                      data["candidates"][0]
                      ["content"]
                      ["parts"][0]
                      ["text"]
                      .strip()
                  )

              except Exception:

                  print(
                      "Respuesta inesperada de Gemini:"
                  )

                  print(
                      json.dumps(
                          data,
                          indent=2,
                          ensure_ascii=False
                      )
                  )

                  sys.exit(1)


          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          if not isinstance(history, list):

              history = []


          # Convertir historial antiguo
          # al formato nuevo.

          normalized_history = []

          for item in history:

              if isinstance(item, str):

                  normalized_history.append({
                      "id": item,
                      "url": "",
                      "title": "",
                      "summary": "",
                      "status": "old"
                  })

              elif isinstance(item, dict):

                  normalized_history.append(item)


          history = normalized_history


          seen_ids = {
              item.get("id")
              for item in history
              if item.get("id")
          }


          # ============================================================
          # RSS
          # ============================================================

          print("========================================")
          print("CAL BOT V6")
          print("EDITOR DE NOTICIAS")
          print("BUSCANDO NOTICIAS...")
          print("========================================")


          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print("No hay resultados RSS.")

              sys.exit(0)


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          article = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not link:
                  continue


              clean_link = normalize_url(
                  link
              )

              news_id = make_id(
                  link
              )


              # --------------------------------------------------------
              # DUPLICADO EXACTO
              # --------------------------------------------------------

              if news_id in seen_ids:

                  print(
                      "Ignorada: URL ya procesada."
                  )

                  continue


              duplicate = False


              for old in history:

                  old_url = normalize_url(
                      old.get(
                          "url",
                          ""
                      )
                  )

                  if (
                      old_url
                      and old_url == clean_link
                  ):

                      duplicate = True
                      break


              if duplicate:

                  print(
                      "Ignorada: URL duplicada."
                  )

                  continue


              # --------------------------------------------------------
              # TÍTULOS CASI IDÉNTICOS
              #
              # SOLO bloqueamos títulos prácticamente iguales.
              #
              # NO bloqueamos noticias simplemente porque hablan
              # del mismo tema.
              # --------------------------------------------------------

              almost_same = False


              for old in history[-COMPARISON_HISTORY:]:

                  old_title = old.get(
                      "title",
                      ""
                  )

                  if not old_title:
                      continue


                  similarity = title_similarity(
                      title,
                      old_title
                  )


                  if similarity >= 0.90:

                      print(
                          "Ignorada: título prácticamente "
                          "idéntico a una noticia anterior."
                      )

                      almost_same = True

                      break


              if almost_same:

                  continue


              article = {
                  "id": news_id,
                  "title": title,
                  "link": link,
                  "clean_link": clean_link
              }

              break


          if article is None:

              print("========================================")
              print("NO HAY CANDIDATOS NUEVOS.")
              print("========================================")

              sys.exit(0)


          title = article["title"]
          link = article["link"]
          clean_link = article["clean_link"]
          news_id = article["id"]


          print("========================================")
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(link)
          print("========================================")


          # ============================================================
          # DESCARGAR ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
              }


              page = requests.get(
                  link,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )


              print(
                  "Estado de página:",
                  page.status_code
              )


              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )


                  for element in soup([
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer"
                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:

                          paragraphs.append(
                              text
                          )


                  article_text = "\n".join(
                      paragraphs
                  )

                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo obtener directamente "
                  "el artículo:"
              )

              print(error)


          if not article_text:

              article_text = (
                  "No se pudo obtener el texto "
                  "completo del artículo. "
                  "Utiliza el título y cualquier "
                  "información disponible."
              )


          # ============================================================
          # HISTORIAL PARA EL EDITOR
          # ============================================================

          previous_news = []


          for old in history[-COMPARISON_HISTORY:]:

              if not old.get("title"):
                  continue


              previous_news.append({
                  "title":
                      old.get(
                          "title",
                          ""
                      ),

                  "summary":
                      old.get(
                          "summary",
                          ""
                      )[:1200],

                  "status":
                      old.get(
                          "status",
                          ""
                      )
              })


          previous_json = json.dumps(
              previous_news,
              ensure_ascii=False,
              indent=2
          )


          # ============================================================
          # EDITOR V6
          # ============================================================

          print("========================================")
          print("CAL BOT ESTÁ EVALUANDO LA NOTICIA...")
          print("========================================")


          editor_prompt = f"""

          Eres el EDITOR JEFE de CAL FAMILY,
          una comunidad especializada exclusivamente
          en Grand Theft Auto VI.

          Tu misión es decidir si un artículo contiene
          una NOVEDAD REAL que merezca aparecer en
          nuestro canal interno de revisión.

          NO debes confundir:

          "habla del mismo tema"

          con:

          "es la misma noticia".

          ============================================================
          NUEVO ARTÍCULO
          ============================================================

          TÍTULO:

          {title}

          CONTENIDO:

          {article_text[:12000]}

          ============================================================
          HISTORIAL DE CAL FAMILY
          ============================================================

          {previous_json}

          ============================================================
          REGLA PRINCIPAL
          ============================================================

          Una noticia puede ser APROBADA aunque trate
          exactamente del mismo tema que una noticia anterior
          SI contiene un acontecimiento, declaración, anuncio,
          dato o información NUEVA.

          EJEMPLO:

          Noticia anterior:

          "Rockstar publica el GTA VI Extended Look."

          Nueva noticia:

          "Netflix anuncia que el Extended Look de GTA VI
          ya está disponible en su plataforma."

          RESULTADO:

          APROBAR.

          Son el mismo tema general, pero son
          acontecimientos diferentes.

          ============================================================
          DUPLICADO REAL
          ============================================================

          DESCARTA si el nuevo artículo:

          - simplemente repite exactamente la misma información;
          - resume una noticia anterior sin aportar nada;
          - reacciona al mismo tráiler;
          - expresa una opinión sobre una noticia anterior;
          - vuelve a explicar un rumor antiguo;
          - copia información publicada anteriormente;
          - cambia solamente el titular;
          - convierte una noticia anterior en una pregunta;
          - hace un "todo lo que sabemos" sin datos nuevos.

          ============================================================
          NOTICIA NUEVA
          ============================================================

          APRUEBA si existe:

          - nuevo anuncio oficial;
          - nueva publicación de Rockstar;
          - nueva declaración de Rockstar;
          - nueva declaración de Take-Two;
          - nueva declaración de un desarrollador;
          - nueva entrevista con información concreta;
          - nuevo tráiler;
          - nuevas capturas;
          - nuevo material oficial;
          - nueva fecha;
          - nuevo dato técnico confirmado;
          - nueva información sobre personajes;
          - nueva información sobre gameplay;
          - nueva información sobre mapa;
          - nueva información sobre lanzamiento;
          - nuevo anuncio de Netflix relacionado con GTA VI;
          - nuevo anuncio de PlayStation, Xbox u otra plataforma;
          - nueva información sustancial de una fuente fiable.

          ============================================================
          RUMORES
          ============================================================

          Un rumor SOLO puede aprobarse si:

          1. Es realmente nuevo.

          2. Tiene una fuente identificable.

          3. El artículo aporta información concreta.

          4. No es simplemente un rumor antiguo reciclado.

          Si se aprueba, debe clasificarse como:

          "Rumor"

          y nunca presentarse como hecho confirmado.

          ============================================================
          ESPECULACIÓN
          ============================================================

          DESCARTA:

          "GTA VI podría pesar X GB"

          si no existe una fuente nueva y verificable.

          DESCARTA:

          "Los fans creen que..."

          si no existe información nueva.

          DESCARTA:

          "GTA VI podría tener..."

          si solamente es especulación.

          DESCARTA:

          "Esto podría significar..."

          cuando no existe un dato nuevo detrás.

          ============================================================
          ARTÍCULOS DE OPINIÓN
          ============================================================

          Normalmente DESCARTA:

          - reacciones;
          - impresiones;
          - "mi opinión";
          - "lo que pienso";
          - artículos diciendo que el juego se ve increíble;
          - artículos diciendo que Rockstar lo hará mejor;
          - artículos comparando GTA VI con otros juegos
            sin aportar información nueva.

          ============================================================
          REGLA CONTRA EL RELLENO
          ============================================================

          Si el artículo no tiene información suficiente
          para justificar una noticia, DESCÁRTALO.

          Nunca inventes información para convertir un artículo
          mediocre en una noticia.

          ============================================================
          DECISIÓN
          ============================================================

          Responde ÚNICAMENTE con JSON válido:

          {{
            "publish": true,
            "type": "Noticias",
            "reason": "explicación breve",
            "new_information": "qué acontecimiento o dato nuevo contiene"
          }}

          O:

          {{
            "publish": true,
            "type": "Rumor",
            "reason": "explicación breve",
            "new_information": "qué información nueva contiene"
          }}

          O:

          {{
            "publish": true,
            "type": "Análisis",
            "reason": "explicación breve",
            "new_information": "qué información nueva justifica el análisis"
          }}

          O:

          {{
            "publish": false,
            "type": "Descartada",
            "reason": "explicación breve",
            "new_information": ""
          }}

          """


          editor_raw = ask_gemini(
              editor_prompt,
              700
          )


          editor_raw = re.sub(
              r"^```json\s*|\s*```$",
              "",
              editor_raw,
              flags=re.IGNORECASE
          ).strip()


          try:

              editor_result = json.loads(
                  editor_raw
              )

          except Exception:

              print(
                  "Gemini no devolvió JSON válido."
              )

              print(editor_raw)

              sys.exit(1)


          publish = bool(
              editor_result.get(
                  "publish",
                  False
              )
          )


          news_type = editor_result.get(
              "type",
              "Noticias"
          )


          reason = editor_result.get(
              "reason",
              ""
          )


          new_information = editor_result.get(
              "new_information",
              ""
          )


          print("========================================")
          print("DECISIÓN EDITORIAL")
          print("========================================")

          print(
              "PUBLICAR:",
              publish
          )

          print(
              "TIPO:",
              news_type
          )

          print(
              "RAZÓN:",
              reason
          )

          print(
              "INFORMACIÓN NUEVA:",
              new_information
          )


          # ============================================================
          # DESCARTADA
          # ============================================================

          if not publish:

              print("========================================")
              print("DESCARTADA POR CAL BOT")
              print("========================================")

              history.append({

                  "id":
                      news_id,

                  "url":
                      clean_link,

                  "title":
                      title,

                  "summary":
                      f"DESCARTADA: {reason}",

                  "status":
                      "discarded",

                  "date":
                      datetime.now(
                          timezone.utc
                      ).isoformat()

              })


              history = history[-MAX_HISTORY:]


              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      history,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


              sys.exit(0)


          # ============================================================
          # REDACTOR
          # ============================================================

          print("========================================")
          print("REDACTANDO BORRADOR...")
          print("========================================")


          writing_prompt = f"""

          Eres el redactor oficial de CAL FAMILY.

          Convierte la información aprobada por el editor
          en un borrador profesional para Discord.

          ============================================================
          TÍTULO ORIGINAL
          ============================================================

          {title}

          ============================================================
          ARTÍCULO
          ============================================================

          {article_text[:12000]}

          ============================================================
          DECISIÓN DEL EDITOR
          ============================================================

          Tipo:

          {news_type}

          Motivo:

          {reason}

          Información nueva:

          {new_information}

          ============================================================
          REGLAS ABSOLUTAS
          ============================================================

          SOLO utiliza información presente en el artículo.

          NO inventes:

          - fechas;
          - cifras;
          - declaraciones;
          - personajes;
          - características;
          - funciones;
          - información de Rockstar;
          - información de Netflix;
          - información de desarrolladores;
          - contexto que no esté presente.

          No conviertas una especulación en hecho.

          No conviertas una opinión en noticia.

          No rellenes secciones con frases genéricas.

          ============================================================
          FORMATO
          ============================================================

          Si el tipo es Noticias:

          🧭 **Noticias**

          Si el tipo es Análisis:

          🧭 **Análisis**

          Si el tipo es Rumor:

          🧭 **Rumor**

          Después:

          # [Título atractivo en español]

          [Resumen claro de la noticia.]

          Solo si existe información suficiente:

          **El dato que lo pone en perspectiva**

          [Contexto real.]

          Solo si existe información suficiente:

          **La señal que más dice**

          [Detalle importante.]

          Solo si existe información suficiente:

          **Por qué importa**

          [Importancia basada exclusivamente en los datos.]

          Para rumores:

          ⚠️ **Esto no está confirmado oficialmente.**

          Explica brevemente qué está confirmado
          y qué pertenece al rumor.

          Para análisis:

          ⚠️ **Esto es un análisis, no un anuncio oficial.**

          ============================================================
          ESTILO
          ============================================================

          Español natural.

          Profesional.

          Directo.

          Informativo.

          Estilo de medio especializado en GTA VI.

          No exageres.

          No uses clickbait.

          No utilices demasiados emojis.

          No pongas enlaces.

          No menciones a la IA.

          Devuelve únicamente el texto final.

          """


          ai_text = ask_gemini(
              writing_prompt,
              1400
          )


          ai_text = ai_text.strip()


          # Limpiar bloques Markdown accidentales.

          ai_text = re.sub(
              r"^```[a-zA-Z]*\s*",
              "",
              ai_text
          )

          ai_text = re.sub(
              r"\s*```$",
              "",
              ai_text
          )

          ai_text = ai_text.strip()


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # DISCORD
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          print("========================================")
          print("ENVIANDO A DISCORD...")
          print("========================================")


          discord_response = requests.post(

              WEBHOOK,

              json={

                  "content":
                      final_message,

                  "username":
                      "Cal Bot",

                  "allowed_mentions": {

                      "roles": [
                          ROLE_ID
                      ]

                  }

              },

              timeout=30

          )


          if not discord_response.ok:

              print("========================================")
              print("ERROR DE DISCORD")
              print("========================================")

              print(
                  discord_response.status_code
              )

              print(
                  discord_response.text
              )

              sys.exit(1)


          # ============================================================
          # REGISTRAR COMO PROCESADA
          # ============================================================

          history.append({

              "id":
                  news_id,

              "url":
                  clean_link,

              "title":
                  title,

              "summary":
                  ai_text[:3000],

              "status":
                  "published_to_review",

              "type":
                  news_type,

              "new_information":
                  new_information,

              "date":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(

              HISTORY_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  history,

                  f,

                  indent=2,

                  ensure_ascii=False

              )


          print("========================================")
          print("CAL BOT V6")
          print("BORRADOR ENVIADO A DISCORD")
          print("NOTICIA REGISTRADA")
          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL EN GITHUB
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit -m "Cal Bot V6: update editorial history"

            git push

          fi
