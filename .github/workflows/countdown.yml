name: GTA VI Countdown

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Generate countdown image
        run: |
          pip install pillow requests

          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from datetime import datetime, timezone
          import requests

          release = datetime(2026, 11, 19, 0, 0, 0, tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)

          remaining = release - now

          days = max(remaining.days, 0)
          hours = max((remaining.seconds // 3600), 0)
          minutes = max(((remaining.seconds % 3600) // 60), 0)
          seconds = max((remaining.seconds % 60), 0)

          img = Image.new("RGB", (1200, 630), "#08090d")
          draw = ImageDraw.Draw(img)

          try:
              font_big = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 72
              )
              font_medium = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 42
              )
              font_small = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28
              )
          except:
              font_big = font_medium = font_small = None

          draw.text(
              (600, 100),
              "GRAND THEFT AUTO VI",
              fill="white",
              font=font_big,
              anchor="mm"
          )

          draw.text(
              (600, 190),
              "CAL FAMILY",
              fill="#ff6fae",
              font=font_medium,
              anchor="mm"
          )

          countdown = f"{days} DAYS  {hours:02d}:{minutes:02d}:{seconds:02d}"

          draw.text(
              (600, 330),
              countdown,
              fill="white",
              font=font_big,
              anchor="mm"
          )

          draw.text(
              (600, 450),
              "NOVEMBER 19, 2026",
              fill="#ff6fae",
              font=font_medium,
              anchor="mm"
          )

          draw.text(
              (600, 530),
              "CAL FAMILY • GTA VI COMMUNITY",
              fill="#aaaaaa",
              font=font_small,
              anchor="mm"
          )

          img.save("gta6-countdown.png")

          print(f"Countdown: {days} days, {hours} hours, {minutes} minutes, {seconds} seconds")
          PY

      - name: Send countdown to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK" \
            -F "file1=@gta6-countdown.png" \
            -F 'payload_json={"content":"🎮 **GTA VI COUNTDOWN**\n\n🔥 CAL FAMILY"}'
