name: GTA VI News - Cal Bot V10

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Cal Bot V10
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'

          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse


          # ============================================================
          # CONFIGURACION
          # ============================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 500

          MAX_AGE_HOURS = 72

          GEMINI_MODELS = [
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite"
          ]

          RSS_URLS = [
              (
                  "https://news.google.com/rss/"
                  "?q=GTA+VI"
                  "&hl=en-US"
                  "&gl=US"
                  "&ceid=US:en"
              ),
              (
                  "https://news.google.com/rss/"
                  "?q=%22GTA+6%22"
                  "&hl=en-US"
                  "&gl=US"
                  "&ceid=US:en"
              ),
              (
                  "https://news.google.com/rss/"
                  "?q=%22Grand+Theft+Auto+VI%22"
                  "&hl=en-US"
                  "&gl=US"
                  "&ceid=US:en"
              )
          ]


          # ============================================================
          # VALIDACION
          # ============================================================

          if not WEBHOOK:
              print("ERROR: NEWS_DRAFT_WEBHOOK no esta configurado.")
              raise SystemExit(1)

          if not GEMINI_KEY:
              print("ERROR: GEMINI_API_KEY no esta configurado.")
              raise SystemExit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize(text):
              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(r"[^a-z0-9áéíóúüñ ]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def similarity(a, b):
              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0

              return SequenceMatcher(None, a, b).ratio()


          def canonical_url(url):
              if not url:
                  return ""

              try:
                  parsed = urlparse(url)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc"
                  }

                  clean = {
                      key: value
                      for key, value in query.items()
                      if key not in ignored
                  }

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      urlencode(clean, doseq=True),
                      ""
                  ))

              except Exception:
                  return url


          def make_id(title, url):
              value = normalize(title) + "|" + canonical_url(url)

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          def clean_html(text):
              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          def load_history():
              if not os.path.exists(HISTORY_FILE):
                  return {
                      "published": [],
                      "titles": [],
                      "content_hashes": [],
                      "urls": []
                  }

              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as file:
                      data = json.load(file)

                  if isinstance(data, list):
                      return {
                          "published": data,
                          "titles": [],
                          "content_hashes": [],
                          "urls": []
                      }

                  data.setdefault("published", [])
                  data.setdefault("titles", [])
                  data.setdefault("content_hashes", [])
                  data.setdefault("urls", [])

                  return data

              except Exception:
                  return {
                      "published": [],
                      "titles": [],
                      "content_hashes": [],
                      "urls": []
                  }


          def save_history(history):
              history["published"] = (
                  history["published"][-MAX_HISTORY:]
              )

              history["titles"] = (
                  history["titles"][-MAX_HISTORY:]
              )

              history["content_hashes"] = (
                  history["content_hashes"][-MAX_HISTORY:]
              )

              history["urls"] = (
                  history["urls"][-MAX_HISTORY:]
              )

              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      history,
                      file,
                      indent=2,
                      ensure_ascii=False
                  )


          # ============================================================
          # HISTORIAL
          # ============================================================

          history = load_history()


          print("=" * 58)
          print("CAL BOT V10")
          print("EDITOR DE NOTICIAS DE CAL FAMILY")
          print("=" * 58)
          print("Buscando noticias nuevas...")


          # ============================================================
          # RSS
          # ============================================================

          entries = []

          for rss_url in RSS_URLS:

              try:

                  feed = feedparser.parse(
                      rss_url
                  )

                  for entry in feed.entries:
                      entries.append(entry)

              except Exception as error:

                  print(
                      "Error leyendo RSS:",
                      error
                  )


          if not entries:

              print("No se encontraron noticias.")
              raise SystemExit(0)


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def entry_timestamp(entry):

              parsed = getattr(
                  entry,
                  "published_parsed",
                  None
              )

              if not parsed:
                  return 0

              try:
                  return calendar.timegm(parsed)
              except Exception:
                  return 0


          entries.sort(
              key=entry_timestamp,
              reverse=True
          )


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          candidate = None

          now = datetime.now(
              timezone.utc
          )


          for entry in entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_url:
                  continue


              # --------------------------------------------------------
              # FECHA
              # --------------------------------------------------------

              published_time = None

              parsed = getattr(
                  entry,
                  "published_parsed",
                  None
              )

              if parsed:

                  try:

                      timestamp = calendar.timegm(
                          parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:
                      published_time = None


              if published_time:

                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_AGE_HOURS
                  ):
                      print(
                          "Ignorada: noticia antigua."
                      )
                      continue


              # --------------------------------------------------------
              # URL
              # --------------------------------------------------------

              clean_url = canonical_url(
                  google_url
              )

              news_id = make_id(
                  title,
                  clean_url
              )


              if news_id in history["published"]:
                  print(
                      "Ignorada: URL ya procesada."
                  )
                  continue


              if clean_url in history["urls"]:
                  print(
                      "Ignorada: URL ya publicada."
                  )
                  continue


              # --------------------------------------------------------
              # TITULO
              # --------------------------------------------------------

              duplicate = False

              for old_title in history["titles"]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.90:

                      duplicate = True
                      break


              if duplicate:

                  print(
                      "Ignorada: título demasiado parecido."
                  )

                  continue


              # --------------------------------------------------------
              # RSS CONTENT
              # --------------------------------------------------------

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              rss_text = (
                  summary
                  + "\n"
                  + description
              ).strip()


              candidate = {
                  "id": news_id,
                  "title": title,
                  "google_url": google_url,
                  "clean_url": clean_url,
                  "rss_text": rss_text
              }

              break


          if candidate is None:

              print("=" * 58)
              print("NO HAY NOTICIAS NUEVAS.")
              print("=" * 58)

              raise SystemExit(0)


          title = candidate["title"]
          google_url = candidate["google_url"]
          rss_text = candidate["rss_text"]
          news_id = candidate["id"]


          print("=" * 58)
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("=" * 58)


          # ============================================================
          # OBTENER ARTICULO
          # ============================================================

          article_text = ""

          final_source_url = google_url

          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
          }


          try:

              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )

              print(
                  "Estado de página:",
                  page.status_code
              )

              final_source_url = page.url

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer"
                      ]
                  ):
                      element.decompose()


                  paragraphs = []

                  for paragraph in soup.find_all("p"):

                      text = paragraph.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 40:
                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )

                  article_text = article_text[:18000]


          except Exception as error:

              print(
                  "No se pudo extraer el artículo."
              )

              print(error)


          # ============================================================
          # IMPORTANTE:
          # NUNCA DESCARTAR SOLO POR NO EXTRAER LA PAGINA
          # ============================================================

          source_parts = []

          if article_text:
              source_parts.append(
                  "CONTENIDO DEL ARTICULO:\n"
                  + article_text
              )

          if rss_text:
              source_parts.append(
                  "RESUMEN RSS:\n"
                  + rss_text
              )

          source_parts.append(
              "TITULO:\n"
              + title
          )


          source_content = "\n\n".join(
              source_parts
          )


          # ============================================================
          # HASH
          # ============================================================

          content_hash = hashlib.sha256(
              normalize(
                  source_content
              ).encode("utf-8")
          ).hexdigest()


          if content_hash in history["content_hashes"]:

              print(
                  "Descartada: contenido idéntico."
              )

              raise SystemExit(0)


          # ============================================================
          # HISTORIAL PARA GEMINI
          # ============================================================

          recent_titles = history["titles"][-60:]

          previous_news = "\n".join(
              "- " + item
              for item in recent_titles
          )


          # ============================================================
          # PROMPT EDITORIAL
          # ============================================================

          prompt = f"""
          Eres CAL BOT, el editor de noticias de CAL FAMILY,
          una comunidad dedicada exclusivamente a Grand Theft Auto VI.

          Tu objetivo NO es publicar muchas noticias.

          Tu objetivo es encontrar noticias que realmente aporten
          información nueva, relevante y verificable.

          ============================================================
          REGLA EDITORIAL PRINCIPAL
          ============================================================

          Una noticia solo debe PUBLICARSE si aporta algo nuevo.

          DESCARTA si:

          - Es una repetición.
          - Es el mismo anuncio contado por otro medio.
          - Es una nueva publicación sobre el mismo tráiler.
          - Es una reacción de un periodista sin información nueva.
          - Es una opinión sin datos nuevos.
          - Es especulación reciclada.
          - Es un rumor viejo.
          - Solo cambia el titular.
          - Solo repite información que ya aparece en el historial.
          - No contiene información concreta.
          - El artículo no permite verificar la afirmación.

          PERO:

          NO descartes una noticia simplemente porque no pudiste
          acceder al artículo completo.

          Puedes utilizar:

          1. Título.
          2. Resumen RSS.
          3. Descripción RSS.
          4. Texto parcial del artículo.

          Si el título y el RSS contienen una información concreta
          que parece nueva, evalúala cuidadosamente.

          ============================================================
          HISTORIAL
          ============================================================

          {previous_news}

          ============================================================
          NUEVO CANDIDATO
          ============================================================

          TÍTULO:
          {title}

          URL:
          {final_source_url}

          INFORMACIÓN DISPONIBLE:

          {source_content}

          ============================================================
          TIPOS DE INFORMACIÓN
          ============================================================

          Distingue entre:

          HECHO
          DECLARACIÓN
          OPINIÓN
          ANÁLISIS
          RUMOR
          ESPECULACIÓN

          Nunca presentes una opinión como hecho.

          Nunca presentes un rumor como confirmado.

          Nunca inventes información.

          ============================================================
          CUANDO SI PUBLICAR
          ============================================================

          Publica cuando exista algo como:

          - Nueva declaración verificable.
          - Nueva entrevista.
          - Nuevo detalle del desarrollo.
          - Nueva información oficial.
          - Nuevo anuncio.
          - Nueva información sobre personajes.
          - Nueva información sobre gameplay.
          - Nueva información sobre el mundo.
          - Nueva información técnica.
          - Nueva información empresarial relevante.
          - Nueva cobertura que contenga datos concretos que no
            estén en el historial.

          ============================================================
          CUANDO DESCARTAR
          ============================================================

          Ejemplo:

          Si ya se publicó:

          "GTA VI Extended Look llega a Netflix"

          y aparece:

          "Netflix añade el GTA VI Extended Look"

          DESCARTA.

          Si ya se publicó una noticia sobre el Extended Look y
          otro medio simplemente reacciona diciendo que quedó
          impresionado:

          DESCARTA.

          Pero si otro medio publica una entrevista donde un
          desarrollador revela un detalle nuevo del juego:

          PUBLICA.

          ============================================================
          FORMATO
          ============================================================

          Devuelve ÚNICAMENTE JSON válido:

          {{
            "decision": "PUBLICAR" o "DESCARTAR",
            "reason": "motivo breve",
            "category": "Noticias" o "Análisis",
            "title": "título en español",
            "content": "texto final"
          }}

          ============================================================
          SI DESCARTAS
          ============================================================

          Usa:

          "content": ""

          ============================================================
          SI PUBLICAS
          ============================================================

          El texto debe ser:

          - Español natural.
          - Profesional.
          - Directo.
          - Interesante.
          - Sin exageraciones.
          - Sin inventar.
          - Entre 450 y 1000 caracteres aproximadamente.
          - Listo para Discord.

          Formato:

          Introducción breve.

          **El dato clave**

          Información concreta.

          **Por qué importa**

          Explicación breve.

          ⚠️ **Contexto**

          Aclara si la información no es oficial,
          si procede de una fuente secundaria,
          o si corresponde a análisis/opinión.

          NO incluyas enlaces.

          NO escribas comentarios sobre IA.

          NO escribas texto fuera del JSON.
          """


          # ============================================================
          # GEMINI
          # ============================================================

          print("=" * 58)
          print("CAL BOT ESTÁ EVALUANDO...")
          print("=" * 58)


          gemini_response = None


          for model in GEMINI_MODELS:

              print(
                  "Intentando:",
                  model
              )


              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model
                  + ":generateContent"
                  "?key="
                  + GEMINI_KEY
              )


              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "maxOutputTokens": 2200,
                      "responseMimeType": "application/json"
                  }
              }


              for attempt in range(3):

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=120
                      )


                      print(
                          "Gemini HTTP:",
                          response.status_code
                      )


                      if response.status_code == 200:

                          gemini_response = response.json()
                          break


                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          wait = 5 * (
                              attempt + 1
                          )

                          print(
                              "Reintentando en",
                              wait,
                              "segundos..."
                          )

                          time.sleep(wait)
                          continue


                      print(
                          response.text[:2000]
                      )

                      break


                  except Exception as error:

                      print(
                          "Error Gemini:",
                          error
                      )

                      time.sleep(
                          5 * (attempt + 1)
                      )


              if gemini_response is not None:
                  break


          if gemini_response is None:

              print("=" * 58)
              print("GEMINI NO RESPONDIÓ.")
              print("NO SE PUBLICARÁ NI GUARDARÁ LA NOTICIA.")
              print("=" * 58)

              raise SystemExit(1)


          # ============================================================
          # EXTRAER JSON
          # ============================================================

          try:

              candidates = gemini_response.get(
                  "candidates",
                  []
              )

              if not candidates:
                  raise ValueError(
                      "Gemini no devolvió candidates."
                  )


              parts = candidates[0].get(
                  "content",
                  {}
              ).get(
                  "parts",
                  []
              )


              if not parts:
                  raise ValueError(
                      "Gemini no devolvió parts."
                  )


              ai_text = parts[0].get(
                  "text",
                  ""
              ).strip()


              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              )


              result = json.loads(
                  ai_text
              )


          except Exception as error:

              print(
                  "ERROR INTERPRETANDO GEMINI:"
              )

              print(error)

              print(
                  json.dumps(
                      gemini_response,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)


          # ============================================================
          # DECISION
          # ============================================================

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()


          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()


          if decision != "PUBLICAR":

              print("=" * 58)
              print("DESCARTADA POR CAL BOT")
              print("=" * 58)
              print(reason)

              raise SystemExit(0)


          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()


          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()


          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()


          if category not in (
              "Noticias",
              "Análisis"
          ):
              category = "Noticias"


          if not ai_title or not ai_content:

              print(
                  "DESCARTADA: contenido vacío."
              )

              raise SystemExit(0)


          # ============================================================
          # SEGURIDAD FINAL CONTRA DUPLICADOS
          # ============================================================

          for old_title in history["titles"]:

              if similarity(
                  ai_title,
                  old_title
              ) >= 0.92:

                  print(
                      "DESCARTADA: título duplicado."
                  )

                  raise SystemExit(0)


          # ============================================================
          # LIMPIAR ENLACES DEL TEXTO GENERADO
          # ============================================================

          ai_content = re.sub(
              r"https?://\S+",
              "",
              ai_content
          ).strip()


          # ============================================================
          # MENSAJE DISCORD
          # ============================================================

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          final_message = (
              "<@&"
              + ROLE_ID
              + ">\n\n"
              + "🧭 **"
              + category
              + "**\n\n"
              + "# "
              + ai_title
              + "\n\n"
              + ai_content
              + "\n\n"
              + "🔗 **Fuente original:** "
              + final_source_url
              + "\n\n"
              + "⚠️ **REVISIÓN REQUERIDA**\n"
              + "Este contenido fue preparado por Cal Bot "
              + "como borrador editorial. Revisa la "
              + "información antes de publicarlo en #noticias.\n\n"
              + "-# Cal Bot V10 · "
              + date_text
          )


          # ============================================================
          # LIMITE DISCORD
          # ============================================================

          if len(final_message) > 1950:

              print(
                  "Mensaje demasiado largo. "
                  "Reduciendo contenido."
              )

              excess = len(final_message) - 1950

              new_length = max(
                  400,
                  len(ai_content) - excess - 20
              )

              ai_content = ai_content[
                  :new_length
              ].rstrip()


              final_message = (
                  "<@&"
                  + ROLE_ID
                  + ">\n\n"
                  + "🧭 **"
                  + category
                  + "**\n\n"
                  + "# "
                  + ai_title
                  + "\n\n"
                  + ai_content
                  + "\n\n"
                  + "🔗 **Fuente original:** "
                  + final_source_url
                  + "\n\n"
                  + "⚠️ **REVISIÓN REQUERIDA**\n"
                  + "Este contenido fue preparado por Cal Bot "
                  + "como borrador editorial. Revisa la "
                  + "información antes de publicarlo en #noticias.\n\n"
                  + "-# Cal Bot V10 · "
                  + date_text
              )


          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          print("=" * 58)
          print("ENVIANDO A DISCORD...")
          print("=" * 58)


          discord_payload = {
              "content": final_message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }
          }


          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )


          print(
              "Discord HTTP:",
              discord_response.status_code
          )


          if not discord_response.ok:

              print(
                  "ERROR DE DISCORD:"
              )

              print(
                  discord_response.text
              )

              print(
                  "NO SE GUARDARÁ LA NOTICIA."
              )

              raise SystemExit(1)


          # ============================================================
          # SOLO AHORA GUARDAMOS HISTORIAL
          # ============================================================

          print("=" * 58)
