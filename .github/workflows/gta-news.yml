name: GTA VI News - Cal Bot V7.2

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT V7.2
      # ============================================================

      - name: Cal Bot V7.2 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import time
          import calendar

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import (
              urlparse,
              parse_qs,
              urlencode,
              urlunparse
          )


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          GEMINI_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          MAX_HISTORY = 500

          MAX_NEWS_AGE_HOURS = 72

          TITLE_DUPLICATE_THRESHOLD = 0.90

          CONTENT_DUPLICATE_THRESHOLD = 0.92


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:

              print(
                  "ERROR: NEWS_DRAFT_WEBHOOK no está configurado."
              )

              raise SystemExit(1)


          if not GEMINI_KEY:

              print(
                  "ERROR: GEMINI_API_KEY no está configurado."
              )

              raise SystemExit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_text(text):

              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():

                  text = text.replace(
                      old,
                      new
                  )

              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ ]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def similarity(a, b):

              a = normalize_text(a)
              b = normalize_text(b)

              if not a or not b:
                  return 0

              return SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()


          def canonical_url(url):

              if not url:
                  return ""

              try:

                  parsed = urlparse(url)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc",
                      "fbclid",
                      "gclid"
                  }

                  clean_query = {
                      key: value
                      for key, value in query.items()
                      if key not in ignored
                  }

                  new_query = urlencode(
                      clean_query,
                      doseq=True
                  )

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      new_query,
                      ""
                  ))

              except Exception:

                  return url


          def make_hash(text):

              return hashlib.sha256(
                  normalize_text(text)
                  .encode("utf-8")
              ).hexdigest()


          def clean_html(text):

              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          def extract_json(text):

              if not text:
                  return None

              text = text.strip()

              text = re.sub(
                  r"^```json\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              try:

                  return json.loads(text)

              except Exception:

                  start = text.find("{")
                  end = text.rfind("}")

                  if start >= 0 and end > start:

                      try:

                          return json.loads(
                              text[start:end + 1]
                          )

                      except Exception:

                          return None

              return None


          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  print(
                      "Historial inválido. Creando uno nuevo."
                  )

                  history = {}

          else:

              history = {}


          if isinstance(history, list):

              history = {
                  "published": history,
                  "titles": [],
                  "urls": [],
                  "content_hashes": [],
                  "summaries": []
              }


          history.setdefault(
              "published",
              []
          )

          history.setdefault(
              "titles",
              []
          )

          history.setdefault(
              "urls",
              []
          )

          history.setdefault(
              "content_hashes",
              []
          )

          history.setdefault(
              "summaries",
              []
          )


          # ============================================================
          # INICIO
          # ============================================================

          print("========================================")
          print("CAL BOT V7.2")
          print("EDITOR DE NOTICIAS DE CAL FAMILY")
          print("BUSCANDO NOTICIAS...")
          print("========================================")


          # ============================================================
          # RSS
          # ============================================================

          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print(
                  "No se encontraron noticias."
              )

              raise SystemExit(0)


          now = datetime.now(
              timezone.utc
          )


          candidate = None


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not google_url:

                  continue


              # --------------------------------------------------------
              # FECHA
              # --------------------------------------------------------

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):

                  try:

                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:

                      published_time = None


              if published_time:

                  age = now - published_time


                  if age > timedelta(
                      hours=MAX_NEWS_AGE_HOURS
                  ):

                      print(
                          "Ignorada: noticia demasiado antigua."
                      )

                      continue


              # --------------------------------------------------------
              # URL
              # --------------------------------------------------------

              normalized_url = canonical_url(
                  google_url
              )


              # --------------------------------------------------------
              # URL EXACTA
              # --------------------------------------------------------

              if normalized_url in history["urls"]:

                  print(
                      "Ignorada: URL ya procesada."
                  )

                  continue


              # --------------------------------------------------------
              # TÍTULO
              # --------------------------------------------------------

              duplicate = False


              for old_title in history["titles"]:

                  score = similarity(
                      title,
                      old_title
                  )


                  if score >= TITLE_DUPLICATE_THRESHOLD:

                      print(
                          "Ignorada: título demasiado parecido."
                      )

                      duplicate = True

                      break


              if duplicate:

                  continue


              # --------------------------------------------------------
              # RSS CONTENT
              # --------------------------------------------------------

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              rss_content = (
                  summary
                  + "\n"
                  + description
              ).strip()


              # --------------------------------------------------------
              # CANDIDATO
              # --------------------------------------------------------

              candidate = {
                  "title": title,
                  "google_url": google_url,
                  "normalized_url": normalized_url,
                  "rss_content": rss_content
              }

              break


          if candidate is None:

              print("========================================")
              print("NO HAY NOTICIAS NUEVAS.")
              print("========================================")

              raise SystemExit(0)


          title = candidate["title"]

          google_url = candidate["google_url"]

          normalized_url = candidate["normalized_url"]

          rss_content = candidate["rss_content"]


          print("========================================")
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("========================================")


          # ============================================================
          # OBTENER ARTÍCULO REAL
          # ============================================================

          article_text = ""

          final_source_url = google_url


          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
          }


          try:

              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )


              print(
                  "Estado de página:",
                  page.status_code
              )


              final_source_url = page.url


              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )


                  for element in soup(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer",
                          "header",
                          "form"
                      ]
                  ):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )


                      if len(text) >= 50:

                          paragraphs.append(
                              text
                          )


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:16000]


          except Exception as error:

              print(
                  "No se pudo obtener el artículo:"
              )

              print(error)


          # ============================================================
          # CONTENIDO FINAL
          # ============================================================

          if len(article_text) >= 300:

              source_content = article_text

          elif len(rss_content) >= 100:

              source_content = rss_content

          else:

              print("========================================")
              print("DESCARTADA")
              print("No existe suficiente información.")
              print("========================================")

              raise SystemExit(0)


          # ============================================================
          # HASH
          # ============================================================

          content_hash = make_hash(
              source_content
          )


          if content_hash in history["content_hashes"]:

              print(
                  "DESCARTADA: contenido idéntico."
              )

              raise SystemExit(0)


          # ============================================================
          # HISTORIAL PARA GEMINI
          # ============================================================

          recent_titles = history["titles"][-50:]

          recent_summaries = history["summaries"][-30:]


          history_text = "\n".join(
              f"- {x}"
              for x in recent_titles
          )


          summary_history_text = "\n".join(
              f"- {x}"
              for x in recent_summaries
          )


          # ============================================================
          # PROMPT EDITORIAL
          # ============================================================

          prompt = f"""

Eres CAL BOT V7.2, el editor de noticias de CAL FAMILY,
una comunidad dedicada exclusivamente a Grand Theft Auto VI.

Tu trabajo es comportarte como un EDITOR HUMANO.

No debes publicar noticias simplemente porque aparezcan en Google News.

Debes decidir si la información realmente merece ocupar espacio
en el canal de noticias de CAL FAMILY.

============================================================
OBJETIVO
============================================================

Encontrar información NUEVA, CONCRETA y RELEVANTE.

Una noticia puede publicarse aunque NO sea un anuncio oficial
de Rockstar Games.

Por ejemplo, puede ser:

- Una declaración de un desarrollador.
- Una entrevista.
- Una nueva información publicada por un medio fiable.
- Una presentación.
- Una confirmación de una plataforma.
- Información sobre lanzamiento.
- Información sobre personajes.
- Información sobre gameplay.
- Información sobre tecnología.
- Información sobre rendimiento.
- Información sobre producción.
- Información empresarial relacionada directamente con GTA VI.
- Una reacción de un medio SOLO si aporta información concreta nueva.

============================================================
NO PUBLICAR
============================================================

DESCARTA si:

- Es el mismo anuncio publicado nuevamente.
- Es una copia de otra noticia.
- Es un artículo reciclado.
- Solo cambia el medio.
- Solo resume un tráiler que ya cubrimos.
- Solo vuelve a hablar del Extended Look sin información nueva.
- Solo dice que alguien quedó impresionado.
- Es una opinión sin datos nuevos.
- Es especulación sin fundamento.
- Es un rumor antiguo reciclado.
- El artículo no aporta información concreta.
- El título promete información que el contenido no demuestra.
- El contenido es demasiado corto para verificarlo.
- La información nueva es insignificante.

IMPORTANTE:

NO descartes automáticamente una noticia porque:

- No venga de Rockstar.
- No sea oficial.
- Sea una declaración de un desarrollador.
- Sea información de un medio especializado.

En esos casos debes indicar claramente la naturaleza de la información.

============================================================
DUPLICADOS TEMÁTICOS
============================================================

Compara la noticia con el historial.

Si varias publicaciones hablan del mismo acontecimiento,
no publiques otra versión a menos que el nuevo artículo aporte
un DATO MATERIALMENTE NUEVO.

Ejemplo:

Noticia anterior:
"Rockstar publica Extended Look de GTA VI."

Nuevo artículo:
"IGN reacciona al Extended Look."

DESCARTAR.

Pero:

Noticia anterior:
"Rockstar publica Extended Look."

Nuevo artículo:
"Un desarrollador explica una nueva característica mostrada
en el Extended Look."

PUBLICAR.

============================================================
TIPOS DE INFORMACIÓN
============================================================

Clasifica correctamente:

HECHO:
Información presentada como confirmada.

DECLARACIÓN:
Algo dicho por una persona identificable.

REPORTE:
Información publicada por un medio.

ANÁLISIS:
Interpretación del medio.

RUMOR:
Información no confirmada.

ESPECULACIÓN:
Posibilidad o teoría.

Nunca conviertas un rumor, análisis o especulación en un hecho.

============================================================
REGLA CONTRA INVENCIONES
============================================================

NO INVENTES:

- cifras
- fechas
- declaraciones
- personajes
- mecánicas
- mapas
- vehículos
- precios
- duración
- requisitos
- ventas
- características
- información de Rockstar
- información de Take-Two

Solo utiliza información presente en el material.

============================================================
HISTORIAL DE TÍTULOS
============================================================

{history_text}

============================================================
RESÚMENES PREVIOS
============================================================

{summary_history_text}

============================================================
NUEVA INFORMACIÓN
============================================================

TÍTULO:
{title}

FUENTE:
{final_source_url}

CONTENIDO:
{source_content}

============================================================
DECISIÓN
============================================================

Devuelve solamente JSON válido.

Formato exacto:

{{
  "decision": "PUBLICAR",
  "reason": "explicación breve",
  "category": "Noticias",
  "title": "Título en español",
  "content": "Texto final",
  "summary": "Resumen factual de una frase"
}}

O:

{{
  "decision": "DESCARTAR",
  "reason": "explicación breve",
  "category": "Noticias",
  "title": "",
  "content": "",
  "summary": ""
}}

============================================================
SI PUBLICAS
============================================================

El texto debe estar listo para Discord.

Entre 450 y 1000 caracteres.

Debe tener:

Introducción breve.

**El dato clave**

Información concreta.

**Por qué importa**

Relevancia para la comunidad.

⚠️ **Contexto**

Aclara si es declaración, reporte, rumor, análisis
o información no oficial.

No añadas el enlace.

No menciones que eres una IA.

No inventes contexto.

No repitas el mismo dato tres veces.

============================================================
ESTILO CAL FAMILY
============================================================

Español natural.

Profesional.

Directo.

Interesante.

Sin clickbait exagerado.

Sin lenguaje robótico.

Como una página especializada en GTA VI.

CAL BOT debe priorizar CALIDAD sobre CANTIDAD.

Si no estás seguro:

DESCARTA.

"""


          # ============================================================
          # GEMINI
          # ============================================================

          print("========================================")
          print("CAL BOT ESTÁ EVALUANDO LA NOTICIA...")
          print("========================================")


          gemini_result = None


          for model in GEMINI_MODELS:

              print(
                  "Modelo:",
                  model
              )


              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{model}:generateContent"
                  f"?key={GEMINI_KEY}"
              )


              payload = {

                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],

                  "generationConfig": {

                      "temperature": 0.1,

                      "maxOutputTokens": 1800,

                      "responseMimeType":
                          "application/json"
                  }
              }


              for attempt in range(3):

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=90
                      )


                      print(
                          "Gemini HTTP:",
                          response.status_code
                      )


                      if response.status_code == 200:

                          gemini_result = response.json()

                          break


                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          wait_time = 5 * (
                              attempt + 1
                          )

                          print(
                              f"Gemini temporalmente ocupado. "
                              f"Reintentando en {wait_time}s..."
                          )

                          time.sleep(
                              wait_time
                          )

                          continue


                      print(
                          response.text[:3000]
                      )

                      break


                  except Exception as error:

                      print(
                          "Error de conexión Gemini:",
                          error
                      )

                      time.sleep(
                          5 * (attempt + 1)
                      )


              if gemini_result is not None:

                  break


          # ============================================================
          # GEMINI FALLÓ
          # ============================================================

          if gemini_result is None:

              print("========================================")
              print("ERROR DE GEMINI")
              print("La noticia NO será publicada.")
              print("La noticia NO será guardada.")
              print("========================================")

              raise SystemExit(1)


          # ============================================================
          # EXTRAER RESPUESTA GEMINI
          # ============================================================

          try:

              candidates = gemini_result.get(
                  "candidates",
                  []
              )


              if not candidates:

                  raise ValueError(
                      "Gemini no devolvió candidates."
                  )


              parts = candidates[0] \
                  .get(
                      "content",
                      {}
                  ) \
                  .get(
                      "parts",
                      []
                  )


              if not parts:

                  raise ValueError(
                      "Gemini no devolvió parts."
                  )


              ai_text = parts[0] \
                  .get(
                      "text",
                      ""
                  ) \
                  .strip()


              result = extract_json(
                  ai_text
              )


              if not isinstance(
                  result,
                  dict
              ):

                  raise ValueError(
                      "JSON inválido."
                  )


          except Exception as error:

              print("========================================")
              print("ERROR INTERPRETANDO GEMINI")
              print("========================================")
              print(error)

              print(
                  json.dumps(
                      gemini_result,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)


          # ============================================================
          # DECISIÓN
          # ============================================================

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()


          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()


          print("========================================")
          print("DECISIÓN DE CAL BOT:")
          print(decision)
          print("========================================")


          if decision != "PUBLICAR":

              print(
                  "NOTICIA DESCARTADA:"
              )

              print(
                  reason
              )

              raise SystemExit(0)


          # ============================================================
          # DATOS PUBLICABLES
          # ============================================================

          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()


          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()


          ai_summary = str(
              result.get(
                  "summary",
                  ""
              )
          ).strip()


          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()


          if category not in (
              "Noticias",
              "Análisis"
          ):

              category = "Noticias"


          if not ai_title:

              print(
                  "DESCARTADA: falta título."
              )

              raise SystemExit(0)


          if not ai_content:

              print(
                  "DESCARTADA: falta contenido."
              )

              raise SystemExit(0)


          if not ai_summary:

              ai_summary = ai_title


          # ============================================================
          # SEGURIDAD FINAL CONTRA DUPLICADOS
          # ============================================================

          for old_title in history["titles"]:

              score = similarity(
                  ai_title,
                  old_title
              )


              if score >= 0.90:

                  print("========================================")
                  print("DESCARTADA")
                  print(
                      "El título final es demasiado parecido "
                      "a una publicación anterior."
                  )
                  print("========================================")

                  raise SystemExit(0)


          # ============================================================
          # LIMPIAR CONTENIDO
          # ============================================================

          ai_content = ai_content.replace(
              "🔗 **Fuente original:**",
              ""
          )

          ai_content = ai_content.replace(
              "🔗 **Fuente:**",
              ""
          )


          # ============================================================
          # FECHA
          # ============================================================

          date_text = datetime.now(
              timezone.utc
          ).strftime(
              "%d/%m/%Y"
          )


          # ============================================================
          # MENSAJE DISCORD
          # ============================================================

          final_message = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {ai_title}\n\n"
              f"{ai_content}\n\n"
              f"🔗 **Fuente original:** "
              f"{final_source_url}\n\n"
              f"⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por Cal Bot "
              f"como borrador editorial. "
              f"Revisa la información antes de publicarlo "
              f"en #noticias.\n\n"
              f"-# Cal Bot V7.2 · {date_text}"
          )


          # ============================================================
          # CONTROL DE LONGITUD
          # ============================================================

          if len(final_message) > 1950:

              print(
                  "Mensaje superior a 1950 caracteres."
              )

              overhead = len(
                  final_message
              ) - len(
                  ai_content
              )

              max_content = 1950 - overhead

              if max_content < 300:

                  print(
                      "No es posible crear un mensaje seguro."
                  )

                  raise SystemExit(0)


              ai_content = ai_content[
                  :max_content
              ].rstrip()


              final_message = (
                  f"<@&{ROLE_ID}>\n\n"
                  f"🧭 **{category}**\n\n"
                  f"# {ai_title}\n\n"
                  f"{ai_content}\n\n"
                  f"🔗 **Fuente original:** "
                  f"{final_source_url}\n\n"
                  f"⚠️ **REVISIÓN REQUERIDA**\n"
                  f"Este contenido fue preparado por "
                  f"Cal Bot como borrador editorial. "
                  f"Revisa la información antes de "
                  f"publicarlo en #noticias.\n\n"
                  f"-# Cal Bot V7.2 · {date_text}"
              )


          if len(final_message) > 2000:

              print(
                  "ERROR: mensaje de Discord supera 2000 caracteres."
              )

              raise SystemExit(1)


          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          print("========================================")
          print("ENVIANDO NOTICIA A DISCORD...")
          print("========================================")


          discord_url = WEBHOOK


          if "?" in discord_url:

              discord_url += "&wait=true"

          else:

              discord_url += "?wait=true"


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }
          }


          try:

              discord_response = requests.post(
                  discord_url,
                  json=discord_payload,
                  headers={
                      "Content-Type":
                          "application/json"
                  },
                  timeout=30
              )


          except Exception as error:

              print("========================================")
              print("ERROR DE CONEXIÓN CON DISCORD")
              print("========================================")
              print(error)

              raise SystemExit(1)


          print(
              "HTTP DISCORD:",
              discord_response.status_code
          )


          print(
              "RESPUESTA DISCORD:",
              discord_response.text[:2000]
          )


          if discord_response.status_code not in (
              200,
              204
          ):

              print("========================================")
              print("ERROR DE DISCORD")
              print("========================================")
              print(
                  discord_response.status_code
              )
              print(
                  discord_response.text
              )
              print(
                  "La noticia NO será guardada."
              )

              raise SystemExit(1)


          # ============================================================
          # CONFIRMACIÓN
          # ============================================================

          print("========================================")
          print("✅ DISCORD CONFIRMÓ EL ENVÍO")
          print("========================================")


          # ============================================================
          # GUARDAR HISTORIAL
          # ============================================================

          history["published"].append(
              normalized_url
          )


          history["titles"].append(
              ai_title
          )


          history["urls"].append(
              normalized_url
          )


          history["content_hashes"].append(
              content_hash
          )


          history["summaries"].append(
              ai_summary
          )


          # ------------------------------------------------------------
          # LIMITAR HISTORIAL
          # ------------------------------------------------------------

          history["published"] = (
              history["published"]
              [-MAX_HISTORY:]
          )


          history["titles"] = (
              history["titles"]
              [-MAX_HISTORY:]
          )


          history["urls"] = (
              history["urls"]
              [-MAX_HISTORY:]
          )


          history["content_hashes"] = (
              history["content_hashes"]
              [-MAX_HISTORY:]
          )


          history["summaries"] = (
              history["summaries"]
              [-MAX_HISTORY:]
          )


          # ============================================================
          # GUARDAR ARCHIVO
          # ============================================================

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print("========================================")
          print("✅ NOTICIA PUBLICADA")
          print("✅ HISTORIAL ACTUALIZADO")
          print("========================================")

          PY


