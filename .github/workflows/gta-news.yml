name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# ============================================================
# SOLO UNA EJECUCIÓN DEL WORKFLOW A LA VEZ
# ============================================================

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  news:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # INSTALAR DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # BUSCAR NOTICIA
      # ============================================================

      - name: Find GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import difflib
          import subprocess

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get(
              "NEWS_DRAFT_WEBHOOK",
              ""
          ).strip()

          GEMINI_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          MODEL = "gemini-3.5-flash-lite"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          LOCK_DIR = ".news_locks"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 500


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:

              print(
                  "ERROR: NEWS_DRAFT_WEBHOOK está vacío."
              )

              exit(1)


          if not GEMINI_KEY:

              print(
                  "ERROR: GEMINI_API_KEY está vacío."
              )

              exit(1)


          # ============================================================
          # CREAR DIRECTORIO DE LOCKS
          # ============================================================

          os.makedirs(
              LOCK_DIR,
              exist_ok=True
          )


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize(text):

              text = text.lower()

              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ\s]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def similarity(a, b):

              a = normalize(a)

              b = normalize(b)

              if not a or not b:

                  return 0.0

              return difflib.SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()


          def content_hash(text):

              normalized = normalize(text)

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()


          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          if not isinstance(history, list):

              history = []


          # ============================================================
          # CONVERTIR HISTORIAL ANTIGUO
          # ============================================================

          converted = []

          for item in history:

              if isinstance(item, str):

                  converted.append({

                      "id": item,

                      "title": "",

                      "content_hash": "",

                      "status": "published"

                  })

              elif isinstance(item, dict):

                  converted.append(item)


          history = converted


          # ============================================================
          # BUSCAR RSS
          # ============================================================

          print("========================================")

          print("CAL BOT")

          print("BUSCANDO NOTICIAS NUEVAS...")

          print("========================================")


          feed = feedparser.parse(
              RSS_URL
          )


          if not feed.entries:

              print(
                  "No se encontraron noticias."
              )

              exit(0)


          # ============================================================
          # BUSCAR UNA SOLA NOTICIA
          # ============================================================

          article = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not link:

                  continue


              news_id = hashlib.sha256(
                  link.encode("utf-8")
              ).hexdigest()


              # --------------------------------------------------------
              # SI YA EXISTE EN HISTORIAL
              # --------------------------------------------------------

              already_seen = any(

                  item.get("id") == news_id

                  for item in history

              )


              if already_seen:

                  print(
                      "Ignorada: ya existe en historial."
                  )

                  continue


              # --------------------------------------------------------
              # LOCK PERMANENTE
              # --------------------------------------------------------

              lock_file = os.path.join(
                  LOCK_DIR,
                  f"{news_id}.lock"
              )


              if os.path.exists(lock_file):

                  print(
                      "Ignorada: noticia bloqueada."
                  )

                  continue


              # --------------------------------------------------------
              # ENCONTRADA
              # --------------------------------------------------------

              article = {

                  "id": news_id,

                  "title": title,

                  "link": link

              }


              break


          # ============================================================
          # NO HAY NOTICIA
          # ============================================================

          if article is None:

              print(
                  "No hay noticias nuevas para publicar."
              )

              exit(0)


          title = article["title"]

          link = article["link"]

          news_id = article["id"]


          print("========================================")

          print("NOTICIA SELECCIONADA")

          print(title)

          print(link)

          print("========================================")


          # ============================================================
          # CREAR LOCK INMEDIATAMENTE
          # ============================================================

          lock_file = os.path.join(
              LOCK_DIR,
              f"{news_id}.lock"
          )


          # Exclusión mediante creación atómica
          try:

              fd = os.open(
                  lock_file,
                  os.O_CREAT |
                  os.O_EXCL |
                  os.O_WRONLY
              )

              with os.fdopen(
                  fd,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump({

                      "id": news_id,

                      "title": title,

                      "link": link,

                      "created_at":
                          datetime.now(
                              timezone.utc
                          ).isoformat()

                  }, f, indent=2)


          except FileExistsError:

              print(
                  "OTRA EJECUCIÓN YA TOMÓ ESTA NOTICIA."
              )

              exit(0)


          print(
              "LOCK CREADO."
          )


          # ============================================================
          # DESCARGAR ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {

                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  )

              }


              page = requests.get(

                  link,

                  headers=headers,

                  timeout=20,

                  allow_redirects=True

              )


              print(
                  f"Estado de la página: "
                  f"{page.status_code}"
              )


              if page.ok:

                  soup = BeautifulSoup(

                      page.text,

                      "html.parser"

                  )


                  for element in soup([

                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header"

                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(

                          " ",

                          strip=True

                      )


                      if len(text) >= 50:

                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo obtener "
                  "el artículo completo."
              )

              print(error)


          # ============================================================
          # COMPROBAR CONTENIDO RECICLADO
          # ============================================================

          current_hash = content_hash(
              article_text
          )


          recycled = False


          for old in history:

              old_title = old.get(
                  "title",
                  ""
              )

              old_hash = old.get(
                  "content_hash",
                  ""
              )


              # --------------------------------------------------------
              # CONTENIDO IDÉNTICO
              # --------------------------------------------------------

              if (

                  current_hash

                  and

                  old_hash

                  and

                  current_hash == old_hash

              ):

                  recycled = True

                  print(
                      "DESCARTADA: contenido idéntico."
                  )

                  break


              # --------------------------------------------------------
              # TÍTULO MUY PARECIDO
              # --------------------------------------------------------

              if old_title:

                  score = similarity(
                      title,
                      old_title
                  )


                  if score >= 0.88:

                      recycled = True

                      print(
                          "DESCARTADA: título "
                          "demasiado parecido."
                      )

                      print(
                          f"Similitud: {score:.2f}"
                      )

                      break


          # ============================================================
          # SI ES RECICLADA
          # ============================================================

          if recycled:

              history.append({

                  "id": news_id,

                  "title": title,

                  "content_hash": current_hash,

                  "status": "duplicate",

                  "date":
                      datetime.now(
                          timezone.utc
                      ).isoformat()

              })


              history = history[-MAX_HISTORY:]


              with open(

                  HISTORY_FILE,

                  "w",

                  encoding="utf-8"

              ) as f:

                  json.dump(

                      history,

                      f,

                      indent=2,

                      ensure_ascii=False

                  )


              print(
                  "Noticia reciclada descartada."
              )

              exit(0)


          # ============================================================
          # CONTENIDO PARA GEMINI
          # ============================================================

          if article_text:

              source = article_text

          else:

              source = (
                  "No fue posible obtener "
                  "el contenido completo."
              )


          # ============================================================
          # PROMPT
          # ============================================================

          prompt = f"""

          Eres el editor de noticias de CAL FAMILY,
          una comunidad dedicada a Grand Theft Auto VI.

          Convierte la información proporcionada
          en un borrador profesional para Discord.

          REGLA ABSOLUTA:

          NO INVENTES INFORMACIÓN.

          Solo puedes utilizar información
          que aparezca en el material proporcionado.

          No inventes:

          - declaraciones de Rockstar
          - fechas
          - cifras
          - personajes
          - características
          - precios
          - duración
          - mapas
          - rumores
          - filtraciones

          Si algo no está confirmado,
          debes indicarlo claramente.

          ============================================================
          CLASIFICACIÓN
          ============================================================

          Usa:

          🧭 **Noticias**

          para información factual.

          Usa:

          🧭 **Análisis**

          para opiniones, interpretaciones
          o análisis de un medio.

          ============================================================
          FORMATO
          ============================================================

          🧭 **Noticias**

          # [Título atractivo en español]

          [Resumen claro.]

          **El dato que lo pone en perspectiva**

          [Dato real de la fuente.]

          **La señal que más dice**

          [Detalle importante.]

          **Por qué importa**

          [Por qué es relevante.]

          Si corresponde:

          ⚠️ **Esto no es un anuncio oficial ni una filtración.**

          [Explicación.]

          ============================================================
          ESTILO
          ============================================================

          Español natural.

          Profesional.

          Claro.

          Atractivo.

          No exageres.

          No repitas información.

          No inventes contexto.

          No utilices demasiados emojis.

          No pongas enlaces.

          No menciones que eres una IA.

          Genera únicamente el texto final.

          ============================================================
          FUENTE
          ============================================================

          TÍTULO:

          {title}

          ENLACE:

          {link}

          CONTENIDO:

          {source}

          """


          # ============================================================
          # GEMINI
          # ============================================================

          print(
              "Enviando noticia a Gemini..."
          )


          gemini_payload = {

              "contents": [

                  {

                      "parts": [

                          {

                              "text": prompt

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "temperature": 0.2,

                  "maxOutputTokens": 1400

              }

          }


          response = requests.post(

              GEMINI_URL,

              params={

                  "key": GEMINI_KEY

              },

              headers={

                  "Content-Type":
                      "application/json"

              },

              json=gemini_payload,

              timeout=90

          )


          if not response.ok:

              print(
                  "ERROR DE GEMINI"
              )

              print(
                  response.status_code
              )

              print(
                  response.text
              )

              # Mantener lock para impedir
              # duplicados accidentales.

              exit(1)


          data = response.json()


          # ============================================================
          # EXTRAER TEXTO
          # ============================================================

          try:

              ai_text = (

                  data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
                  .strip()

              )

          except Exception:

              print(
                  "ERROR: respuesta inválida de Gemini."
              )

              print(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              exit(1)


          if not ai_text:

              print(
                  "Gemini devolvió texto vacío."
              )

              exit(1)


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # MENSAJE DISCORD
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {

                  "roles": [

                      ROLE_ID

                  ]

              }

          }


          print(
              "Enviando a Discord..."
          )


          discord_response = requests.post(

              WEBHOOK,

              json=discord_payload,

              timeout=30

          )


          if not discord_response.ok:

              print(
                  "ERROR DE DISCORD"
              )

              print(
                  discord_response.status_code
              )

              print(
                  discord_response.text
              )

              # NO eliminar el lock.
              # Esto evita que el mismo artículo
              # vuelva a enviarse automáticamente.

              exit(1)


          # ============================================================
          # GUARDAR HISTORIAL
          # ============================================================

          history.append({

              "id": news_id,

              "title": title,

              "content_hash": current_hash,

              "status": "published",

              "date":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(

              HISTORY_FILE,

              "w",

              encoding="utf-8"

          ) as f:

              json.dump(

                  history,

                  f,

                  indent=2,

                  ensure_ascii=False

              )


          print(
              "Historial actualizado."
          )


          print("========================================")

          print(
              "NOTICIA PUBLICADA UNA SOLA VEZ"
          )

          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL Y LOCK
      # ============================================================

      - name: Save news history and locks
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add seen_news.json .news_locks


          if git diff --cached --quiet; then

            echo "No hay cambios que guardar."

          else

            git commit -m "Cal Bot: update GTA VI news history"

            git push

          fi
