name: GTA VI News - Cal Bot V7

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Evita que dos ejecuciones del bot trabajen al mismo tiempo.
concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT
      # ============================================================

      - name: Cal Bot V7 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import time

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          # Modelo principal actual
          GEMINI_MODELS = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash"
          ]

          MAX_HISTORY = 500

          # Solo buscamos noticias recientes.
          MAX_NEWS_AGE_HOURS = 72

          # ============================================================
          # VALIDACIÓN DE SECRETS
          # ============================================================

          if not WEBHOOK:
              print("ERROR: falta NEWS_DRAFT_WEBHOOK.")
              raise SystemExit(1)

          if not GEMINI_KEY:
              print("ERROR: falta GEMINI_API_KEY.")
              raise SystemExit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_text(text):

              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta 6",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", "", text)
              text = re.sub(r"[^a-z0-9áéíóúüñ ]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def similarity(a, b):

              a = normalize_text(a)
              b = normalize_text(b)

              if not a or not b:
                  return 0

              return SequenceMatcher(None, a, b).ratio()


          def canonical_url(url):

              if not url:
                  return ""

              try:

                  parsed = urlparse(url)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  # Eliminamos parámetros de tracking.
                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc"
                  }

                  clean_query = {
                      k: v
                      for k, v in query.items()
                      if k not in ignored
                  }

                  new_query = urlencode(
                      clean_query,
                      doseq=True
                  )

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      new_query,
                      ""
                  ))

              except Exception:
                  return url


          def article_id(title, url):

              value = (
                  normalize_text(title)
                  + "|"
                  + canonical_url(url)
              )

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          def clean_html(text):

              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = []

          else:

              history = []


          # V7 acepta tanto el formato viejo (lista)
          # como el nuevo (diccionario).

          if isinstance(history, list):

              history = {
                  "published": history,
                  "titles": [],
                  "content_hashes": []
              }

          history.setdefault("published", [])
          history.setdefault("titles", [])
          history.setdefault("content_hashes", [])


          print("========================================")
          print("CAL BOT V7")
          print("EDITOR DE NOTICIAS")
          print("BUSCANDO NOTICIAS...")
          print("========================================")


          # ============================================================
          # LEER RSS
          # ============================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:

              print("No se encontraron noticias.")
              raise SystemExit(0)


          # ============================================================
          # BUSCAR CANDIDATOS
          # ============================================================

          candidate = None

          now = datetime.now(timezone.utc)

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_link = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_link:
                  continue


              # --------------------------------------------------------
              # FECHA
              # --------------------------------------------------------

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):

                  try:

                      import calendar

                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:
                      published_time = None


              if published_time:

                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_NEWS_AGE_HOURS
                  ):

                      print(
                          "Ignorada: noticia demasiado antigua."
                      )

                      continue


              # --------------------------------------------------------
              # ID
              # --------------------------------------------------------

              normalized_url = canonical_url(
                  google_link
              )

              news_id = article_id(
                  title,
                  normalized_url
              )


              # --------------------------------------------------------
              # URL YA PUBLICADA
              # --------------------------------------------------------

              if news_id in history["published"]:

                  print(
                      "Ignorada: URL ya procesada."
                  )

                  continue


              # --------------------------------------------------------
              # TÍTULO DUPLICADO
              # --------------------------------------------------------

              duplicate_title = False

              for old_title in history["titles"]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.88:

                      duplicate_title = True
                      break


              if duplicate_title:

                  print(
                      "Ignorada: título prácticamente idéntico."
                  )

                  continue


              # --------------------------------------------------------
              # INFORMACIÓN RSS
              # --------------------------------------------------------

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              rss_content = (
                  summary
                  + "\n"
                  + description
              ).strip()


              # --------------------------------------------------------
              # CANDIDATO
              # --------------------------------------------------------

              candidate = {
                  "id": news_id,
                  "title": title,
                  "google_url": google_link,
                  "canonical_url": normalized_url,
                  "rss_content": rss_content
              }

              break


          if candidate is None:

              print("========================================")
              print("NO HAY NOTICIAS NUEVAS.")
              print("========================================")

              raise SystemExit(0)


          title = candidate["title"]
          google_url = candidate["google_url"]
          rss_content = candidate["rss_content"]
          news_id = candidate["id"]


          print("========================================")
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("========================================")


          # ============================================================
          # OBTENER ARTÍCULO REAL
          # ============================================================

          article_text = ""
          final_source_url = google_url

          headers = {
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/124 Safari/537.36"
          }


          try:

              page = requests.get(
                  google_url,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )

              print(
                  "Estado de página:",
                  page.status_code
              )

              final_source_url = page.url

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer",
                          "header"
                      ]
                  ):

                      element.decompose()


                  paragraphs = []

                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:

                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )

                  article_text = article_text[:16000]


          except Exception as error:

              print(
                  "No se pudo extraer el artículo:"
              )

              print(error)


          # ============================================================
          # FUENTE FINAL
          # ============================================================

          if len(article_text) >= 300:

              source_content = article_text

          elif len(rss_content) >= 100:

              source_content = rss_content

          else:

              print("DESCARTADA.")
              print(
                  "No existe suficiente información verificable."
              )

              raise SystemExit(0)


          # ============================================================
          # HASH DEL CONTENIDO
          # ============================================================

          content_hash = hashlib.sha256(
              normalize_text(
                  source_content
              ).encode("utf-8")
          ).hexdigest()


          if content_hash in history["content_hashes"]:

              print(
                  "DESCARTADA: contenido idéntico."
              )

              raise SystemExit(0)


          # ============================================================
          # COMPARACIÓN BÁSICA CONTRA HISTORIAL
          # ============================================================

          previous_titles = history["titles"][-40:]

          previous_titles_text = "\n".join(
              f"- {x}"
              for x in previous_titles
          )


          # ============================================================
          # PROMPT EDITORIAL
          # ============================================================

          prompt = f"""

Eres CAL BOT, el editor automático de noticias de CAL FAMILY,
una comunidad dedicada a Grand Theft Auto VI.

Tu trabajo NO es llenar Discord con artículos.

Tu trabajo es decidir si existe una noticia REALMENTE NUEVA
que aporte información verificable a la comunidad.

============================================================
REGLA PRINCIPAL
============================================================

PUBLICA SOLO SI EL ARTÍCULO APORTA INFORMACIÓN NUEVA.

Un artículo NO debe publicarse si:

- Es otra versión del mismo anuncio.
- Es una repetición de una noticia ya cubierta.
- Solo cambia el medio que la publica.
- Solo expresa una reacción de un periodista.
- Es una opinión sin información nueva.
- Es especulación reciclada.
- Habla nuevamente del mismo tráiler, extended look o anuncio
  sin aportar datos nuevos.
- No contiene suficiente información verificable.
- El contenido disponible es demasiado limitado.
- El título promete algo que el contenido no confirma.

Si tienes dudas:

DESCARTA.

Es mejor perder una noticia que publicar información reciclada.

============================================================
HISTORIAL RECIENTE
============================================================

{previous_titles_text}

============================================================
NUEVO ARTÍCULO
============================================================

TÍTULO:
{title}

FUENTE:
{final_source_url}

CONTENIDO:
{source_content}

============================================================
VERIFICACIÓN
============================================================

Debes separar:

1. HECHO VERIFICABLE
2. DECLARACIÓN DE UNA FUENTE
3. OPINIÓN
4. ANÁLISIS
5. ESPECULACIÓN
6. RUMOR

Nunca conviertas 3, 4, 5 o 6 en un hecho.

Nunca inventes:

- declaraciones de Rockstar Games
- declaraciones de Take-Two
- fechas
- cifras
- características
- duración
- mapas
- personajes
- precios
- requisitos
- ventas
- información de desarrollo

si no aparecen claramente en el contenido.

============================================================
DECISIÓN
============================================================

Primero decide:

PUBLICAR

o

DESCARTAR

Solo PUBLICAR si existe información nueva y verificable.

============================================================
FORMATO DE RESPUESTA
============================================================

Devuelve exactamente JSON válido:

{{
  "decision": "PUBLICAR" o "DESCARTAR",
  "reason": "explicación corta",
  "category": "Noticias" o "Análisis",
  "title": "título en español",
  "content": "contenido final listo para Discord"
}}

============================================================
SI DESCARTAS
============================================================

El campo content debe ser vacío.

============================================================
SI PUBLICAS
============================================================

El contenido debe:

- Estar en español.
- Ser profesional.
- Ser atractivo.
- Tener entre 500 y 1100 caracteres.
- No ser un ensayo.
- No repetir información innecesariamente.
- No incluir el enlace.
- No mencionar que eres una IA.

Formato:

[Introducción breve]

**El dato clave**

[Dato verificable]

**Por qué importa**

[Importancia real]

⚠️ **Contexto**

[Si no es información oficial, explica exactamente qué es.]

============================================================
MUY IMPORTANTE
============================================================

NO rellenes espacios con información genérica.

Si el artículo solo dice que un medio habló de GTA VI
pero no aporta información concreta nueva:

DESCARTA.

Si el artículo no puede verificarse adecuadamente:

DESCARTA.

Si es una repetición de un anuncio ya conocido:

DESCARTA.

"""


          # ============================================================
          # GEMINI
          # ============================================================

          print("========================================")
          print("CAL BOT ESTÁ EVALUANDO...")
          print("========================================")


          gemini_result = None


          for model in GEMINI_MODELS:

              print(
                  "Intentando modelo:",
                  model
              )


              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{model}:generateContent"
                  f"?key={GEMINI_KEY}"
              )


              payload = {

                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],

                  "generationConfig": {

                      "temperature": 0.1,

                      "maxOutputTokens": 1800,

                      "responseMimeType":
                          "application/json"
                  }
              }


              success = False


              for attempt in range(3):

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=90
                      )


                      if response.status_code == 200:

                          gemini_result = response.json()
                          success = True
                          break


                      print(
                          "Gemini HTTP",
                          response.status_code
                      )


                      # 429 / 500 / 503:
                      # esperamos y reintentamos.

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          wait_time = 5 * (
                              attempt + 1
                          )

                          print(
                              f"Reintentando en {wait_time}s..."
                          )

                          time.sleep(
                              wait_time
                          )

                          continue


                      print(
                          response.text[:2000]
                      )

                      break


                  except Exception as error:

                      print(
                          "Error de conexión:",
                          error
                      )

                      time.sleep(
                          5 * (attempt + 1)
                      )


              if success:

                  break


          if gemini_result is None:

              print("========================================")
              print("ERROR: GEMINI NO RESPONDIÓ.")
              print("La noticia NO será marcada como publicada.")
              print("========================================")

              raise SystemExit(1)


          # ============================================================
          # EXTRAER RESPUESTA
          # ============================================================

          try:

              candidates = gemini_result.get(
                  "candidates",
                  []
              )

              if not candidates:

                  raise ValueError(
                      "Gemini no devolvió candidates."
                  )


              parts = candidates[0] \
                  .get("content", {}) \
                  .get("parts", [])


              if not parts:

                  raise ValueError(
                      "Gemini no devolvió parts."
                  )


              ai_text = parts[0] \
                  .get("text", "") \
                  .strip()


              if not ai_text:

                  raise ValueError(
                      "Gemini devolvió texto vacío."
                  )


              # Elimina posibles fences.
              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              )

              result = json.loads(
                  ai_text
              )


          except Exception as error:

              print(
                  "ERROR INTERPRETANDO GEMINI:"
              )

              print(error)

              print(
                  json.dumps(
                      gemini_result,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)


          # ============================================================
          # DECISIÓN
          # ============================================================

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()


          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()


          if decision != "PUBLICAR":

              print("========================================")
              print("DESCARTADA POR CAL BOT")
              print("========================================")
              print(reason)

              raise SystemExit(0)


          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()


          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()


          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()


          if category not in (
              "Noticias",
              "Análisis"
          ):

              category = "Noticias"


          if not ai_title or not ai_content:

              print(
                  "DESCARTADA: Gemini no generó contenido válido."
              )

              raise SystemExit(0)


          # ============================================================
          # SEGURIDAD CONTRA REPETICIONES
          # ============================================================

          for old_title in history["titles"]:

              if similarity(
                  ai_title,
                  old_title
              ) >= 0.90:

                  print(
                      "DESCARTADA: título demasiado parecido "
                      "a una publicación anterior."
                  )

                  raise SystemExit(0)


          # ============================================================
          # LIMPIEZA
          # ============================================================

          ai_content = ai_content.replace(
              "🔗 **Fuente:**",
              ""
          )

          ai_content = ai_content.replace(
              "🔗 **Fuente original:**",
              ""
          )


          # ============================================================
          # CONSTRUIR MENSAJE
          # ============================================================

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          final_message = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {ai_title}\n\n"
              f"{ai_content}\n\n"
              f"🔗 **Fuente original:** {final_source_url}\n\n"
              f"⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por Cal Bot "
              f"como borrador editorial. "
              f"Revisa la información antes de publicarlo "
              f"en #noticias.\n\n"
              f"-# Cal Bot V7 · {date_text}"
          )


          # Discord permite hasta 2000 caracteres
          # en content.

          if len(final_message) > 1950:

              print(
                  "Mensaje demasiado largo. "
                  "Se reducirá automáticamente."
              )

              allowed_content_length = (
                  1950
                  - len(
                      final_message
                      - ai_content
                  )
              )

              ai_content = ai_content[
                  :max(
                      500,
                      allowed_content_length
                  )
              ]

              final_message = (
                  f"<@&{ROLE_ID}>\n\n"
                  f"🧭 **{category}**\n\n"
                  f"# {ai_title}\n\n"
                  f"{ai_content}\n\n"
                  f"🔗 **Fuente original:** "
                  f"{final_source_url}\n\n"
                  f"⚠️ **REVISIÓN REQUERIDA**\n"
                  f"Este contenido fue preparado por "
                  f"Cal Bot como borrador editorial. "
                  f"Revisa la información antes de "
                  f"publicarlo en #noticias.\n\n"
                  f"-# Cal Bot V7 · {date_text}"
              )


          # ============================================================
          # ENVIAR DISCORD
          # ============================================================

          print("========================================")
          print("ENVIANDO A DISCORD...")
          print("========================================")


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }
          }


          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )


          if not discord_response.ok:

              print(
                  "========================================"
              )

              print(
                  "ERROR DE DISCORD"
              )

              print(
                  discord_response.status_code
              )

              print(
                  discord_response.text
              )

              print(
                  "La noticia NO se guardará como publicada."
              )

              raise SystemExit(1)


          print("========================================")
          print("DISCORD CONFIRMÓ EL MENSAJE.")
          print("========================================")


          # ============================================================
          # GUARDAR HISTORIAL
          # ============================================================

          history["published"].append(
              news_id
          )

          history["titles"].append(
              ai_title
          )

          history["content_hashes"].append(
              content_hash
          )


          history["published"] = (
              history["published"][-MAX_HISTORY:]
          )

          history["titles"] = (
              history["titles"][-MAX_HISTORY:]
          )

          history["content_hashes"] = (
              history["content_hashes"][-MAX_HISTORY:]
          )


          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print("========================================")
          print("NOTICIA PUBLICADA Y GUARDADA.")
          print("========================================")

          PY


      # ============================================================
      # GUARDAR HISTORIAL EN GITHUB
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit \
              -m "Update Cal Bot news history"

            git push

          fi
