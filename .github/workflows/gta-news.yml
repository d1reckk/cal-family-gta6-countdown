name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# ============================================================
# EVITAR DOS EJECUCIONES DEL BOT AL MISMO TIEMPO
# ============================================================

concurrency:
  group: gta-vi-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  news:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # BUSCAR Y PROCESAR NOTICIA
      # ============================================================

      - name: Find and analyze GTA VI news
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import difflib

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()

          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          MODEL = "gemini-3.5-flash-lite"

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          MAX_HISTORY = 500


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:

              print("ERROR: NEWS_DRAFT_WEBHOOK está vacío.")

              exit(1)


          if not GEMINI_KEY:

              print("ERROR: GEMINI_API_KEY está vacío.")

              exit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_text(text):

              text = text.lower()

              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ\s]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def title_similarity(a, b):

              a = normalize_text(a)

              b = normalize_text(b)

              if not a or not b:

                  return 0.0

              return difflib.SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()


          def word_set(text):

              text = normalize_text(text)

              words = text.split()

              # eliminar palabras demasiado pequeñas
              words = [
                  word
                  for word in words
                  if len(word) >= 4
              ]

              return set(words)


          def word_similarity(a, b):

              set_a = word_set(a)

              set_b = word_set(b)

              if not set_a or not set_b:

                  return 0.0

              intersection = len(
                  set_a.intersection(set_b)
              )

              union = len(
                  set_a.union(set_b)
              )

              if union == 0:

                  return 0.0

              return intersection / union


          def content_hash(text):

              normalized = normalize_text(text)

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()


          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  print(
                      "No se pudo leer el historial."
                  )

                  history = []

          else:

              history = []


          # ============================================================
          # COMPATIBILIDAD CON EL HISTORIAL ANTIGUO
          # ============================================================

          if not isinstance(history, list):

              history = []


          # Convertir hashes antiguos a registros
          normalized_history = []

          for item in history:

              if isinstance(item, str):

                  normalized_history.append({
                      "id": item,
                      "title": "",
                      "content_hash": ""
                  })

              elif isinstance(item, dict):

                  normalized_history.append(item)


          history = normalized_history


          # ============================================================
          # BUSCAR RSS
          # ============================================================

          print("========================================")

          print("BUSCANDO NOTICIAS NUEVAS DE GTA VI")

          print("========================================")


          feed = feedparser.parse(RSS_URL)


          if not feed.entries:

              print("No se encontraron noticias.")

              exit(0)


          # ============================================================
          # BUSCAR CANDIDATO
          # ============================================================

          candidate = None


          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()


              if not title or not link:

                  continue


              news_id = hashlib.sha256(
                  link.encode("utf-8")
              ).hexdigest()


              # --------------------------------------------------------
              # MISMO ENLACE
              # --------------------------------------------------------

              if any(
                  item.get("id") == news_id
                  for item in history
              ):

                  print(
                      "IGNORADA: enlace ya procesado."
                  )

                  continue


              candidate = {
                  "id": news_id,
                  "title": title,
                  "link": link
              }

              break


          if candidate is None:

              print("No hay noticias nuevas.")

              exit(0)


          title = candidate["title"]

          link = candidate["link"]

          news_id = candidate["id"]


          print("========================================")

          print("CANDIDATA ENCONTRADA")

          print(title)

          print(link)

          print("========================================")


          # ============================================================
          # DESCARGAR ARTÍCULO
          # ============================================================

          article_text = ""


          try:

              headers = {

                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  )

              }


              page = requests.get(

                  link,

                  headers=headers,

                  timeout=20,

                  allow_redirects=True

              )


              print(
                  f"Estado de la página: {page.status_code}"
              )


              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )


                  for element in soup([
                      "script",
                      "style",
                      "noscript",
                      "svg",
                      "nav",
                      "footer",
                      "header"
                  ]):

                      element.decompose()


                  paragraphs = []


                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )


                      if len(text) >= 50:

                          paragraphs.append(text)


                  article_text = "\n".join(
                      paragraphs
                  )


                  article_text = article_text[:15000]


          except Exception as error:

              print(
                  "No se pudo descargar "
                  "el artículo."
              )

              print(error)


          # ============================================================
          # DETECTAR ARTÍCULO RECICLADO
          # ============================================================

          current_content_hash = content_hash(
              article_text
          )


          duplicate_found = False


          # ============================================================
          # COMPARACIÓN CONTRA HISTORIAL
          # ============================================================

          for old in history:

              old_title = old.get(
                  "title",
                  ""
              )

              old_hash = old.get(
                  "content_hash",
                  ""
              )


              # --------------------------------------------------------
              # MISMO CONTENIDO
              # --------------------------------------------------------

              if (
                  current_content_hash
                  and
                  old_hash
                  and
                  current_content_hash == old_hash
              ):

                  print(
                      "IGNORADA: contenido idéntico "
                      "a una noticia anterior."
                  )

                  duplicate_found = True

                  break


              # --------------------------------------------------------
              # TÍTULO CASI IDÉNTICO
              # --------------------------------------------------------

              if old_title:

                  similarity = title_similarity(
                      title,
                      old_title
                  )


                  if similarity >= 0.88:

                      print(
                          "IGNORADA: título demasiado "
                          "similar a una noticia anterior."
                      )

                      print(
                          f"Similitud: {similarity:.2f}"
                      )

                      duplicate_found = True

                      break


                  # ----------------------------------------------------
                  # MISMA HISTORIA CON TÍTULO DIFERENTE
                  # ----------------------------------------------------

                  word_sim = word_similarity(
                      title,
                      old_title
                  )


                  if (
                      similarity >= 0.72
                      and
                      word_sim >= 0.55
                  ):

                      print(
                          "IGNORADA: posible noticia "
                          "reciclada."
                      )

                      print(
                          f"Título anterior: {old_title}"
                      )

                      print(
                          f"Similitud: {similarity:.2f}"
                      )

                      duplicate_found = True

                      break


          # ============================================================
          # SI ES RECICLADA
          # ============================================================

          if duplicate_found:

              # Guardar también esta URL para que no vuelva
              # a analizarse en los siguientes ciclos.

              history.append({

                  "id": news_id,

                  "title": title,

                  "content_hash": current_content_hash,

                  "status": "duplicate",

                  "date": datetime.now(
                      timezone.utc
                  ).isoformat()

              })


              history = history[-MAX_HISTORY:]


              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      history,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


              print(
                  "Noticia reciclada descartada."
              )

              exit(0)


          # ============================================================
          # CONTENIDO PARA GEMINI
          # ============================================================

          if article_text:

              source_content = article_text

          else:

              source_content = (
                  "No fue posible obtener el contenido "
                  "completo del artículo."
              )


          # ============================================================
          # PROMPT DE GEMINI
          # ============================================================

          prompt = f"""

          Eres el editor oficial de noticias de CAL FAMILY,
          una comunidad dedicada exclusivamente a Grand Theft Auto VI.

          Debes convertir el artículo proporcionado en un
          BORRADOR profesional para Discord.

          ============================================================
          REGLA PRINCIPAL
          ============================================================

          NO INVENTES NADA.

          Solo puedes afirmar información que aparezca
          explícitamente en el título o contenido proporcionado.

          No agregues contexto que no esté en la fuente.

          No inventes:

          - declaraciones de Rockstar Games
          - fechas
          - cifras
          - características
          - personajes
          - mapas
          - precios
          - duración
          - rumores
          - filtraciones
          - anuncios
          - información técnica

          Si la fuente no confirma algo,
          NO lo presentes como confirmado.


          ============================================================
          CLASIFICACIÓN
          ============================================================

          Usa:

          🧭 **Noticias**

          cuando la información sea factual.


          Usa:

          🧭 **Análisis**

          cuando el artículo sea principalmente
          interpretación, opinión o análisis.


          Si es rumor, especulación o información
          no confirmada, debes dejarlo extremadamente claro.


          ============================================================
          FORMATO
          ============================================================

          🧭 **Noticias**

          # [Título atractivo en español]

          [Resumen claro basado únicamente
          en la fuente.]

          **El dato que lo pone en perspectiva**

          [Dato o contexto que aparezca
          realmente en la fuente.]

          **La señal que más dice**

          [El detalle más relevante
          que aparezca en el artículo.]

          **Por qué importa**

          [Explica su relevancia sin agregar
          información externa.]


          Si corresponde:

          ⚠️ **Esto no es un anuncio oficial ni una filtración.**

          [Explica exactamente qué es
          la información y quién la publicó.]


          ============================================================
          REGLAS DE REDACCIÓN
          ============================================================

          - Español natural.
          - Profesional.
          - Claro.
          - Directo.
          - Estilo de medio especializado en GTA VI.
          - No exageres.
          - No repitas la misma idea.
          - No inventes contexto.
          - No uses demasiados emojis.
          - No pongas enlaces.
          - No menciones que eres una IA.
          - No escribas explicaciones fuera del artículo.
          - Debe quedar listo para Discord.


          ============================================================
          ARTÍCULO ORIGINAL
          ============================================================

          TÍTULO:

          {title}


          ENLACE:

          {link}


          CONTENIDO:

          {source_content}


          Genera únicamente el borrador final.
          """


          # ============================================================
          # GEMINI
          # ============================================================

          print("========================================")

          print("ENVIANDO NOTICIA A GEMINI")

          print("========================================")


          gemini_payload = {

              "contents": [

                  {

                      "parts": [

                          {

                              "text": prompt

                          }

                      ]

                  }

              ],

              "generationConfig": {

                  "maxOutputTokens": 1400

              }

          }


          response = requests.post(

              GEMINI_URL,

              params={
                  "key": GEMINI_KEY
              },

              headers={
                  "Content-Type": "application/json"
              },

              json=gemini_payload,

              timeout=90

          )


          if not response.ok:

              print("========================================")

              print("ERROR DE GEMINI")

              print(
                  f"HTTP {response.status_code}"
              )

              print(response.text)

              print("========================================")

              exit(1)


          data = response.json()


          # ============================================================
          # EXTRAER RESPUESTA
          # ============================================================

          try:

              ai_text = (

                  data["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
                  .strip()

              )

          except Exception:

              print(
                  "No se pudo obtener la respuesta "
                  "de Gemini."
              )

              print(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              exit(1)


          if not ai_text:

              print(
                  "Gemini devolvió una respuesta vacía."
              )

              exit(1)


          # ============================================================
          # GUARDAR EN HISTORIAL
          # ============================================================

          history.append({

              "id": news_id,

              "title": title,

              "content_hash": current_content_hash,

              "status": "published",

              "date": datetime.now(
                  timezone.utc
              ).isoformat()

          })


          history = history[-MAX_HISTORY:]


          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "Noticia guardada en el historial."
          )


          # ============================================================
          # FECHA
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # MENSAJE FINAL
          # ============================================================

          final_message = (

              f"<@&{ROLE_ID}>\n\n"

              + ai_text

              + "\n\n"

              + f"🔗 **Fuente original:** {link}"

              + "\n\n"

              + "⚠️ **REVISIÓN REQUERIDA**\n"

              + "Este contenido es un borrador. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias."

              + "\n\n"

              + f"-# Cal Bot · {today}"

          )


          # ============================================================
          # DISCORD
          # ============================================================

          print("========================================")

          print("ENVIANDO UNA SOLA NOTICIA A DISCORD")

          print("========================================")


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {

                  "roles": [
                      ROLE_ID
                  ]

              }

          }


          discord_response = requests.post(

              WEBHOOK,

              json=discord_payload,

              timeout=30

          )


          if not discord_response.ok:

              print("========================================")

              print("ERROR DE DISCORD")

              print(
                  f"HTTP {discord_response.status_code}"
              )

              print(discord_response.text)

              print("========================================")

              exit(1)


          print("========================================")

          print("NOTICIA PUBLICADA CORRECTAMENTE")

          print("========================================")


          PY


      # ============================================================
      # GUARDAR HISTORIAL
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add seen_news.json


          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit -m "Update GTA VI news history"

            git push

          fi
