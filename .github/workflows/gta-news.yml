name: GTA VI News - Cal Bot V7.1

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gta-vi-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Cal Bot V7.1 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python - <<'PY'

          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import feedparser
          import requests

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from urllib.parse import urlparse, parse_qs, urlencode, urlunparse


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          # Modelo económico y estable para automatización.
          GEMINI_MODEL = "gemini-3.5-flash-lite"

          MAX_HISTORY = 500

          # Solo considerar noticias de los últimos 3 días.
          MAX_NEWS_AGE_HOURS = 72

          # Discord permite 2000 caracteres.
          DISCORD_LIMIT = 2000


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:
              print("ERROR: NEWS_DRAFT_WEBHOOK no existe.")
              raise SystemExit(1)

          if not GEMINI_KEY:
              print("ERROR: GEMINI_API_KEY no existe.")
              raise SystemExit(1)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_text(text):
              if not text:
                  return ""

              text = text.lower()

              replacements = {
                  "grand theft auto vi": "gta vi",
                  "grand theft auto 6": "gta vi",
                  "grand theft auto": "gta",
                  "gta 6": "gta vi"
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"[^a-z0-9áéíóúüñ ]+", " ", text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def similarity(a, b):
              a = normalize_text(a)
              b = normalize_text(b)

              if not a or not b:
                  return 0.0

              return SequenceMatcher(None, a, b).ratio()


          def canonical_url(url):
              if not url:
                  return ""

              try:
                  parsed = urlparse(url)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  ignored = {
                      "utm_source",
                      "utm_medium",
                      "utm_campaign",
                      "utm_term",
                      "utm_content",
                      "oc"
                  }

                  clean_query = {
                      key: value
                      for key, value in query.items()
                      if key not in ignored
                  }

                  new_query = urlencode(
                      clean_query,
                      doseq=True
                  )

                  return urlunparse((
                      parsed.scheme,
                      parsed.netloc.lower(),
                      parsed.path.rstrip("/"),
                      "",
                      new_query,
                      ""
                  ))

              except Exception:
                  return url


          def make_id(title, url):
              value = (
                  normalize_text(title)
                  + "|"
                  + canonical_url(url)
              )

              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          def clean_html(text):
              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              return soup.get_text(
                  " ",
                  strip=True
              )


          def extract_article(url):
              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/124 Safari/537.36"
                  )
              }

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=25,
                      allow_redirects=True
                  )

                  print(
                      "Estado de página:",
                      response.status_code
                  )

                  if not response.ok:
                      return "", url

                  final_url = response.url

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  for element in soup.find_all(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer",
                          "header"
                      ]
                  ):
                      element.decompose()

                  paragraphs = []

                  for paragraph in soup.find_all("p"):
                      text = paragraph.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:
                          paragraphs.append(text)

                  article = "\n".join(
                      paragraphs
                  )

                  return article[:16000], final_url

              except Exception as error:
                  print(
                      "No se pudo extraer el artículo:",
                      error
                  )

                  return "", url


          # ============================================================
          # CARGAR HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as file:
                      history = json.load(file)

              except Exception:
                  history = {}

          else:
              history = {}


          if isinstance(history, list):
              history = {
                  "published": history,
                  "titles": [],
                  "content_hashes": []
              }


          history.setdefault("published", [])
          history.setdefault("titles", [])
          history.setdefault("content_hashes", [])


          print("========================================")
          print("CAL BOT V7.1")
          print("EDITOR DE NOTICIAS")
          print("BUSCANDO NOTICIAS...")
          print("========================================")


          # ============================================================
          # RSS
          # ============================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              print("No se encontraron noticias.")
              raise SystemExit(0)


          now = datetime.now(timezone.utc)

          candidate = None


          # ============================================================
          # BUSCAR NOTICIA NUEVA
          # ============================================================

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              google_url = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not google_url:
                  continue


              # --------------------------------------------------------
              # FECHA
              # --------------------------------------------------------

              published_time = None

              if getattr(
                  entry,
                  "published_parsed",
                  None
              ):

                  try:
                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      published_time = datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )

                  except Exception:
                      published_time = None


              if published_time:

                  age = now - published_time

                  if age > timedelta(
                      hours=MAX_NEWS_AGE_HOURS
                  ):
                      print(
                          "Ignorada: noticia demasiado antigua."
                      )

                      continue


              # --------------------------------------------------------
              # ID
              # --------------------------------------------------------

              normalized_url = canonical_url(
                  google_url
              )

              news_id = make_id(
                  title,
                  normalized_url
              )


              if news_id in history["published"]:
                  print(
                      "Ignorada: URL ya procesada."
                  )

                  continue


              # --------------------------------------------------------
              # TÍTULO DUPLICADO
              # --------------------------------------------------------

              duplicate = False

              for old_title in history["titles"]:

                  if similarity(
                      title,
                      old_title
                  ) >= 0.88:

                      duplicate = True
                      break


              if duplicate:

                  print(
                      "Ignorada: título demasiado parecido."
                  )

                  continue


              # --------------------------------------------------------
              # RSS CONTENT
              # --------------------------------------------------------

              summary = clean_html(
                  entry.get(
                      "summary",
                      ""
                  )
              )

              description = clean_html(
                  entry.get(
                      "description",
                      ""
                  )
              )

              rss_content = (
                  summary
                  + "\n"
                  + description
              ).strip()


              candidate = {
                  "id": news_id,
                  "title": title,
                  "google_url": google_url,
                  "rss_content": rss_content
              }

              break


          if candidate is None:

              print("========================================")
              print("NO HAY NOTICIAS NUEVAS.")
              print("========================================")

              raise SystemExit(0)


          title = candidate["title"]
          google_url = candidate["google_url"]
          rss_content = candidate["rss_content"]
          news_id = candidate["id"]


          print("========================================")
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(google_url)
          print("========================================")


          # ============================================================
          # EXTRAER ARTÍCULO
          # ============================================================

          article_text, final_source_url = extract_article(
              google_url
          )


          if len(article_text) >= 300:

              source_content = article_text

          elif len(rss_content) >= 100:

              source_content = rss_content

          else:

              print("DESCARTADA.")
              print(
                  "No hay suficiente información verificable."
              )

              raise SystemExit(0)


          # ============================================================
          # HASH DEL CONTENIDO
          # ============================================================

          content_hash = hashlib.sha256(
              normalize_text(
                  source_content
              ).encode("utf-8")
          ).hexdigest()


          if content_hash in history["content_hashes"]:

              print(
                  "DESCARTADA: contenido idéntico."
              )

              raise SystemExit(0)


          # ============================================================
          # HISTORIAL PARA GEMINI
          # ============================================================

          previous_titles = history["titles"][-50:]

          previous_titles_text = "\n".join(
              f"- {old_title}"
              for old_title in previous_titles
          )


          # ============================================================
          # PROMPT EDITORIAL
          # ============================================================

          prompt = f"""
          Eres CAL BOT, el editor de noticias de CAL FAMILY,
          una comunidad dedicada exclusivamente a Grand Theft Auto VI.

          Tu misión NO es publicar todos los artículos encontrados.

          Tu misión es encontrar únicamente información REALMENTE NUEVA,
          verificable y relevante para la comunidad.

          ============================================================
          REGLA MÁS IMPORTANTE
          ============================================================

          Si el artículo NO aporta información nueva:

          DESCARTA.

          Es preferible no publicar nada antes que publicar una noticia
          reciclada.

          ============================================================
          DESCARTAR SI:
          ============================================================

          - Es el mismo anuncio publicado por otro medio.
          - Es otra cobertura del mismo tráiler.
          - Es otra reacción al Extended Look.
          - Es una opinión de un periodista sin datos nuevos.
          - Es especulación reciclada.
          - Repite información que ya aparece en el historial.
          - Solo cambia el titular.
          - Solo resume una noticia anterior.
          - Habla de expectativas sin información concreta.
          - El artículo no contiene datos verificables.
          - El artículo utiliza rumores como si fueran hechos.
          - El contenido disponible es demasiado limitado.

          ============================================================
          HISTORIAL
          ============================================================

          {previous_titles_text}

          ============================================================
          ARTÍCULO NUEVO
          ============================================================

          TÍTULO:
          {title}

          FUENTE:
          {final_source_url}

          CONTENIDO:
          {source_content}

          ============================================================
          DECISIÓN
          ============================================================

          Debes decidir:

          PUBLICAR

          o

          DESCARTAR

          Solo utiliza PUBLICAR cuando exista información concreta
          que no esté cubierta por el historial.

          ============================================================
          CLASIFICACIÓN
          ============================================================

          "Noticias" = hecho nuevo verificable.

          "Análisis" = análisis periodístico que aporte información
          sustancialmente nueva y útil.

          Una simple opinión NO merece publicación.

          ============================================================
          INFORMACIÓN NO OFICIAL
          ============================================================

          Si una información viene de un desarrollador, periodista,
          medio externo, entrevista o fuente secundaria:

          NO la presentes como anuncio oficial de Rockstar Games.

          Indica claramente su procedencia.

          Nunca inventes:

          - declaraciones
          - fechas
          - cifras
          - precios
          - características
          - personajes
          - duración
          - mapa
          - ventas
          - requisitos
          - información interna de Rockstar

          ============================================================
          RESPUESTA
          ============================================================

          Devuelve ÚNICAMENTE JSON válido:

          {{
            "decision": "PUBLICAR",
            "reason": "motivo corto",
            "category": "Noticias",
            "title": "título en español",
            "content": "texto final"
          }}

          Si descartas:

          {{
            "decision": "DESCARTAR",
            "reason": "motivo corto",
            "category": "Noticias",
            "title": "",
            "content": ""
          }}

          ============================================================
          SI PUBLICAS
          ============================================================

          El texto debe:

          - Estar en español.
          - Ser profesional.
          - Ser claro.
          - Ser atractivo.
          - No exagerar.
          - No inventar.
          - No incluir enlaces.
          - No decir que eres una IA.
          - No repetir información.
          - Tener aproximadamente 500-1000 caracteres.

          Estructura:

          [Introducción]

          **El dato clave**

          [Información concreta]

          **Por qué importa**

          [Importancia para GTA VI]

          ⚠️ **Contexto**

          [Indica si procede de una fuente externa,
          análisis, opinión o información no oficial.]

          No rellenes el texto con información genérica.
          """


          # ============================================================
          # GEMINI
          # ============================================================

          print("========================================")
          print("CAL BOT ESTÁ EVALUANDO LA NOTICIA...")
          print("========================================")


          endpoint = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{GEMINI_MODEL}:generateContent"
              f"?key={GEMINI_KEY}"
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "maxOutputTokens": 1800,
                  "responseMimeType": "application/json"
              }
          }


          gemini_response = None


          # Reintentos para errores temporales.
          for attempt in range(3):

              try:

                  response = requests.post(
                      endpoint,
                      headers={
                          "Content-Type": "application/json"
                      },
                      json=payload,
                      timeout=90
                  )


                  print(
                      "Gemini HTTP:",
                      response.status_code
                  )


                  if response.status_code == 200:

                      gemini_response = response.json()
                      break


                  if response.status_code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      wait_time = 5 * (attempt + 1)

                      print(
                          f"Error temporal. "
                          f"Reintentando en {wait_time}s..."
                      )

                      time.sleep(wait_time)

                      continue


                  print(
                      response.text[:3000]
                  )

                  break


              except Exception as error:

                  print(
                      "Error conectando con Gemini:",
                      error
                  )

                  time.sleep(
                      5 * (attempt + 1)
                  )


          if gemini_response is None:

              print("========================================")
              print("ERROR DE GEMINI")
              print("La noticia NO será marcada como publicada.")
              print("========================================")

              raise SystemExit(1)


          # ============================================================
          # EXTRAER JSON
          # ============================================================

          try:

              candidates = gemini_response.get(
                  "candidates",
                  []
              )

              if not candidates:
                  raise ValueError(
                      "Gemini no devolvió candidates."
                  )


              parts = candidates[0].get(
                  "content",
                  {}
              ).get(
                  "parts",
                  []
              )


              if not parts:
                  raise ValueError(
                      "Gemini no devolvió contenido."
                  )


              ai_text = parts[0].get(
                  "text",
                  ""
              ).strip()


              ai_text = re.sub(
                  r"^```json\s*",
                  "",
                  ai_text,
                  flags=re.IGNORECASE
              )

              ai_text = re.sub(
                  r"\s*```$",
                  "",
                  ai_text
              ).strip()


              result = json.loads(
                  ai_text
              )


          except Exception as error:

              print(
                  "ERROR INTERPRETANDO GEMINI:"
              )

              print(error)

              print(
                  json.dumps(
                      gemini_response,
                      indent=2,
                      ensure_ascii=False
                  )[:5000]
              )

              raise SystemExit(1)


          # ============================================================
          # DECISIÓN DE CAL BOT
          # ============================================================

          decision = str(
              result.get(
                  "decision",
                  "DESCARTAR"
              )
          ).upper().strip()


          reason = str(
              result.get(
                  "reason",
                  ""
              )
          ).strip()


          if decision != "PUBLICAR":

              print("========================================")
              print("DESCARTADA POR CAL BOT")
              print("========================================")
              print(reason)

              raise SystemExit(0)


          ai_title = str(
              result.get(
                  "title",
                  ""
              )
          ).strip()


          ai_content = str(
              result.get(
                  "content",
                  ""
              )
          ).strip()


          category = str(
              result.get(
                  "category",
                  "Noticias"
              )
          ).strip()


          if category not in (
              "Noticias",
              "Análisis"
          ):
              category = "Noticias"


          if not ai_title or not ai_content:

              print(
                  "DESCARTADA: Gemini no generó contenido válido."
              )

              raise SystemExit(0)


          # ============================================================
          # SEGURIDAD FINAL CONTRA DUPLICADOS
          # ============================================================

          for old_title in history["titles"]:

              if similarity(
                  ai_title,
                  old_title
              ) >= 0.90:

                  print(
                      "DESCARTADA: título demasiado parecido "
                      "a una noticia anterior."
                  )

                  raise SystemExit(0)


          # ============================================================
          # LIMPIAR ENLACES GENERADOS POR GEMINI
          # ============================================================

          ai_content = re.sub(
              r"https?://\S+",
              "",
              ai_content
          ).strip()


          # ============================================================
          # FECHA
          # ============================================================

          date_text = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          # ============================================================
          # MENSAJE DISCORD
          # ============================================================

          footer = (
              f"\n\n⚠️ **REVISIÓN REQUERIDA**\n"
              f"Este contenido fue preparado por Cal Bot "
              f"como borrador editorial. "
              f"Revisa la información antes de publicarlo "
              f"en #noticias.\n\n"
              f"-# Cal Bot V7.1 · {date_text}"
          )


          header = (
              f"<@&{ROLE_ID}>\n\n"
              f"🧭 **{category}**\n\n"
              f"# {ai_title}\n\n"
          )


          source_line = (
              f"\n\n🔗 **Fuente original:** "
              f"{final_source_url}"
          )


          # ------------------------------------------------------------
          # CONSTRUIR Y LIMITAR A DISCORD
          # ------------------------------------------------------------

          final_message = (
              header
              + ai_content
              + source_line
              + footer
          )


          if len(final_message) > DISCORD_LIMIT:

              fixed_length = (
                  len(header)
                  + len(source_line)
                  + len(footer)
              )

              available = (
                  DISCORD_LIMIT
                  - fixed_length
                  - 10
              )

              if available < 100:

                  print(
                      "ERROR: no hay espacio suficiente "
                      "para construir el mensaje."
                  )

                  raise SystemExit(1)


              ai_content = ai_content[:available].rstrip()

              final_message = (
                  header
                  + ai_content
                  + source_line
                  + footer
              )


          print(
              "Longitud del mensaje:",
              len(final_message)
          )


          # ============================================================
          # ENVIAR A DISCORD
          # ============================================================

          print("========================================")
          print("ENVIANDO NOTICIA A DISCORD...")
          print("========================================")


          discord_payload = {
              "content": final_message,
              "username": "Cal Bot",
              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }
          }


          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )


          print(
              "Discord HTTP:",
              discord_response.status_code
          )


          if not discord_response.ok:

              print("========================================")
              print("ERROR DE DISCORD")
              print("========================================")

              print(
                  discord_response.text[:3000]
              )

              print(
                  "La noticia NO será guardada."
              )

              raise SystemExit(1)


          # ============================================================
          # SOLO DESPUÉS DE DISCORD:
          # GUARDAR COMO PUBLICADA
          # ============================================================

          history["published"].append(
              news_id
          )

          history["titles"].append(
              ai_title
          )

          history["content_hashes"].append(
              content_hash
          )


          history["published"] = (
              history["published"][-MAX_HISTORY:]
          )

          history["titles"] = (
              history["titles"][-MAX_HISTORY:]
          )

          history["content_hashes"] = (
              history["content_hashes"][-MAX_HISTORY:]
          )


          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  history,
                  file,
                  indent=2,
                  ensure_ascii=False
              )


          print("========================================")
          print("NOTICIA ENVIADA A DISCORD")
          print("HISTORIAL ACTUALIZADO")
          print("========================================")

          PY


      # ============================================================
      # GUARDAR HISTORIAL
      # ============================================================

      - name: Save news history
        run: |
          git config user.name "Cal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el historial."
          else
            git commit -m "Update Cal Bot news history"
            git push
          fi
