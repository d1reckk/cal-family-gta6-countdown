name: GTA VI Countdown

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GTA VI countdown
        run: |
          pip install pillow

          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import random
          import math

          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          TZ = ZoneInfo("America/New_York")

          release = datetime(
              2026, 11, 19, 0, 0, 0,
              tzinfo=TZ
          )

          now = datetime.now(TZ)
          remaining = release - now

          days = max(remaining.days, 0)

          # ============================================================
          # CANVAS
          # ============================================================

          W, H = 1200, 600

          # ============================================================
          # FONDO — DEGRADADO BASADO EN TU CSS
          # ============================================================

          top_color = (20, 4, 22)        # #140416
          color_2 = (34, 9, 31)          # #22091F
          color_3 = (53, 13, 43)         # #350D2B
          color_4 = (80, 19, 56)          # #501338
          bottom_color = (119, 35, 59)   # #77233B

          img = Image.new("RGB", (W, H))
          pixels = img.load()

          def interpolate(c1, c2, t):
              return tuple(
                  int(c1[i] + (c2[i] - c1[i]) * t)
                  for i in range(3)
              )

          # Degradado vertical suave
          for y in range(H):
              t = y / (H - 1)

              if t < 0.25:
                  color = interpolate(
                      top_color,
                      color_2,
                      t / 0.25
                  )

              elif t < 0.45:
                  color = interpolate(
                      color_2,
                      color_3,
                      (t - 0.25) / 0.20
                  )

              elif t < 0.70:
                  color = interpolate(
                      color_3,
                      color_4,
                      (t - 0.45) / 0.25
                  )

              else:
                  color = interpolate(
                      color_4,
                      bottom_color,
                      (t - 0.70) / 0.30
                  )

              for x in range(W):
                  pixels[x, y] = color

          # ============================================================
          # TEXTURA SUTIL
          # ============================================================

          random.seed(6)

          for _ in range(7000):
              x = random.randrange(W)
              y = random.randrange(H)

              base = pixels[x, y]

              delta = random.choice([
                  -3, -2, -1,
                  1, 2, 3
              ])

              pixels[x, y] = tuple(
                  max(0, min(255, c + delta))
                  for c in base
              )

          # ============================================================
          # GLOW RADIAL INFERIOR
          # ============================================================

          glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          glow_pixels = glow.load()

          center_x = W // 2
          center_y = H

          radius_x = W * 0.80
          radius_y = H * 0.60

          for y in range(H):
              for x in range(W):

                  dx = (x - center_x) / radius_x
                  dy = (y - center_y) / radius_y

                  distance = dx * dx + dy * dy

                  if distance < 1:
                      strength = (1 - distance) ** 2

                      alpha = int(
                          55 * strength
                      )

                      glow_pixels[x, y] = (
                          190,
                          35,
                          90,
                          alpha
                      )

          glow = glow.filter(
              ImageFilter.GaussianBlur(35)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              glow
          )

          draw = ImageDraw.Draw(img)

          # ============================================================
          # ESTRELLAS
          # ============================================================

          random.seed(6)

          for _ in range(95):

              x = random.randint(
                  15,
                  W - 15
              )

              y = random.randint(
                  12,
                  230
              )

              radius = random.choice([
                  1, 1, 1, 2
              ])

              draw.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=(255, 220, 235)
              )

          # ============================================================
          # GLOW DEL HORIZONTE
          # ============================================================

          horizon_glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          glow_draw = ImageDraw.Draw(
              horizon_glow
          )

          cx = W // 2
          cy = 540

          for radius in range(
              220,
              5,
              -5
          ):

              alpha = int(
                  2 + (220 - radius) * 0.10
              )

              glow_draw.ellipse(
                  (
                      cx - radius,
                      cy - radius,
                      cx + radius,
                      cy + radius
                  ),
                  fill=(
                      255,
                      110,
                      150,
                      min(alpha, 45)
                  )
              )

          horizon_glow = horizon_glow.filter(
              ImageFilter.GaussianBlur(25)
          )

          img = Image.alpha_composite(
              img,
              horizon_glow
          )

          draw = ImageDraw.Draw(img)

          # ============================================================
          # PALMERAS
          # ============================================================

          def palm(
              draw,
              x,
              base_y,
              height,
              side=1
          ):

              trunk_color = (
                  15,
                  5,
                  22,
                  235
              )

              top_x = x + int(
                  18 * side
              )

              top_y = base_y - height

              points = [
                  (x - 8, base_y),
                  (x + 5, base_y),
                  (top_x + 5, top_y),
                  (top_x - 8, top_y)
              ]

              draw.polygon(
                  points,
                  fill=trunk_color
              )

              leaf_color = (
                  13,
                  4,
                  20,
                  240
              )

              for angle in [
                  -65,
                  -40,
                  -20,
                  5,
                  25,
                  45,
                  70
              ]:

                  rad = math.radians(angle)

                  length = 92

                  end_x = (
                      top_x
                      + int(
                          math.cos(rad)
                          * length
                      )
                  )

                  end_y = (
                      top_y
                      + int(
                          math.sin(rad)
                          * length
                          * 0.55
                      )
                  )

                  draw.line(
                      (
                          top_x,
                          top_y,
                          end_x,
                          end_y
                      ),
                      fill=leaf_color,
                      width=6
                  )

          palm(
              draw,
              18,
              H,
              205,
              1
          )

          palm(
              draw,
              W - 18,
              H,
              220,
              -1
          )

          # ============================================================
          # FUENTES
          # ============================================================

          font_bold = (
              "/usr/share/fonts/"
              "truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          font_condensed = (
              "/usr/share/fonts/"
              "truetype/dejavu/"
              "DejaVuSansCondensed-Bold.ttf"
          )

          title_font = ImageFont.truetype(
              font_bold,
              29
          )

          leonida_font = ImageFont.truetype(
              font_condensed,
              42
          )

          number_font = ImageFont.truetype(
              font_condensed,
              164
          )

          days_font = ImageFont.truetype(
              font_condensed,
              48
          )

          date_font = ImageFont.truetype(
              font_condensed,
              36
          )

          state_font = ImageFont.truetype(
              font_condensed,
              31
          )

          # ============================================================
          # TÍTULO
          # ============================================================

          title = "GRAND THEFT AUTO VI"

          title_glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          glow_draw = ImageDraw.Draw(
              title_glow
          )

          glow_draw.text(
              (W // 2, 47),
              title,
              font=title_font,
              anchor="ma",
              fill=(255, 80, 170, 130)
          )

          title_glow = title_glow.filter(
              ImageFilter.GaussianBlur(10)
          )

          img = Image.alpha_composite(
              img,
              title_glow
          )

          draw = ImageDraw.Draw(img)

          draw.text(
              (W // 2, 47),
              title,
              font=title_font,
              anchor="ma",
              fill=(235, 216, 225),
              stroke_width=1,
              stroke_fill=(190, 93, 143)
          )

          # ============================================================
          # TARJETA CENTRAL
          # ============================================================

          card_left = 200
          card_top = 85
          card_right = 1000
          card_bottom = 484

          # Sombra
          shadow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          shadow_draw = ImageDraw.Draw(
              shadow
          )

          shadow_draw.rounded_rectangle(
              (
                  card_left + 10,
                  card_top + 14,
                  card_right + 10,
                  card_bottom + 14
              ),
              radius=34,
              fill=(0, 0, 0, 150)
          )

          shadow = shadow.filter(
              ImageFilter.GaussianBlur(15)
          )

          img = Image.alpha_composite(
              img,
              shadow
          )

          draw = ImageDraw.Draw(img)

          # ============================================================
          # GLOW DEL BORDE
          # ============================================================

          glow_card = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          glow_card_draw = ImageDraw.Draw(
              glow_card
          )

          glow_card_draw.rounded_rectangle(
              (
                  card_left - 3,
                  card_top - 3,
                  card_right + 3,
                  card_bottom + 3
              ),
              radius=38,
              outline=(255, 92, 166, 110),
              width=10
          )

          glow_card = glow_card.filter(
              ImageFilter.GaussianBlur(8)
          )

          img = Image.alpha_composite(
              img,
              glow_card
          )

          draw = ImageDraw.Draw(img)

          # ============================================================
          # PLACA PRINCIPAL
          # ============================================================

          draw.rounded_rectangle(
              (
                  card_left,
                  card_top,
                  card_right,
                  card_bottom
              ),
              radius=34,
              fill=(249, 247, 239, 255),
              outline=(255, 255, 255, 255),
              width=8
          )

          # Borde interior
          draw.rounded_rectangle(
              (
                  216,
                  99,
                  984,
                  469
              ),
              radius=27,
              outline=(232, 87, 143, 255),
              width=5
          )

          # ============================================================
          # CAJA NOV
          # ============================================================

          draw.rounded_rectangle(
              (
                  243,
                  120,
                  350,
                  187
              ),
              radius=9,
              fill=(238, 235, 225, 255),
              outline=(160, 157, 149, 255),
              width=2
          )

          draw.text(
              (296, 153),
              "NOV",
              font=state_font,
              anchor="mm",
              fill=(22, 20, 24)
          )

          # ============================================================
          # CAJA 2026
          # ============================================================

          draw.rounded_rectangle(
              (
                  868,
                  120,
                  956,
                  187
              ),
              radius=9,
              fill=(245, 207, 49, 255),
              outline=(170, 148, 55, 255),
              width=2
          )

          draw.text(
              (912, 153),
              "2026",
              font=state_font,
              anchor="mm",
              fill=(22, 20, 24)
          )

          # ============================================================
          # LEONIDA
          # ============================================================

          draw.text(
              (W // 2, 151),
              "LEONIDA",
              font=leonida_font,
              anchor="mm",
              fill=(221, 52, 119)
          )

          # ============================================================
          # NÚMERO
          # ============================================================

          number = str(days)

          number_glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          number_draw = ImageDraw.Draw(
              number_glow
          )

          number_draw.text(
              (W // 2, 315),
              number,
              font=number_font,
              anchor="mm",
              fill=(220, 50, 130, 75)
          )

          number_glow = number_glow.filter(
              ImageFilter.GaussianBlur(11)
          )

          img = Image.alpha_composite(
              img,
              number_glow
          )

          draw = ImageDraw.Draw(img)

          draw.text(
              (W // 2 - 42, 315),
              number,
              font=number_font,
              anchor="mm",
              fill=(24, 21, 28),
              stroke_width=2,
              stroke_fill=(24, 21, 28)
          )

          # ============================================================
          # DÍAS
          # ============================================================

          number_bbox = draw.textbbox(
              (0, 0),
              number,
              font=number_font
          )

          number_width = (
              number_bbox[2]
              - number_bbox[0]
          )

          days_x = (
              W // 2
              - 42
              + number_width // 2
              + 25
          )

          draw.text(
              (days_x, 365),
              "DÍAS",
              font=days_font,
              anchor="lm",
              fill=(24, 21, 28)
          )

          # ============================================================
          # DETALLES INFERIORES
          # ============================================================

          draw.ellipse(
              (342, 426, 361, 445),
              fill=(205, 201, 191),
              outline=(174, 170, 160),
              width=2
          )

          draw.ellipse(
              (347, 431, 356, 440),
              fill=(235, 232, 223)
          )

          draw.ellipse(
              (839, 426, 858, 445),
              fill=(205, 201, 191),
              outline=(174, 170, 160),
              width=2
          )

          draw.ellipse(
              (844, 431, 853, 440),
              fill=(235, 232, 223)
          )

          draw.text(
              (W // 2, 438),
              "GOODTIME STATE",
              font=state_font,
              anchor="mm",
              fill=(221, 52, 119)
          )

          # ============================================================
          # FECHA
          # ============================================================

          draw.text(
              (W // 2, 521),
              "19 DE NOVIEMBRE DE 2026",
              font=date_font,
              anchor="mm",
              fill=(255, 245, 250, 255)
          )

          # ============================================================
          # BARRA DE PROGRESO
          # ============================================================

          bar_left = 200
          bar_right = 1000
          bar_y = 560
          bar_h = 8

          draw.rounded_rectangle(
              (
                  bar_left,
                  bar_y,
                  bar_right,
                  bar_y + bar_h
              ),
              radius=5,
              fill=(130, 72, 112, 210)
          )

          start_date = datetime(
              2025,
              5,
              26,
              0,
              0,
              0,
              tzinfo=TZ
          )

          total_seconds = max(
              (
                  release - start_date
              ).total_seconds(),
              1
          )

          elapsed_seconds = max(
              (
                  now - start_date
              ).total_seconds(),
              0
          )

          progress = max(
              0.0,
              min(
                  elapsed_seconds
                  / total_seconds,
                  1.0
              )
          )

          progress_right = int(
              bar_left
              + (
                  bar_right - bar_left
              ) * progress
          )

          if progress_right > bar_left:

              draw.rounded_rectangle(
                  (
                      bar_left,
                      bar_y,
                      progress_right,
                      bar_y + bar_h
                  ),
                  radius=5,
                  fill=(238, 71, 132)
              )

          # ============================================================
          # GUARDAR IMAGEN
          # ============================================================

          img.convert("RGB").save(
              "gta6-countdown.png",
              quality=95
          )

          with open("days.txt", "w") as f:
              f.write(str(days))

          print(
              f"Days remaining: {days}"
          )
          PY

      # ================================================================
      # DISCORD
      # ================================================================

      - name: Create or update Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}

        run: |
          DAYS=$(cat days.txt)

          python - <<PY
          import json

          days = "${DAYS}"

          content = (
              "🌴 **GRAND THEFT AUTO VI**\n\n"
              f"⏳ **Faltan {days} días para GTA VI**"
          )

          with open("payload.json", "w") as f:
              json.dump(
                  {"content": content},
                  f,
                  ensure_ascii=False
              )

          print(content)
          PY

          if [ "$MESSAGE_ID" = "0" ]; then

            echo "Creando el mensaje inicial..."

            RESPONSE=$(curl -sS -X POST \
              "${DISCORD_WEBHOOK}?wait=true" \
              -F "file1=@gta6-countdown.png" \
              -F "payload_json=<payload.json")

            echo "$RESPONSE"

            NEW_ID=$(echo "$RESPONSE" | python -c \
              "import sys,json; print(json.load(sys.stdin)['id'])")

            echo ""
            echo "========================================"
            echo "MENSAJE CREADO CORRECTAMENTE"
            echo "MESSAGE ID: $NEW_ID"
            echo "========================================"

          else

            echo "Actualizando mensaje existente: $MESSAGE_ID"

            curl -sS -X PATCH \
              "${DISCORD_WEBHOOK}/messages/${MESSAGE_ID}" \
              -F "file1=@gta6-countdown.png" \
              -F "payload_json=<payload.json"

            echo ""
            echo "Contador actualizado correctamente."

          fi
