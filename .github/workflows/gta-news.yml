name: GTA VI News - Cal Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Evita que dos ejecuciones del bot trabajen al mismo tiempo.
concurrency:
  group: gta-vi-news-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      # ============================================================
      # CAL BOT
      # ============================================================

      - name: CAL BOT V7 - Editor de Noticias
        env:
          NEWS_DRAFT_WEBHOOK: ${{ secrets.NEWS_DRAFT_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import os
          import json
          import hashlib
          import re
          import time
          import difflib

          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          WEBHOOK = os.environ.get("NEWS_DRAFT_WEBHOOK", "").strip()
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          GEMINI_MODEL = "gemini-3.5-flash-lite"

          RSS_URL = (
              "https://news.google.com/rss/"
              "?q=GTA+VI"
              "&hl=en-US"
              "&gl=US"
              "&ceid=US:en"
          )

          HISTORY_FILE = "seen_news.json"

          ROLE_ID = "1504921814759903343"


          # ============================================================
          # VALIDAR SECRETS
          # ============================================================

          if not WEBHOOK:
              print("ERROR: NEWS_DRAFT_WEBHOOK no existe.")
              exit(1)

          if not GEMINI_KEY:
              print("ERROR: GEMINI_API_KEY no existe.")
              exit(1)


          print("=" * 60)
          print("CAL BOT V7")
          print("EDITOR DE NOTICIAS")
          print("BUSCANDO NOTICIAS...")
          print("=" * 60)


          # ============================================================
          # HISTORIAL
          # ============================================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception:

                  history = {
                      "urls": [],
                      "titles": [],
                      "content_hashes": []
                  }

          else:

              history = {
                  "urls": [],
                  "titles": [],
                  "content_hashes": []
              }


          # Compatibilidad con historial antiguo
          if isinstance(history, list):

              history = {
                  "urls": history,
                  "titles": [],
                  "content_hashes": []
              }


          history.setdefault("urls", [])
          history.setdefault("titles", [])
          history.setdefault("content_hashes", [])


          # ============================================================
          # FUNCIONES
          # ============================================================

          def normalize_text(text):

              text = text.lower()

              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9áéíóúüñ ]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def title_similarity(a, b):

              a = normalize_text(a)
              b = normalize_text(b)

              if not a or not b:
                  return 0

              return difflib.SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()


          def content_hash(text):

              normalized = normalize_text(text)

              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()


          def already_processed(url, title):

              # URL exacta
              if url in history["urls"]:
                  print("Ignorada: URL ya procesada.")
                  return True

              # Título prácticamente idéntico
              for old_title in history["titles"]:

                  similarity = title_similarity(
                      title,
                      old_title
                  )

                  if similarity >= 0.88:

                      print(
                          "Ignorada: título prácticamente "
                          "idéntico a una noticia anterior."
                      )

                      return True

              return False


          # ============================================================
          # OBTENER RSS
          # ============================================================

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:

              print("No se encontraron noticias.")
              exit(0)


          # ============================================================
          # BUSCAR CANDIDATOS
          # ============================================================

          article = None

          for entry in feed.entries:

              title = entry.get(
                  "title",
                  ""
              ).strip()

              link = entry.get(
                  "link",
                  ""
              ).strip()

              if not title or not link:
                  continue

              if already_processed(
                  link,
                  title
              ):
                  continue

              article = {
                  "title": title,
                  "link": link
              }

              break


          if article is None:

              print("=" * 60)
              print("NO HAY NOTICIAS NUEVAS.")
              print("=" * 60)

              exit(0)


          title = article["title"]
          link = article["link"]


          print("=" * 60)
          print("CANDIDATO ENCONTRADO")
          print(title)
          print(link)
          print("=" * 60)


          # ============================================================
          # OBTENER ARTÍCULO REAL
          # ============================================================

          article_text = ""
          final_url = link

          try:

              headers = {
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
              }

              page = requests.get(
                  link,
                  headers=headers,
                  timeout=25,
                  allow_redirects=True
              )

              final_url = page.url

              print(
                  "Estado de página:",
                  page.status_code
              )

              print(
                  "URL final:",
                  final_url
              )

              if page.ok:

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  for element in soup(
                      [
                          "script",
                          "style",
                          "noscript",
                          "svg",
                          "nav",
                          "footer"
                      ]
                  ):

                      element.decompose()

                  paragraphs = []

                  for p in soup.find_all("p"):

                      text = p.get_text(
                          " ",
                          strip=True
                      )

                      if len(text) >= 50:

                          paragraphs.append(text)

                  article_text = "\n".join(
                      paragraphs
                  )

                  article_text = article_text[:15000]

          except Exception as error:

              print(
                  "No se pudo obtener el artículo:"
              )

              print(error)


          # ============================================================
          # EVITAR CONTENIDO VACÍO
          # ============================================================

          if not article_text:

              article_text = (
                  "No fue posible obtener el texto "
                  "completo del artículo. "
                  "Solo se dispone del título y enlace."
              )


          # ============================================================
          # HASH DEL CONTENIDO
          # ============================================================

          current_hash = content_hash(
              article_text
          )

          if current_hash in history["content_hashes"]:

              print("=" * 60)
              print("DESCARTADA: contenido idéntico.")
              print("=" * 60)

              exit(0)


          # ============================================================
          # PROMPT DEL EDITOR
          # ============================================================

          prompt = f"""

          Eres CAL BOT, el editor automático de noticias
          de CAL FAMILY, una comunidad dedicada a
          Grand Theft Auto VI.

          Tu trabajo NO es simplemente resumir artículos.

          Tu trabajo es decidir si una información merece
          aparecer como una NUEVA NOTICIA en CAL FAMILY.

          ============================================================
          REGLA PRINCIPAL
          ============================================================

          SOLO debes aprobar la noticia si aporta información
          REALMENTE NUEVA que no sea simplemente una repetición,
          reacción, resumen, opinión o reformulación de algo
          que ya apareció anteriormente.

          ============================================================
          INFORMACIÓN ANTERIOR
          ============================================================

          TÍTULOS YA PROCESADOS:

          {json.dumps(
              history["titles"][-100:],
              ensure_ascii=False,
              indent=2
          )}

          ============================================================
          NUEVO ARTÍCULO
          ============================================================

          TÍTULO:
          {title}

          ENLACE:
          {link}

          CONTENIDO:
          {article_text}

          ============================================================
          DEBES EVALUAR
          ============================================================

          1. ¿Es información nueva?

          2. ¿Es simplemente otro medio hablando
             de la misma noticia?

          3. ¿Es una reacción u opinión?

          4. ¿Es un artículo reciclado?

          5. ¿Repite información que ya conocemos?

          6. ¿Contiene un dato verificable que aporte algo nuevo?

          7. ¿La información es oficial, reportada,
             análisis, opinión, rumor o especulación?

          ============================================================
          DESCARTAR SI
          ============================================================

          DESCARTA la noticia si:

          - Es una repetición de una noticia anterior.
          - Es una reacción a un tráiler o material ya conocido.
          - Es una opinión de un periodista.
          - Es un artículo reciclado.
          - Solo cambia el título.
          - Solo resume información conocida.
          - Es una especulación sin información nueva.
          - Habla de rumores antiguos.
          - No aporta ningún dato verificable nuevo.
          - Es contenido genérico sobre GTA VI.
          - Es clickbait sin información sustancial.

          ============================================================
          APROBAR SI
          ============================================================

          APRUEBA únicamente si existe información
          sustancialmente nueva y verificable.

          Ejemplos:

          - Nueva información oficial de Rockstar.
          - Nueva declaración verificable de un desarrollador.
          - Nueva entrevista.
          - Nueva información sobre gameplay.
          - Nueva información sobre personajes.
          - Nueva información sobre mapa.
          - Nueva información sobre lanzamiento.
          - Nueva información técnica confirmada.
          - Nueva información publicada por una fuente fiable.

          ============================================================
          RESPUESTA OBLIGATORIA
          ============================================================

          Primero responde EXACTAMENTE:

          APROBAR

          o:

          DESCARTAR

          Después escribe:

          MOTIVO:
          [explicación breve]

          Si es DESCARTAR, NO redactes ninguna noticia.

          Si es APROBAR, después escribe:

          TITULO:
          [título en español]

          TIPO:
          Noticias

          o:

          Análisis

          CONTENIDO:
          [noticia completa]

          ============================================================
          REGLAS DE REDACCIÓN
          ============================================================

          - Español natural.
          - Profesional.
          - Estilo de medio especializado.
          - No inventes información.
          - No inventes cifras.
          - No inventes declaraciones.
          - No inventes fechas.
          - No inventes información de Rockstar.
          - Diferencia claramente hechos de opiniones.
          - No presentes rumores como hechos.
          - No utilices demasiados emojis.
          - No incluyas enlaces.
          - No menciones que eres una IA.
          """


          # ============================================================
          # GEMINI
          # ============================================================

          gemini_url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + GEMINI_MODEL
              + ":generateContent"
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 1800
              }
          }


          print("=" * 60)
          print("CAL BOT ESTÁ EVALUANDO LA NOTICIA...")
          print("=" * 60)


          gemini_response = None


          # ============================================================
          # SISTEMA DE REINTENTOS
          # ============================================================

          for attempt in range(1, 6):

              try:

                  print(
                      f"Intento Gemini {attempt}/5..."
                  )

                  gemini_response = requests.post(
                      gemini_url,
                      params={
                          "key": GEMINI_KEY
                      },
                      headers={
                          "Content-Type":
                              "application/json"
                      },
                      json=payload,
                      timeout=90
                  )

                  status = gemini_response.status_code

                  print(
                      "HTTP Gemini:",
                      status
                  )

                  if status == 200:
                      break

                  # Errores temporales
                  if status in [429, 500, 502, 503, 504]:

                      wait_time = 5 * attempt

                      print(
                          f"Gemini temporalmente "
                          f"no disponible. "
                          f"Esperando {wait_time} segundos..."
                      )

                      time.sleep(
                          wait_time
                      )

                      continue

                  # Error permanente
                  print("=" * 60)
                  print("ERROR DE GEMINI")
                  print("=" * 60)
                  print(
                      gemini_response.text
                  )

                  exit(1)

              except requests.RequestException as error:

                  print(
                      "Error de conexión con Gemini:"
                  )

                  print(error)

                  if attempt < 5:

                      time.sleep(
                          5 * attempt
                      )

                  else:

                      exit(1)


          # ============================================================
          # GEMINI NO RESPONDIÓ
          # ============================================================

          if (
              gemini_response is None
              or gemini_response.status_code != 200
          ):

              print("=" * 60)
              print(
                  "GEMINI NO ESTÁ DISPONIBLE."
              )
              print(
                  "NO SE PUBLICARÁ NADA."
              )
              print("=" * 60)

              exit(0)


          # ============================================================
          # EXTRAER RESPUESTA
          # ============================================================

          data = gemini_response.json()

          try:

              ai_text = (
                  data["candidates"][0]
                  ["content"]["parts"][0]
                  ["text"]
                  .strip()
              )

          except Exception:

              print(
                  "Gemini devolvió una respuesta "
                  "inesperada."
              )

              print(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              exit(1)


          print("=" * 60)
          print("RESPUESTA DEL EDITOR")
          print("=" * 60)
          print(ai_text)


          # ============================================================
          # DECISIÓN
          # ============================================================

          decision_match = re.search(
              r"^\s*(APROBAR|DESCARTAR)\b",
              ai_text,
              re.IGNORECASE
          )


          if not decision_match:

              print(
                  "No se pudo determinar la decisión."
              )

              print(
                  "NO SE PUBLICARÁ."
              )

              exit(0)


          decision = (
              decision_match
              .group(1)
              .upper()
          )


          # ============================================================
          # DESCARTADA
          # ============================================================

          if decision == "DESCARTAR":

              print("=" * 60)
              print("DESCARTADA POR CAL BOT")
              print("=" * 60)

              # Se guarda como procesada para evitar
              # que vuelva a evaluarse continuamente.
              history["urls"].append(link)
              history["titles"].append(title)
              history["content_hashes"].append(
                  current_hash
              )

              history["urls"] = history["urls"][-500:]
              history["titles"] = history["titles"][-500:]
              history["content_hashes"] = history["content_hashes"][-500:]

              with open(
                  HISTORY_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      history,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              exit(0)


          # ============================================================
          # EXTRAER CONTENIDO APROBADO
          # ============================================================

          content_match = re.search(
              r"CONTENIDO:\s*(.*)",
              ai_text,
              re.IGNORECASE | re.DOTALL
          )


          if not content_match:

              print(
                  "Gemini aprobó la noticia pero "
                  "no devolvió CONTENIDO."
              )

              print(
                  "NO SE PUBLICARÁ."
              )

              exit(1)


          news_content = (
              content_match
              .group(1)
              .strip()
          )


          # ============================================================
          # LIMPIAR POSIBLES ENLACES
          # ============================================================

          news_content = re.sub(
              r"https?://\S+",
              "",
              news_content
          ).strip()


          # ============================================================
          # CONSTRUIR MENSAJE
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y")


          final_message = (
              f"<@&{ROLE_ID}>\n\n"
              + news_content
              + "\n\n"
              + f"🔗 **Fuente original:** {link}\n\n"
              + "⚠️ **REVISIÓN REQUERIDA**\n"
              + "Este contenido fue preparado por "
              + "Cal Bot como borrador editorial. "
              + "Revisa la información antes de publicarlo "
              + "en #noticias.\n\n"
              + f"-# Cal Bot · {today}"
          )


          # ============================================================
          # DISCORD
          # ============================================================

          print("=" * 60)
          print("ENVIANDO BORRADOR A DISCORD...")
          print("=" * 60)


          discord_payload = {

              "content": final_message,

              "username": "Cal Bot",

              "allowed_mentions": {
                  "roles": [
                      ROLE_ID
                  ]
              }

          }


          discord_response = requests.post(
              WEBHOOK,
              json=discord_payload,
              timeout=30
          )


          if not discord_response.ok:

              print("=" * 60)
              print("ERROR DE DISCORD")
              print("=" * 60)

              print(
                  discord_response.status_code
              )

              print(
                  discord_response.text
              )

              # IMPORTANTE:
              # No se guarda como procesada si Discord falló.
              # Así podrá intentarse nuevamente.

              exit(1)


          # ============================================================
          # PUBLICACIÓN EXITOSA
          # ============================================================

          print("=" * 60)
          print("BORRADOR ENVIADO CORRECTAMENTE.")
          print("=" * 60)


          # ============================================================
          # GUARDAR HISTORIAL SOLO DESPUÉS DE DISCORD
          # ============================================================

          history["urls"].append(link)

          history["titles"].append(title)

          history["content_hashes"].append(
              current_hash
          )


          history["urls"] = history["urls"][-500:]

          history["titles"] = history["titles"][-500:]

          history["content_hashes"] = (
              history["content_hashes"][-500:]
          )


          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "Historial actualizado."
          )


          PY


      # ============================================================
      # GUARDAR HISTORIAL
      # ============================================================

      - name: Save news history
        run: |

          git config user.name "Cal Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then

            echo "No hay cambios en el historial."

          else

            git commit \
              -m "Update GTA VI news history"

            git push

          fi
